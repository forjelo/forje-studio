<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="FORJE studio — design and motion, exported for real">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="60%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1c1b19"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="1" r="0.8">
      <stop offset="0%" stop-color="#F5620F" stop-opacity="0.26"/>
      <stop offset="50%" stop-color="#F5620F" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F5620F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5620F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5620F" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F5620F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5620F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5620F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5620F" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#F5620F" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>
  <rect width="1200" height="200" fill="url(#grid)"/>
  <rect width="1200" height="200" fill="url(#ember)"/>

  <rect x="-460" y="0" width="460" height="200" fill="url(#sweep)">
    <animate attributeName="x" values="-460;1200" dur="9s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Syne','Segoe UI',system-ui,-apple-system,sans-serif">
    <text x="600" y="92" text-anchor="middle" font-size="56" font-weight="800" fill="#f4f4f5" letter-spacing="2">
      FORJE<tspan fill="#F5620F">·</tspan>studio
    </text>
  </g>

  <rect x="330" y="118" width="540" height="1.5" fill="url(#rule)"/>

  <text x="600" y="150" text-anchor="middle" font-family="'DM Mono','SF Mono',ui-monospace,Menlo,monospace" font-size="13" fill="#8a8a8f" letter-spacing="2.5">
    one html file · no build · no server
  </text>

  <g font-family="'DM Mono',ui-monospace,monospace" font-size="10.5" fill="#5c5c62" letter-spacing="2">
    <text x="600" y="178" text-anchor="middle">MP4 · WEBM · PDF · PPTX · HTML · PNG</text>
  </g>

  <g fill="#F5620F">
    <circle cx="330" cy="118.5" r="2.5">
      <animate attributeName="fill-opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="118.5" r="2.5">
      <animate attributeName="fill-opacity" values="1;0.2;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0" y="196" width="1200" height="4" fill="#F5620F" fill-opacity="0.55"/>
</svg>
