<!-- ARTCSS:BEGIN — bloco gerado de css/art.css (rode ./build.sh após editar) -->
<style id="artcss">
/* =====================================================
   FORJE·studio — art.css
   Tokens da marca + componentes + biblioteca de motion.
   Este arquivo inteiro é embutido nos exports HTML.
   ===================================================== */
.art{position:relative;overflow:hidden;background:var(--b-bg);color:var(--b-fg);
  font-family:var(--fb);font-size:calc(var(--u)*1px);line-height:1.2;-webkit-font-smoothing:antialiased}
.art *{margin:0;box-sizing:border-box}
.art .fh{font-family:var(--fh)}
.art .fm{font-family:var(--fm)}
.art .abs{position:absolute}
.art img{display:block}
.art svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- BIBLIOTECA DE ANIMAÇÕES (entrada) ---------- */
@keyframes kFadeUp{from{opacity:0;transform:translateY(calc(var(--u)*4px))}}
@keyframes kFade{from{opacity:0}}
@keyframes kClip{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kClipUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kScale{from{opacity:0;transform:scale(.82)}}
@keyframes kBlur{from{opacity:0;filter:blur(calc(var(--u)*1.6px))}}
@keyframes kLine{from{transform:scaleX(0)}}
@keyframes kLineY{from{transform:scaleY(0)}}
@keyframes kLetter{from{opacity:0;transform:translateY(1.1em) rotate(5deg)}to{opacity:1;transform:none}}

/* tipografia flexível (ajuste pós-S6):
   .lw — invólucro de palavra do modo letters (quebra só nos espaços)
   text-wrap:balance — linhas naturais redistribuídas com equilíbrio
   .tflex — texto redimensionado pelo usuário: os <br> fixos viram
   quebras flexíveis e o conteúdo reflui para ocupar o novo box */
.art .lw{display:inline-block}
.art h1{text-wrap:balance}
.art .tflex{white-space:normal;text-wrap:balance}
.art .tflex br{display:none}
@keyframes kPop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.06)}100%{opacity:1}}
@keyframes kSlideL{from{opacity:0;transform:translateX(calc(var(--u)*6px))}}
@keyframes kSlideR{from{opacity:0;transform:translateX(calc(var(--u)*-6px))}}
@keyframes kRise{from{opacity:0;transform:translateY(calc(var(--u)*10px)) scale(.94)}}
@keyframes kDraw{from{stroke-dashoffset:var(--dash,320)}to{stroke-dashoffset:0}}
@keyframes kTrace{to{stroke-dashoffset:-260}}
@keyframes kUnfold{from{opacity:0;transform:perspective(900px) rotateX(-86deg)}}
@keyframes kRoll{from{opacity:0;transform:translateX(calc(var(--u)*-9px)) rotate(-150deg)}}
@keyframes kElastic{0%{opacity:0;transform:scaleX(.2)}55%{opacity:1;transform:scaleX(1.12)}75%{transform:scaleX(.96)}100%{opacity:1}}
/* ---------- ambientes (loop) ---------- */
@keyframes kFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-1.4px))}}
@keyframes kOrbit{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(calc(var(--u)*4px),calc(var(--u)*-3px)) scale(1.08)}66%{transform:translate(calc(var(--u)*-3px),calc(var(--u)*3px)) scale(.95)}}
@keyframes kSpin{to{transform:rotate(360deg)}}
@keyframes kPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes kShimmer{from{background-position:200% 0}to{background-position:-200% 0}}
/* novas entradas de elemento/componente */
@keyframes kFlipX{from{opacity:0;transform:perspective(900px) rotateX(64deg)}}
@keyframes kFlipY{from{opacity:0;transform:perspective(900px) rotateY(-56deg)}}
@keyframes kBounce{0%{opacity:0;transform:translateY(calc(var(--u)*-9px))}55%{opacity:1;transform:translateY(calc(var(--u)*1.6px))}78%{transform:translateY(calc(var(--u)*-0.7px))}100%{opacity:1}}
@keyframes kSwing{from{opacity:0;transform:rotate(-9deg)}60%{transform:rotate(3deg)}to{opacity:1}}
@keyframes kRotIn{from{opacity:0;transform:rotate(-10deg) scale(.86)}}
@keyframes kZoomIn{from{opacity:0;transform:scale(1.55)}}
@keyframes kBlurUp{from{opacity:0;filter:blur(calc(var(--u)*1.8px));transform:translateY(calc(var(--u)*4px))}}
@keyframes kSkew{from{opacity:0;transform:skewX(-14deg) translateX(calc(var(--u)*-6px))}}
@keyframes kTrack{from{opacity:0;letter-spacing:.4em}}
@keyframes kIris{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(120% at 50% 50%)}}
@keyframes kWobble{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes kBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

/* ---------- saídas de cena ---------- */
@keyframes kExitFade{to{opacity:0}}
@keyframes kExitWipe{to{clip-path:inset(0 0 100% 0)}}
@keyframes kExitWipeDown{to{clip-path:inset(100% 0 0 0)}}
@keyframes kExitWipeL{to{clip-path:inset(0 100% 0 0)}}
@keyframes kExitWipeR{to{clip-path:inset(0 0 0 100%)}}
@keyframes kExitZoom{to{opacity:0;transform:scale(1.1);filter:blur(calc(var(--u)*1px))}}
@keyframes kExitZoomOut{to{opacity:0;transform:scale(.86)}}
@keyframes kExitSlide{to{opacity:0;transform:translateY(calc(var(--u)*-6px))}}
@keyframes kExitSlideDown{to{opacity:0;transform:translateY(calc(var(--u)*6px))}}
@keyframes kExitSlideL{to{opacity:0;transform:translateX(calc(var(--u)*-8px))}}
@keyframes kExitSlideR{to{opacity:0;transform:translateX(calc(var(--u)*8px))}}
@keyframes kExitBlur{to{opacity:0;filter:blur(calc(var(--u)*2.2px))}}
@keyframes kExitIris{from{clip-path:circle(120% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
@keyframes kExitFlip{to{opacity:0;transform:perspective(1200px) rotateY(26deg) scale(.96)}}
@keyframes kExitSpin{to{opacity:0;transform:rotate(7deg) scale(.9)}}

/* ---------- entradas de cena ---------- */
@keyframes kEnterFade{from{opacity:0}}
@keyframes kEnterWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kEnterWipeUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kEnterWipeDown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kEnterZoom{from{opacity:0;transform:scale(.92)}}
@keyframes kEnterZoomOut{from{opacity:0;transform:scale(1.1)}}
@keyframes kEnterSlideL{from{opacity:0;transform:translateX(calc(var(--u)*9px))}}
@keyframes kEnterSlideR{from{opacity:0;transform:translateX(calc(var(--u)*-9px))}}
@keyframes kEnterSlideUp{from{opacity:0;transform:translateY(calc(var(--u)*9px))}}
@keyframes kEnterSlideDown{from{opacity:0;transform:translateY(calc(var(--u)*-9px))}}
@keyframes kEnterBlur{from{opacity:0;filter:blur(calc(var(--u)*2.2px))}}
@keyframes kEnterFlip{from{opacity:0;transform:perspective(1200px) rotateY(-24deg)}}
@keyframes kEnterSpin{from{opacity:0;transform:rotate(-7deg) scale(.94)}}

/* ---------- saídas de item composto (fim da cena, no vídeo) ---------- */
@keyframes kXFade{to{opacity:0}}
@keyframes kXFall{to{opacity:0;transform:translateY(calc(var(--u)*5px))}}
@keyframes kXRise{to{opacity:0;transform:translateY(calc(var(--u)*-5px))}}
@keyframes kXShrink{to{opacity:0;transform:scale(.55)}}
@keyframes kXBlur{to{opacity:0;filter:blur(calc(var(--u)*1.8px))}}
@keyframes kXSlideL{to{opacity:0;transform:translateX(calc(var(--u)*-7px))}}
@keyframes kXSlideR{to{opacity:0;transform:translateX(calc(var(--u)*7px))}}
@keyframes kXSpin{to{opacity:0;transform:rotate(12deg) scale(.8)}}

/* aplicação: elementos com data-anim animam quando .art está em .play */
.art [data-anim]{--d:0s;--dur:.9s}
.art.play [data-anim=fade]{animation:kFade var(--dur) ease-out var(--d) both}
.art.play [data-anim=fade-up]{animation:kFadeUp var(--dur) cubic-bezier(.2,.8,.2,1) var(--d) both}
.art.play [data-anim=clip]{animation:kClip var(--dur) cubic-bezier(.7,0,.2,1) var(--d) backwards}
.art.play [data-anim=clip-up]{animation:kClipUp var(--dur) cubic-bezier(.7,0,.2,1) var(--d) backwards}
.art.play [data-anim=scale]{animation:kScale var(--dur) cubic-bezier(.2,.8,.2,1) var(--d) both}
.art.play [data-anim=blur]{animation:kBlur var(--dur) ease-out var(--d) both}
.art.play [data-anim=line]{animation:kLine var(--dur) cubic-bezier(.7,0,.2,1) var(--d) both;transform-origin:left}
.art.play [data-anim=line-y]{animation:kLineY var(--dur) cubic-bezier(.7,0,.2,1) var(--d) both;transform-origin:top}
.art.play [data-anim=pop]{animation:kPop .7s cubic-bezier(.2,.8,.2,1) var(--d) both}
.art.play [data-anim=slide-l]{animation:kSlideL var(--dur) cubic-bezier(.2,.8,.2,1) var(--d) both}
.art.play [data-anim=slide-r]{animation:kSlideR var(--dur) cubic-bezier(.2,.8,.2,1) var(--d) both}
.art.play [data-anim=rise]{animation:kRise var(--dur) cubic-bezier(.2,.8,.2,1) var(--d) both}
.art.play [data-anim=letters] .ltr{opacity:0;animation:kLetter .6s cubic-bezier(.2,.8,.2,1) var(--ld) both}
.art.play [data-anim=draw] :is(path,circle,rect,line,polyline,ellipse){stroke-dasharray:var(--dash,320);animation:kDraw calc(var(--dur)*1.4) cubic-bezier(.7,0,.2,1) var(--d) both}
/* família de transformação SVG (irmãs da draw) */
.art.play [data-anim=sketch] :is(path,circle,rect,line,polyline,ellipse){stroke-dasharray:var(--dash,320);animation:kDraw calc(var(--dur)*1.6) steps(9,end) var(--d) both}
.art.play [data-anim=ink] :is(path,circle,rect,line,polyline,ellipse){stroke-dasharray:var(--dash,320);animation:kDraw calc(var(--dur)*1.5) cubic-bezier(.7,0,.2,1) var(--d) both}
.art.play [data-anim=ink]{animation:kFade calc(var(--dur)*2) ease var(--d) backwards}
.art.play [data-anim=trace] :is(path,circle,rect,line,polyline,ellipse){stroke-dasharray:7 6;animation:kTrace 2.6s linear var(--d) infinite}
.art.play [data-anim=unfold]{animation:kUnfold var(--dur) cubic-bezier(.22,1,.36,1) var(--d) backwards;transform-origin:50% 0}
.art.play [data-anim=roll]{animation:kRoll calc(var(--dur)*1.15) cubic-bezier(.22,1,.36,1) var(--d) backwards}
.art.play [data-anim=elastic]{animation:kElastic calc(var(--dur)*1.2) cubic-bezier(.22,1,.36,1) var(--d) backwards;transform-origin:0 50%}
.art.play [data-anim=float]{animation:kFloat 5s ease-in-out var(--d) infinite;animation-composition:add}
.art.play [data-anim=orbit]{animation:kOrbit 9s ease-in-out var(--d) infinite;animation-composition:add}
