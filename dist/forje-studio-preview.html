            if(x !== 'none') layer.classList.add('exit-'+x);      // saída da cena
          }
          if(onTick) onTick((elapsed+Math.min(t,dur))/total, i);
          if(t>=dur) return res();
          requestAnimationFrame(step); };
        step();
      });
      if(F.player._tok===tok) layer.remove();
      elapsed += dur;
    }
    if(F.player._tok===tok){ F.player.playing=false; if(onTick) onTick(1,-1); }
  };
  F.stopTimeline = function(){ F.player._tok++; F.player.playing=false; };

  /* ---------- stepping determinístico (para export) ----------
     Prepara a cena idx pausada e devolve um "seeker": seek(tLocal)
     posiciona todas as animações (entrada, loops e saída) em t. */
  F.prepScene = async function(idx){
    const el = art();
    el.classList.remove('settle'); el.classList.add('play');
    el.innerHTML = '';
    const sc = F.state.timeline[idx];
    const layer = F.mountScene(idx);
    el.appendChild(layer);
    await new Promise(r=>requestAnimationFrame(r));
    let anims = layer.getAnimations({subtree:true});
    anims.forEach(a=>{ try{a.pause();}catch(e){} });
    const dur = +sc.dur||2000, exitAt = Math.max(0, dur-EXIT_MS);
    let exiting = false, exitAnims = [];
    return {
      layer, dur,
      seek(t){
        anims.forEach(a=>{ try{a.currentTime = t;}catch(e){} });
        F.updateCounters(layer, t);
        if(t>=exitAt && !exiting && idx < F.state.timeline.length-1){
          exiting = true;
          layer.classList.add('exiting');
          if((sc.exit||'fade')!=='none') layer.classList.add('exit-'+(sc.exit||'fade'));
          exitAnims = layer.getAnimations({subtree:true}).filter(a=>!anims.includes(a));
          exitAnims.forEach(a=>{ try{a.pause();}catch(e){} });
        }
        if(exiting) exitAnims.forEach(a=>{ try{a.currentTime = t-exitAt;}catch(e){} });
      }
    };
  };
})(window.FORMA);

</script>
<script>
/* ===== js/core/render.js ===== */
/* =====================================================
   FORJE·studio — core/render.js
   Tokens → arte. Renderiza design estático (template) ou
   preview da cena selecionada (motion), e ajusta o fit.
   ===================================================== */
(function(F){
  const $ = s=>document.querySelector(s);
  const art = () => $('#art');

  /* vars inline da arte (tokens+fontes+overrides) para um índice qualquer
     do modo atual — usada pelo render principal e pelas miniaturas do
     navegador de slides/cenas (F.ui.syncNav) */
  F.artVarsFor = function(idx){
    const b = F.state.brand, fmt = F.FORMATS[F.state.format];
    const u = Math.min(fmt.w, fmt.h)/100;
    /* pool de fontes display: o seed escolhe uma por arte/slide */
    const pool = [b.fontH, ...(b.fontPool||[]).filter(f=>f!==b.fontH)];
    const pi = Math.floor(F.rngOf((F.seedOf ? F.seedOf('type') : F.state.seed)*13 + idx*7)()*pool.length);
    /* paleta: variante brand-first quando o eixo divergiu do mestre
       (eixo null = identidade → projetos existentes não mudam, P1).
       Variante escolhida por PROJETO (sem idx): o carrossel inteiro
       mantém a mesma leitura de marca. Overrides por arte (artTokens)
       são aplicados DEPOIS — a escolha explícita do usuário vence. */
    let B = b;
    const pSeed = (F.state.seeds||{}).palette;
    if(pSeed != null && F.paletteVariant){
      const v = F.paletteVariant(Math.floor(F.rngOf(pSeed*31 + 7)()*997), b);
      B = {...b, ...v};
    }
    const vars = {'--b-bg':B.bg,'--b-fg':B.fg,'--b-p1':B.p1,'--b-p2':B.p2,'--b-ac':B.ac,
      '--b-r':b.radius,'--u':u,'--fh':F.fontCSS(pool[pi]||b.fontH),'--fb':F.fontCSS(b.fontB),'--fm':"'IBM Plex Mono',monospace"};
    /* cores desta arte: sobrepõem os tokens da marca (fundo recolore
       véus e sobreposições, que usam color-mix com --b-bg) */
    const tk = (F.state.mode==='design' ? 'd|' : 'm|') + idx;
    const ov = (F.state.artTokens||{})[tk] || null;
    if(ov) for(const k in ov){ if(k!=='canvas') vars['--b-'+k] = ov[k]; }
    /* prancheta: fundo sólido real; véus seguem junto se 'fundo' não tiver override próprio */
    if(ov && ov.canvas && !ov.bg) vars['--b-bg'] = ov.canvas;
    let inline = `width:${fmt.w}px;height:${fmt.h}px;`;
    for(const k in vars) inline += `${k}:${vars[k]};`;
    return inline;
  };
  F.applyTokens = function(){
    F._fontCSS = null;   // fontes podem ter mudado — reembutir no próximo export
    const idx = F.state.mode==='design' ? F.state.cur : F.state.curScene;
    art().setAttribute('style', F.artVarsFor(idx));
  };

  /* zoom da prancheta: multiplicador sobre a escala de encaixe (1 = fit) */
  F.view = F.view || { z:1 };
  F.fit = function(){
    const st = $('#stage'), fmt = F.FORMATS[F.state.format];
    if(!st) return;
    /* superfície reduzida: respiro proporcional em volta + teto de escala */
    const padX = Math.max(48, st.clientWidth*0.085), padY = Math.max(40, st.clientHeight*0.085);
    const base = Math.min((st.clientWidth-padX*2)/fmt.w, (st.clientHeight-padY*2)/fmt.h, .92);
    const s = base * (F.view.z || 1);
    const w = $('#fitwrap');
    w.style.transform = `scale(${s})`;
    w.style.width = fmt.w*s+'px'; w.style.height = fmt.h*s+'px';
    w.style.transformOrigin = 'top left';
    const zl = document.getElementById('zoomLabel');
    if(zl) zl.textContent = Math.round(s*100)+'%';
  };
  F.zoomBy = function(f){
    F.view.z = Math.min(8, Math.max(.2, (F.view.z||1)*f));
    if(Math.abs(F.view.z-1) < .04) F.view.z = 1;   // ímã no encaixe
    F.fit();
  };
  F.zoomReset = function(){ F.view.z = 1; F.fit(); };

  F.render = function(replay=true){
    F.applyTokens();
    const s = F.state, el = art();
    F.stopTimeline && F.stopTimeline();
    if(s.mode === 'design'){
      const slide = s.slides[s.cur];
      const r = F.rngOf((F.seedOf ? F.seedOf('layout') : s.seed)*7919 + (F.artOff ? F.artOff(s.cur) : s.cur*101));
      /* template EFETIVO: slide.tpl (roteamento por conteúdo, fase 2.2)
         com fallback no global — projetos sem slide.tpl não mudam (P1) */
      const tplId = (slide && slide.tpl) || s.tpl;
      el.innerHTML = (F.templates.get(tplId)||F.templates.get('manifesto')).render(slide, r);
      if(F.composeHTML) el.insertAdjacentHTML('beforeend', F.composeHTML(F.editKey()));
    } else {
      /* motion: preview estático da cena selecionada */
      el.innerHTML = '';
      if(s.timeline.length){
        const layer = F.mountScene(Math.min(s.curScene, s.timeline.length-1));
        if(layer){ el.appendChild(layer); F.updateCounters(layer, 99999); }
      } else {
        el.innerHTML = `<div style="position:absolute;inset:0;display:grid;place-items:center;color:color-mix(in srgb,var(--b-fg) 50%,transparent);font-family:var(--fm)">adicione cenas na timeline →</div>`;
      }
    }
    /* velocidade global */
    if(F.state.speed !== 1){
      el.querySelectorAll('[data-anim]').forEach(n=>{
        const cs = getComputedStyle(n);
        n.style.setProperty('--dur', (parseFloat(cs.getPropertyValue('--dur'))||.9)/F.state.speed+'s');
      });
    }
    if(F.applyEdits) F.applyEdits();     // edições manuais persistidas (design e preview de cena)
    /* replay=false NÃO pode derrubar o .play: cenas/templates escondem
       elementos pelo estado final da animação (fill both) — sem .play esses
       "fantasmas" apareceriam todos de uma vez na prancheta. O .settle
       mantém o .play e salta as animações direto ao quadro final. */
    el.classList.remove('play','settle');
    if(replay){ void el.offsetWidth; el.classList.add('play'); }
    else el.classList.add('play','settle');
    F.fit(); F.autoSave();
    if(F.ui && F.ui.syncStagebar) F.ui.syncStagebar();
  };

  F.replayMotion = function(){
    const el = art();
    el.classList.remove('play'); void el.offsetWidth; el.classList.add('play');
  };
})(window.FORMA);

</script>
<script>
/* ===== js/core/export.js ===== */
/* =====================================================
   FORJE·studio — core/export.js
   PNG/JPG (lote do carrossel), HTML standalone e VÍDEO.
   Vídeo: WebCodecs + mp4-muxer (vendor) → .mp4 real com
   timestamp exato por frame — a duração do arquivo é a da
   timeline, independente da velocidade de rasterização.
   Fallback: MediaRecorder → .webm (tempo de parede).
   ===================================================== */
(function(F){
  const $ = s=>document.querySelector(s);
  const art = () => $('#art');

  F.download = function(blob, name){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.rel = 'noopener';
    document.body.appendChild(a);          // Firefox exige a âncora no DOM
    a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  };
  F.toast = function(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('on'), 4200); };
  F.prog = function(on, title){ $('#prog').classList.toggle('on', on); if(title) $('#progTitle').textContent = title; };
  F.progSet = function(p, txt){ $('#progBar').style.width = (p*100).toFixed(0)+'%';
    $('#progTxt').textContent = txt || (p*100).toFixed(0)+'%'; };

  /* ---------- higiene de exportação ----------
     Nada da FERRAMENTA pode sair na arte: guias de snap (#guideDV/H),
     retângulo de seleção múltipla (#mqBox) e os contornos (outline) de
     seleção/trava do modo edição são removidos antes de rasterizar ou
     serializar. Os contornos são restaurados depois — a edição ao vivo
     do usuário não é perturbada por um export. */
  const GUIDE_SEL = '#guideDV,#guideDH,#guideV,#guideH,#mqBox';
  function clearGuides(){ art().querySelectorAll(GUIDE_SEL).forEach(g=>g.remove()); }
  function stashOutlines(){
    const stash = [];
    art().querySelectorAll('*').forEach(el=>{
      if(el.style && el.style.outline){
        stash.push([el, el.style.outline, el.style.outlineOffset]);
        el.style.outline = ''; el.style.outlineOffset = '';
      }
    });
    return ()=>stash.forEach(([el,o,off])=>{ if(el.isConnected){ el.style.outline=o; el.style.outlineOffset=off; } });
  }
  /* clone da arte 100% limpo para serialização (HTML standalone) */
  F.cleanArtHTML = function(){
    const clone = art().cloneNode(true);
    clone.querySelectorAll(GUIDE_SEL).forEach(g=>g.remove());
    clone.querySelectorAll('*').forEach(el=>{
      if(el.style && el.style.outline){ el.style.outline=''; el.style.outlineOffset=''; }
      if(el.dataset && el.dataset.locked) delete el.dataset.locked;
    });
    clone.className = 'art play';
    return clone.outerHTML;
  };

  /* ---------- rasterização ----------
     Primário: html-to-image (SVG foreignObject — o navegador desenha,
     fiel a color-mix/clip-path/texto vazado). Fallback: html2canvas.
     CSS de fontes embutido uma vez e reutilizado nos frames. */
  F._fontCSS = null;
  F.snapshot = async function(scale=1, bg=null){
    const el = art();
    clearGuides();
    const restore = stashOutlines();
    try{
      if(window.htmlToImage){
        try{
          if(F._fontCSS == null){
            try{ F._fontCSS = await htmlToImage.getFontEmbedCSS(el); }
            catch(e){ F._fontCSS = ''; }
          }
          const opts = {pixelRatio:scale, fontEmbedCSS:F._fontCSS, fontEmbedCss:F._fontCSS,
            cacheBust:false, ...(bg?{backgroundColor:bg}:{})};
          return await htmlToImage.toCanvas(el, opts);
        }catch(e){ console.warn('html-to-image falhou, tentando html2canvas:', e); }
      }
      if(window.html2canvas)
        return await html2canvas(el, {scale, backgroundColor:bg, logging:false, useCORS:true});
      throw new Error('nenhum motor de rasterização disponível (verifique a conexão)');
    } finally { restore(); }
  };
  F.settleStatic = async function(){
    clearGuides();
    /* determinístico: .settle força TODA animação (inclusive as infinitas —
       float/orbit/pulse/trace/marquee…) a concluir no estado final em 1ms.
       Sem isso, animações infinitas eram capturadas no meio do voo e cada
       export saía diferente, com elementos deslocados uns sobre os outros. */
    art().classList.add('settle');
    art().getAnimations({subtree:true}).forEach(a=>{ try{a.finish();}catch(e){} });
    const layer = art().querySelector('.scenelayer');
    if(layer) F.updateCounters(layer, 99999);
    await new Promise(r=>requestAnimationFrame(r));
    await new Promise(r=>setTimeout(r,60));
  };

  /* ---------- raster (PNG/JPG) ----------
     Nome do arquivo (Eixo 3): slide.name (campo mapeado no lote) tem
     precedência — `forje_{nome}_{WxH}.ext`; sem name, o esquema legado
     byte a byte. Colisões de nome ganham sufixo _sN. */
  F.exportName = function(i, fmtKey, type, many){
    const s = F.state, fmt = F.FORMATS[fmtKey||s.format];
    const ext = type==='jpeg' ? 'jpg' : type;
    const nm = s.mode==='design' && (s.slides[i]||{}).name;
    if(nm){
      const dup = s.slides.some((x,j)=>j!==i && x.name===nm);
      return `forje_${nm}_${fmt.w}x${fmt.h}${dup?'_s'+(i+1):''}.${ext}`;
    }
    return `forje_${s.mode==='design'?s.tpl:'cena'}_${fmt.w}x${fmt.h}${many?'_s'+(i+1):''}.${ext}`;
  };
  F.exportRaster = async function(type){
    const s = F.state, fmt = F.FORMATS[s.format];
    const many = s.mode==='design' && s.slides.length>1, keep = s.cur;
    F.prog(true, many ? 'Exportando carrossel…' : 'Exportando imagem…'); F.progSet(0);
    try{
      const n = many ? s.slides.length : 1;
      for(let i=0;i<n;i++){
        if(many){ s.cur = i; F.render(); }
        await F.settleStatic();
        const cv = await F.snapshot(1, type==='jpeg' ? s.brand.bg : null);
        const blob = await new Promise(r=>cv.toBlob(r, 'image/'+type, .94));
        F.download(blob, F.exportName(i, s.format, type, many));
        F.progSet((i+1)/n, `slide ${i+1}/${n}`);
        await new Promise(r=>setTimeout(r,300));
      }
      F.toast(many ? `${n} slides exportados em ${type.toUpperCase()}.` : `Exportado em ${type.toUpperCase()} (${fmt.w}×${fmt.h}).`);
    }catch(e){ console.error(e); F.toast('Falha na exportação: '+e.message); }
    finally{ if(many){ s.cur = keep; } F.render(); F.prog(false); }
  };

  /* ---------- Eixo 3 · fase 3.2 — um conteúdo, todas as mídias ----------
     Itera os formatos raster escolhidos: para cada um, muda s.format,
     re-renderiza (os templates escalam por --u) e exporta o carrossel
     inteiro. Restaura formato e slide no finally — o palco volta como
     estava mesmo se um formato falhar no meio. */
  F.exportFormats = async function(keys, type){
    type = type||'png';
    const s = F.state;
    const fmts = (keys && keys.length ? keys : Object.keys(F.FORMATS)).filter(k=>F.FORMATS[k] && !F.FORMATS[k].doc);
    if(!fmts.length){ F.toast('Escolha ao menos um formato.'); return; }
    const many = s.mode==='design' && s.slides.length>1;
    const n = many ? s.slides.length : 1, total = fmts.length*n;
    const keepF = s.format, keepC = s.cur;
    let done = 0;
    F.prog(true, 'Exportando todos os formatos…'); F.progSet(0);
    try{
      for(const fk of fmts){
        s.format = fk; 
        for(let i=0;i<n;i++){
          if(many) s.cur = i;
          F.render();
          await F.settleStatic();
          const cv = await F.snapshot(1, type==='jpeg' ? s.brand.bg : null);
          const blob = await new Promise(r=>cv.toBlob(r, 'image/'+type, .94));
          F.download(blob, F.exportName(i, fk, type, many));
          done++;
          F.progSet(done/total, `${F.FORMATS[fk].n} · ${done}/${total}`);
          await new Promise(r=>setTimeout(r,300));
        }
      }
      F.toast(`${total} imagens exportadas em ${fmts.length} formatos.`);
    }catch(e){ console.error(e); F.toast('Falha na exportação: '+e.message); }
    finally{ s.format = keepF; s.cur = keepC; F.render(); F.prog(false); }
  };

  /* ---------- HTML standalone ---------- */
  function fontsLinkHTML(){ const l = document.getElementById('gfonts'); return l ? l.outerHTML : ''; }
  function customFontsCSS(){
    return (F.state.brand.customFonts||[]).map(cf=>
      `@font-face{font-family:'${cf.name}';src:url(${cf.data})}`).join('\n');
  }
  F.exportHTML = function(){
    F.applyTokens();
    const s = F.state, artcss = document.getElementById('artcss').textContent;
    let bodyContent, script = '';
    if(s.mode==='design'){
      bodyContent = F.cleanArtHTML();
    } else {
      const scenes = s.timeline.map((sc,i)=>({
        html: F.mountScene(i).innerHTML, dur:+sc.dur||2000, exit:sc.exit||'fade'}));
      bodyContent = `<div class="art play" id="art" style="${art().getAttribute('style')}"></div>`;
      script = `<script>
const SC=${JSON.stringify(scenes)};const art=document.getElementById('art');const EXIT=450;
function counters(l,t){l.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.to||0,sf=el.dataset.suffix||'';
  const p=Math.min(1,Math.max(0,(t-200)/1400)),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString('pt-BR')+sf;});}
(async function loop(){for(;;){art.innerHTML='';for(let i=0;i<SC.length;i++){const l=document.createElement('div');
  l.className='scenelayer';l.innerHTML=SC[i].html;art.appendChild(l);
  const p=l.previousElementSibling;if(p){p.classList.add('exit-'+SC[i-1].exit);setTimeout(()=>p.remove(),EXIT+60);}
  const t0=performance.now();await new Promise(res=>{(function st(){const t=performance.now()-t0;counters(l,t);
    if(t>=SC[i].dur)return res();requestAnimationFrame(st);})();});}
  await new Promise(r=>setTimeout(r,600));}})();
<\/script>`;
    }
    const doc = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${F.esc(s.brand.name)} — FORJE export</title>
${fontsLinkHTML()}<style>${customFontsCSS()}\n${artcss}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0e}</style></head>
<body>${bodyContent}${script}</body></html>`;
    F.download(new Blob([doc],{type:'text/html'}), `forje_${s.mode==='design'?s.tpl:'motion'}.html`);
    F.toast(s.mode==='design'
      ? 'HTML standalone exportado — abre em qualquer navegador com o motion embutido.'
      : 'Player HTML exportado — a timeline roda em loop em qualquer navegador.');
  };

  /* ---------- VÍDEO ---------- */
  const FPS = 15, STEP = 1000/FPS;

  async function pickAvcCodec(w, h){
    const cands = ['avc1.420033','avc1.420029','avc1.42001f','avc1.4d0029'];
    for(const codec of cands){
      try{
        const r = await VideoEncoder.isConfigSupported({codec, width:w, height:h,
          bitrate:6_000_000, framerate:FPS});
        if(r.supported) return codec;
      }catch(e){}
    }
    return null;
  }

  F.videoName = function(isMotion, opts){
    return (opts && opts.name) || `forje_${isMotion?'timeline':F.state.tpl}.mp4`;
  };
  /* opts (Eixo 3 · fase 3.3): { name    — nome do arquivo,
       quiet — não abre/fecha o painel de progresso nem dá toast (o lote gerencia),
       progBase, progSpan — mapeiam o progresso interno numa fatia do total }.
     Sem opts, comportamento idêntico ao anterior. */
  F.exportVideo = async function(opts){
    opts = opts||{};
    const P = (p,txt)=>F.progSet((opts.progBase||0)+p*(opts.progSpan??1), txt);
    const s = F.state;
    if(s.mode==='motion' && !s.timeline.length) return F.toast('Adicione cenas à timeline primeiro.');
    if(!('VideoEncoder' in window) || !('VideoFrame' in window) || !window.Mp4Muxer){
      F.toast('WebCodecs indisponível neste navegador — gerando WebM (tempo real).');
      return F.exportWebMLegacy();
    }
    const fmt = F.FORMATS[s.format];
    const vscale = Math.min(1, 720/Math.min(fmt.w,fmt.h));
    let W = Math.round(fmt.w*vscale), H = Math.round(fmt.h*vscale);
    W -= W%2; H -= H%2;                                  // h264 exige dimensões pares
    const codec = await pickAvcCodec(W,H);
    if(!codec){
      F.toast('H.264 indisponível — gerando WebM (tempo real).');
      return F.exportWebMLegacy();
    }
    const isMotion = s.mode==='motion';
    if(!opts.quiet){ F.prog(true, 'Renderizando MP4 frame a frame…'); F.progSet(0); }
    const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx = cv.getContext('2d');
    const {Muxer, ArrayBufferTarget} = Mp4Muxer;
    const muxer = new Muxer({target:new ArrayBufferTarget(),
      video:{codec:'avc', width:W, height:H}, fastStart:'in-memory'});
    let encErr = null;
    const enc = new VideoEncoder({
      output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),
      error:e=>{ encErr = e; }});
    enc.configure({codec, width:W, height:H, bitrate:6_000_000, framerate:FPS});
    let fno = 0;
    const pushFrame = async (tMs)=>{
      if(encErr) throw encErr;
      const snap = await F.snapshot(vscale, s.brand.bg);
      ctx.drawImage(snap, 0, 0, W, H);
      const vf = new VideoFrame(cv, {timestamp:Math.round(tMs*1000), duration:Math.round(STEP*1000)});
      enc.encode(vf, {keyFrame: fno % (FPS*2) === 0});    // keyframe a cada 2s
      vf.close(); fno++;
      if(enc.encodeQueueSize > 4) await new Promise(r=>setTimeout(r,30)); // não afogar o encoder
    };
    try{
      if(isMotion){
        const total = F.totalDuration(); let doneMs = 0;
        for(let i=0;i<s.timeline.length;i++){
          const seeker = await F.prepScene(i);
          for(let t=0; t<seeker.dur; t+=STEP){
            seeker.seek(t);
            await pushFrame(doneMs + t);
            P((doneMs+t)/total, `cena ${i+1}/${s.timeline.length} · ${((doneMs+t)/1000).toFixed(1)}s`);
          }
          doneMs += seeker.dur;
        }
      } else {
        F.render(); F.replayMotion();
        await new Promise(r=>requestAnimationFrame(r));
        const anims = art().getAnimations({subtree:true});
        anims.forEach(a=>{ try{a.pause();}catch(e){} });
        const dur = Math.round(4200/s.speed), frames = Math.ceil(dur/STEP);
        for(let f=0; f<=frames; f++){
          const t = f*STEP;
          anims.forEach(a=>{ try{a.currentTime=t;}catch(e){} });
          await pushFrame(t);
          P(f/frames, `frame ${f}/${frames}`);
        }
      }
      await enc.flush(); muxer.finalize();
      const buf = muxer.target.buffer;
      F.download(new Blob([buf],{type:'video/mp4'}), F.videoName(isMotion, opts));
      const secs = isMotion ? (F.totalDuration()/1000).toFixed(1) : (4.2/s.speed).toFixed(1);
      if(!opts.quiet) F.toast(`MP4 exportado — ${secs}s, ${FPS}fps, duração exata da timeline.`);
    }catch(e){ console.error(e); F.toast('Falha no vídeo: '+e.message); if(opts.quiet) throw e;
    }finally{ try{ enc.close(); }catch(e){} if(!opts.quiet){ F.prog(false); F.render(); } }
  };

  /* fallback: MediaRecorder (tempo de parede — pode sair mais lento
     se a máquina não rasterizar em tempo real) */
  F.exportWebMLegacy = async function(){
    const s = F.state, fmt = F.FORMATS[s.format];
    const isMotion = s.mode==='motion';
    const vscale = Math.min(1, 720/Math.min(fmt.w,fmt.h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(fmt.w*vscale); cv.height = Math.round(fmt.h*vscale);
    const ctx = cv.getContext('2d');
    const stream = cv.captureStream(30);
    const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    if(!mime) return F.toast('Este navegador não suporta gravação de vídeo.');
    const chunks = []; const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:8_000_000});
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r=>rec.onstop=r);
    F.prog(true, 'Renderizando WebM…'); F.progSet(0);
    try{
      rec.start();
      const drawFrame = async (t0)=>{
        const snap = await F.snapshot(vscale, s.brand.bg);
        ctx.drawImage(snap, 0, 0, cv.width, cv.height);
        const spent = performance.now()-t0;
        await new Promise(r=>setTimeout(r, Math.max(0, STEP-spent)));
      };
      if(isMotion){
        const total = F.totalDuration(); let doneMs = 0;
        for(let i=0;i<s.timeline.length;i++){
          const seeker = await F.prepScene(i);
          for(let t=0; t<seeker.dur; t+=STEP){
            const t0 = performance.now();
            seeker.seek(t);
            await drawFrame(t0);
            F.progSet((doneMs+t)/total, `cena ${i+1}/${s.timeline.length}`);
          }
          doneMs += seeker.dur;
        }
      } else {
        F.render(); F.replayMotion();
        await new Promise(r=>requestAnimationFrame(r));
        const anims = art().getAnimations({subtree:true});
        anims.forEach(a=>{ try{a.pause();}catch(e){} });
        const dur = Math.round(4200/s.speed), frames = Math.ceil(dur/STEP);
        for(let f=0; f<=frames; f++){
          const t0 = performance.now();
          anims.forEach(a=>{ try{a.currentTime=f*STEP;}catch(e){} });
          await drawFrame(t0);
          F.progSet(f/frames, `frame ${f}/${frames}`);
        }
      }
      rec.stop(); await done;
      F.download(new Blob(chunks,{type:'video/webm'}), `forje_${isMotion?'timeline':s.tpl}.webm`);
      F.toast('WebM exportado (modo compatibilidade — timing depende da máquina).');
    }catch(e){ console.error(e); try{rec.stop();}catch(_){} F.toast('Falha no vídeo: '+e.message); }
    finally{ F.prog(false); F.render(); }
  };
})(window.FORMA);

</script>
<script>
/* ===== js/core/export-doc.js ===== */
/* =====================================================
   FORJE·studio — core/export-doc.js
   Exportação de DOCUMENTOS, 100% no navegador e sem
   dependências externas:
   · PDF  — cada slide/cena vira uma página; a arte é
     rasterizada e ocupa a página INTEIRA (full-bleed,
     sem bordas: o conteúdo se adequa perfeitamente).
     Formato E-book A4 sai em página A4 exata; os demais
     saem em páginas na proporção exata da arte.
   · PPTX — pacote OOXML real (zip escrito à mão) com um
     slide por arte, pronto para PowerPoint e para
     importar no Google Apresentações. O tamanho do
     slide segue a proporção do formato escolhido.
   Design → páginas/slides do carrossel.
   Motion → cada cena vira uma página/slide (frame final).
   ===================================================== */
(function(F){
  const te = new TextEncoder();

  /* ---------- CRC-32 (zip) ---------- */
  const CRC_T = (()=>{ const t = new Uint32Array(256);
    for(let i=0;i<256;i++){ let c=i;
      for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1;
      t[i]=c>>>0; } return t; })();
  const crc32 = d => { let c=0xFFFFFFFF;
    for(let i=0;i<d.length;i++) c = CRC_T[(c^d[i])&255] ^ (c>>>8);
    return (c^0xFFFFFFFF)>>>0; };

  /* ---------- escritor ZIP (método stored) ---------- */
  function makeZip(files){                 // files: [{name, data:string|Uint8Array}]
    const parts=[], cdir=[]; let off=0;
    files.forEach(f=>{
      const nm = te.encode(f.name);
      const d  = typeof f.data==='string' ? te.encode(f.data) : f.data;
      const crc = crc32(d);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true);
      lh.setUint32(14,crc,true); lh.setUint32(18,d.length,true); lh.setUint32(22,d.length,true);
      lh.setUint16(26,nm.length,true);
      parts.push(new Uint8Array(lh.buffer), nm, d);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
      ch.setUint32(16,crc,true); ch.setUint32(20,d.length,true); ch.setUint32(24,d.length,true);
      ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
      cdir.push(new Uint8Array(ch.buffer), nm);
      off += 30 + nm.length + d.length;
    });
    let cdLen=0; cdir.forEach(c=>cdLen+=c.length);
    const eo = new DataView(new ArrayBuffer(22));
    eo.setUint32(0,0x06054b50,true);
    eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
    eo.setUint32(12,cdLen,true); eo.setUint32(16,off,true);
    const all=[...parts,...cdir,new Uint8Array(eo.buffer)];
    let total=0; all.forEach(c=>total+=c.length);
    const out=new Uint8Array(total); let p=0;
    all.forEach(c=>{ out.set(c,p); p+=c.length; });
    return out;
  }

  /* ---------- captura de todas as artes do modo atual ---------- */
  async function eachArt(onArt, label){
    const s = F.state;
    const design = s.mode==='design';
    const n = design ? s.slides.length : s.timeline.length;
    if(!design && !n) throw new Error('adicione cenas à timeline primeiro');
    const keep = design ? s.cur : s.curScene;
    try{
      for(let i=0;i<n;i++){
        if(design) s.cur = i; else s.curScene = i;
        F.render();
        await F.settleStatic();
        const cv = await F.snapshot(1, s.brand.bg);      // fundo sólido: páginas não têm alfa
        await onArt(cv, i, n);
        F.progSet((i+1)/n, `${label} ${i+1}/${n}`);
        await new Promise(r=>setTimeout(r,40));
      }
    } finally {
      if(design) s.cur = keep; else s.curScene = keep;
    }
    return n;
  }
  const canvasJPEG = cv => new Promise((res,rej)=>
    cv.toBlob(async b=>{ if(!b) return rej(new Error('rasterização vazia'));
      res(new Uint8Array(await b.arrayBuffer())); }, 'image/jpeg', .92));

  /* =====================================================
     PDF — escritor mínimo com imagens JPEG (DCTDecode)
  ===================================================== */
  function buildPDF(pages){                // pages: [{jpeg,w,h,ptW,ptH}]
    const objs = [];
    const kids = pages.map((_,i)=>`${3+i*3} 0 R`).join(' ');
    objs.push(`<< /Type /Catalog /Pages 2 0 R >>`);
    objs.push(`<< /Type /Pages /Count ${pages.length} /Kids [${kids}] >>`);
    pages.forEach((pg,i)=>{
      const cn = 3+i*3+1, xn = 3+i*3+2;
      objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pg.ptW} ${pg.ptH}] /Resources << /XObject << /Im${i} ${xn} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cn} 0 R >>`);
      const cont = `q ${pg.ptW} 0 0 ${pg.ptH} 0 0 cm /Im${i} Do Q`;
      objs.push({head:`<< /Length ${cont.length} >>`, data:te.encode(cont)});
      objs.push({head:`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpeg.length} >>`, data:pg.jpeg});
    });
    const parts=[ Uint8Array.from([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]) ]; // %PDF-1.4 + binário
    const offs=[]; let off=parts[0].length;
    const push = u8 => { parts.push(u8); off += u8.length; };
    objs.forEach((o,i)=>{
      offs.push(off);
      push(te.encode(`${i+1} 0 obj\n${typeof o==='string'?o:o.head}\n`));
      if(typeof o!=='string'){ push(te.encode('stream\n')); push(o.data); push(te.encode('\nendstream\n')); }
      push(te.encode('endobj\n'));
    });
    const xrefOff = off;
    let xr = `xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
    offs.forEach(o=>{ xr += String(o).padStart(10,'0')+' 00000 n \n'; });
    xr += `trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xrefOff}\n%%EOF`;
    push(te.encode(xr));
    let total=0; parts.forEach(c=>total+=c.length);
    const out=new Uint8Array(total); let p=0;
    parts.forEach(c=>{ out.set(c,p); p+=c.length; });
    return out;
  }

  F.exportPDF = async function(){
    const s = F.state, fmt = F.FORMATS[s.format];
    /* página em pontos: A4 exato quando a proporção bate (E-book A4);
       senão, página na proporção exata da arte (96px → 72pt) */
    const isA4 = Math.abs((fmt.w/fmt.h) - (210/297)) < 0.012;
    const ptW = isA4 ? 595.28 : +(fmt.w*0.75).toFixed(2);
    const ptH = isA4 ? 841.89 : +(fmt.h*0.75).toFixed(2);
    F.prog(true, 'Compondo PDF…'); F.progSet(0);
    try{
      const pages=[];
      const n = await eachArt(async cv=>{
        pages.push({jpeg:await canvasJPEG(cv), w:cv.width, h:cv.height, ptW, ptH});
      }, 'página');
      F.progSet(1, 'escrevendo arquivo…');
      const pdf = buildPDF(pages);
      F.download(new Blob([pdf],{type:'application/pdf'}), `forje_${s.mode==='design'?s.tpl:'timeline'}.pdf`);
      F.toast(`PDF exportado — ${n} página${n>1?'s':''}${isA4?' em A4':''}, conteúdo full-bleed ajustado ao documento.`);
    }catch(e){ console.error(e); F.toast('Falha no PDF: '+e.message); }
    finally{ F.render(); F.prog(false); }
  };

  /* =====================================================
     PPTX — pacote OOXML mínimo (1 imagem full-bleed/slide)
  ===================================================== */
  const XML = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n`;
  const NS = {
    a:'http://schemas.openxmlformats.org/drawingml/2006/main',
    r:'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
    p:'http://schemas.openxmlformats.org/presentationml/2006/main',
    ct:'http://schemas.openxmlformats.org/package/2006/content-types',
    rel:'http://schemas.openxmlformats.org/package/2006/relationships',
  };
  const R = {
    doc:'http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument',
    master:'http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster',
    layout:'http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout',
    slide:'http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide',
    theme:'http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme',
    image:'http://schemas.openxmlformats.org/officeDocument/2006/relationships/image',
    core:'http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties',
    app:'http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties',
  };
  const rels = items => XML+`<Relationships xmlns="${NS.rel}">`+
    items.map(([id,type,tg])=>`<Relationship Id="${id}" Type="${type}" Target="${tg}"/>`).join('')+`</Relationships>`;
  const emptyTree = `<p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr></p:spTree></p:cSld>`;
  function theme1(b){
    const hex = c => String(c||'#888888').replace('#','').slice(0,6).toUpperCase();
    return XML+`<a:theme xmlns:a="${NS.a}" name="Forje"><a:themeElements><a:clrScheme name="Forje"><a:dk1><a:srgbClr val="000000"/></a:dk1><a:lt1><a:srgbClr val="FFFFFF"/></a:lt1><a:dk2><a:srgbClr val="${hex(b.bg)}"/></a:dk2><a:lt2><a:srgbClr val="${hex(b.fg)}"/></a:lt2><a:accent1><a:srgbClr val="${hex(b.ac)}"/></a:accent1><a:accent2><a:srgbClr val="${hex(b.p1)}"/></a:accent2><a:accent3><a:srgbClr val="${hex(b.p2)}"/></a:accent3><a:accent4><a:srgbClr val="${hex(b.ac)}"/></a:accent4><a:accent5><a:srgbClr val="${hex(b.p1)}"/></a:accent5><a:accent6><a:srgbClr val="${hex(b.p2)}"/></a:accent6><a:hlink><a:srgbClr val="0563C1"/></a:hlink><a:folHlink><a:srgbClr val="954F72"/></a:folHlink></a:clrScheme><a:fontScheme name="Forje"><a:majorFont><a:latin typeface="Arial"/><a:ea typeface=""/><a:cs typeface=""/></a:majorFont><a:minorFont><a:latin typeface="Arial"/><a:ea typeface=""/><a:cs typeface=""/></a:minorFont></a:fontScheme><a:fmtScheme name="Office"><a:fillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:fillStyleLst><a:lnStyleLst><a:ln w="6350"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="12700"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="19050"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln></a:lnStyleLst><a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst><a:bgFillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:bgFillStyleLst></a:fmtScheme></a:themeElements></a:theme>`;
  }
  const slideXML = (cx,cy) => XML+`<p:sld xmlns:a="${NS.a}" xmlns:r="${NS.r}" xmlns:p="${NS.p}"><p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr><p:pic><p:nvPicPr><p:cNvPr id="2" name="Arte Forje"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="rId2"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic></p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>`;

  F.exportPPTX = async function(){
    const s = F.state, fmt = F.FORMATS[s.format];
    /* EMU: lado maior = 12192000 (o 16:9 padrão sai exatamente 13,33×7,5in) */
    const k = 12192000/Math.max(fmt.w, fmt.h);
    const cx = Math.round(fmt.w*k), cy = Math.round(fmt.h*k);
    F.prog(true, 'Compondo PPTX…'); F.progSet(0);
    try{
      const imgs=[];
      const n = await eachArt(async cv=>{ imgs.push(await canvasJPEG(cv)); }, 'slide');
      F.progSet(1, 'empacotando…');
      const files = [];
      const overrides = imgs.map((_,i)=>
        `<Override PartName="/ppt/slides/slide${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`).join('');
      files.push({name:'[Content_Types].xml', data: XML+`<Types xmlns="${NS.ct}"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/><Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/><Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/><Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>${overrides}<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`});
      files.push({name:'_rels/.rels', data: rels([['rId1',R.doc,'ppt/presentation.xml'],['rId2',R.core,'docProps/core.xml'],['rId3',R.app,'docProps/app.xml']])});
      const brand = F.esc(s.brand.name||'Forje');
      files.push({name:'docProps/core.xml', data: XML+`<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>${brand} — FORJE·studio</dc:title><dc:creator>FORJE·studio</dc:creator></cp:coreProperties>`});
      files.push({name:'docProps/app.xml', data: XML+`<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>FORJE·studio</Application><Slides>${n}</Slides></Properties>`});
      files.push({name:'ppt/presentation.xml', data: XML+`<p:presentation xmlns:a="${NS.a}" xmlns:r="${NS.r}" xmlns:p="${NS.p}"><p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst><p:sldIdLst>${imgs.map((_,i)=>`<p:sldId id="${256+i}" r:id="rId${2+i}"/>`).join('')}</p:sldIdLst><p:sldSz cx="${cx}" cy="${cy}"/><p:notesSz cx="6858000" cy="9144000"/></p:presentation>`});
      files.push({name:'ppt/_rels/presentation.xml.rels', data: rels([
        ['rId1',R.master,'slideMasters/slideMaster1.xml'],
        ...imgs.map((_,i)=>[`rId${2+i}`,R.slide,`slides/slide${i+1}.xml`]),
        [`rId${2+imgs.length}`,R.theme,'theme/theme1.xml'],
      ])});
      files.push({name:'ppt/slideMasters/slideMaster1.xml', data: XML+`<p:sldMaster xmlns:a="${NS.a}" xmlns:r="${NS.r}" xmlns:p="${NS.p}">${emptyTree}<p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/><p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst></p:sldMaster>`});
      files.push({name:'ppt/slideMasters/_rels/slideMaster1.xml.rels', data: rels([['rId1',R.layout,'../slideLayouts/slideLayout1.xml'],['rId2',R.theme,'../theme/theme1.xml']])});
      files.push({name:'ppt/slideLayouts/slideLayout1.xml', data: XML+`<p:sldLayout xmlns:a="${NS.a}" xmlns:r="${NS.r}" xmlns:p="${NS.p}" type="blank" preserve="1">${emptyTree}<p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sldLayout>`});
      files.push({name:'ppt/slideLayouts/_rels/slideLayout1.xml.rels', data: rels([['rId1',R.master,'../slideMasters/slideMaster1.xml']])});
      files.push({name:'ppt/theme/theme1.xml', data: theme1(s.brand)});
      imgs.forEach((jpg,i)=>{
        files.push({name:`ppt/slides/slide${i+1}.xml`, data: slideXML(cx,cy)});
        files.push({name:`ppt/slides/_rels/slide${i+1}.xml.rels`, data: rels([['rId1',R.layout,'../slideLayouts/slideLayout1.xml'],['rId2',R.image,`../media/image${i+1}.jpeg`]])});
        files.push({name:`ppt/media/image${i+1}.jpeg`, data: jpg});
      });
      const zip = makeZip(files);
      F.download(new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'}),
        `forje_${s.mode==='design'?s.tpl:'timeline'}.pptx`);
      F.toast(`PPTX exportado — ${n} slide${n>1?'s':''}, abre no PowerPoint e importa no Google Apresentações.`);
    }catch(e){ console.error(e); F.toast('Falha no PPTX: '+e.message); }
    finally{ F.render(); F.prog(false); }
  };
})(window.FORMA);

</script>
<script>
/* ===== js/ui/editor.js ===== */
/* =====================================================
   FORJE·studio — ui/editor.js
   Edição manual + camada de COMPOSIÇÃO.
   ✎ liga o modo: clique seleciona (clicar de novo no
   mesmo ponto CICLA para o elemento de baixo — nada fica
   inacessível), arrastar MOVE, A−/A+ escalam, 🗑 apaga,
   ↺ desfaz a arte atual. Ops: {eid, k, dx, dy, del}.
   SELEÇÃO MÚLTIPLA: arrastar no fundo da prancheta abre
   um retângulo (marquee) que seleciona vários; Shift+
   clique soma/remove; mover, escalar, travar, animar,
   colorir e apagar valem para o conjunto inteiro.
   Composição: itens (componentes/ícones/imagens) soltos
   sobre a arte, guardados em state.compose[chave] e
   presentes em preview, player e exports.
   ===================================================== */
(function(F){
  const $ = s=>document.querySelector(s);
  const art = () => document.getElementById('art');
  F.editor = { on:false, sel:null, sels:[], _pt:null, _cycle:0 };

  F.editKey = function(){
    const s = F.state;
    /* fase 2.2: chave usa o template EFETIVO (slide.tpl || s.tpl) —
       slides sem tpl próprio produzem exatamente a chave antiga (P1) */
    return s.mode==='design'
      ? `d|${(s.slides[s.cur]||{}).tpl || s.tpl}|${s.cur}|${s.seed}`
      : `m|${s.curScene}|${(s.timeline[s.curScene]||{}).type||''}`;
  };
  F.motionKey = idx => `m|${idx}|${(F.state.timeline[idx]||{}).type||''}`;

  /* ---------- composição ---------- */
  F.composeHTML = function(key){
    const items = (F.state.compose||{})[key] || [];
    const ctx = composeCtx();
    return items.map(it=>{
      let inner='';
      if(it.comp==='__logo'){
        const src = F.state.brand.logo;
        const lw = +it.size || 16;
        inner = src
          ? `<img src="${src}" style="width:calc(var(--u)*${lw}px);display:block">`
          : `<div class="imgw mask-window" style="width:calc(var(--u)*${lw}px);aspect-ratio:3/1"><div class="ph">SUA LOGO</div></div>`;
      }
      else if(it.comp==='__icon'){
        const col = (it.color||'ac')[0]==='#' ? it.color : `var(--b-${it.color||'ac'})`;
        const sz = +it.size || 6;
        if(it.shape==='chip')
          inner = `<span style="width:calc(var(--u)*${(sz*1.8).toFixed(1)}px);aspect-ratio:1;border-radius:50%;background:${col};color:var(--b-bg);display:grid;place-items:center;font-size:calc(var(--u)*${sz}px)">${F.icon(it.icon)}</span>`;
        else if(it.shape==='tile')
          inner = `<span style="width:calc(var(--u)*${(sz*1.8).toFixed(1)}px);aspect-ratio:1;border-radius:calc(var(--b-r)*0.6px);background:color-mix(in srgb,${col} 18%,transparent);border:1px solid color-mix(in srgb,${col} 55%,transparent);color:${col};display:grid;place-items:center;font-size:calc(var(--u)*${sz}px)">${F.icon(it.icon)}</span>`;
        else inner = `<span style="font-size:calc(var(--u)*${sz}px);color:${col};display:flex">${F.icon(it.icon)}</span>`;
      }
      else if(it.comp==='__img'){
        const src = it.src || ctx.img;                       // própria > do slide/cena
        const mk = {circle:'mask-circle', blob:'mask-blob', arch:'mask-arch', window:'mask-window'}[it.mask] || 'mask-window';
        const ar = (it.mask==='circle'||it.mask==='blob') ? '1' : '4/3';
        inner = src
          ? `<div class="imgw ${mk}" style="width:calc(var(--u)*26px);aspect-ratio:${ar}"><img src="${src}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></div>`
          : `<div class="imgw mask-window" style="width:calc(var(--u)*26px);aspect-ratio:4/3"><div class="ph">SUA IMAGEM</div></div>`;
      }
      else if(it.comp==='__text'){
        /* texto livre: fonte (marca/catálogo/custom), tamanho, peso, itálico,
           alinhamento, caixa alta, entrelinha e tracking; cor via it.c */
        const p = it.props||{};
        const fam = p.font==='__body' ? 'var(--fb)' : p.font==='__mono' ? 'var(--fm)'
                  : (p.font && p.font!=='__display') ? F.fontCSS(p.font) : 'var(--fh)';
        const sz = +p.size||6, wt = +p.weight||700, lh = +p.lh||1.15, ls = (p.ls!=null?+p.ls:0);
        inner = `<div style="font-family:${fam};font-size:calc(var(--u)*${sz}px);font-weight:${wt};line-height:${lh};letter-spacing:${ls}em;text-align:${p.align||'left'};${p.upper?'text-transform:uppercase;':''}${p.italic?'font-style:italic;':''}white-space:pre-wrap;overflow-wrap:break-word">${F.nl(p.text||'Seu texto')}</div>`;
      }
      else if(it.comp==='__shape'){
        /* forma geométrica: delega para a biblioteca F.shapes (lib/shapes.js),
           que cobre todas as formas novas e reproduz as legadas 1:1.
           O bloco abaixo permanece como fallback de segurança. */
        const p = it.props||{};
        const sdef = F.shapes && F.shapes.get(p.kind||'rect');
        if(sdef){ inner = sdef.html(p); }
        else{
        const sw = +p.sw||16, sh = +p.sh||16, kind = p.kind||'rect';
        const fill = p.nofill ? 'transparent' : (p.fill||'#F5620F');
        const op = (p.op!=null ? +p.op : 100)/100, rot = +p.rot||0;
        const rad = +p.rad||0, bw = +p.bw||0, bc = p.bc||p.fill||'#F5620F';
        const W = `width:calc(var(--u)*${sw}px);`, H = `height:calc(var(--u)*${sh}px);`;
        const base = `opacity:${op};rotate:${rot}deg;`;
        const bord = bw ? `border:calc(var(--u)*${bw}px) solid ${bc};` : '';
        const box = `box-sizing:border-box;`;
        if(kind==='circle')       inner = `<div style="${W}${H}${base}${bord}${box}border-radius:50%;background:${fill}"></div>`;
        else if(kind==='pill')    inner = `<div style="${W}${H}${base}${bord}${box}border-radius:999px;background:${fill}"></div>`;
        else if(kind==='ring')    inner = `<div style="${W}${H}${base}${box}border:calc(var(--u)*${bw||1.6}px) solid ${p.fill||'#F5620F'};border-radius:50%;background:transparent"></div>`;
        else if(kind==='line')    inner = `<div style="${W}height:calc(var(--u)*${Math.max(.2,bw||.7)}px);${base}border-radius:999px;background:${p.fill||'#F5620F'}"></div>`;
        else if(kind==='tri')     inner = `<div style="${W}${H}${base}clip-path:polygon(50% 0,100% 100%,0 100%);background:${fill}"></div>`;
        else if(kind==='star')    inner = `<div style="${W}${H}${base}clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:${fill}"></div>`;
        else /* rect */           inner = `<div style="${W}${H}${base}${bord}${box}border-radius:calc(var(--u)*${rad}px);background:${fill}"></div>`;
        }
      }
      else{ const def = F.components.get(it.comp); if(!def) return '';
        inner = def.html(F.rngOf(it.seed||1), {...ctx, ...(it.props||{})}); }
      const sized = it.w ? ' sized' : '';
      const wcss = it.w ? `width:${it.w}%;` : '';
      const zcss = (it.z!=null && it.z!=='') ? `z-index:${it.z};` : '';
      const xa = it.xanim ? ` data-xanim="${it.xanim}"` : '';
      const d = (it.d!=null && it.d!=='') ? (+it.d||0) : .2;
      const ccss = it.c ? `color:${it.c};--b-ac:${it.c};--b-p1:${it.c};--b-p2:${it.c};` : '';
      const kcss = (it.k && it.k!==1) ? `scale:${it.k};` : '';
      return `<div class="abs compitem${sized}" data-cid="${it.id}" data-anim="${it.anim||'pop'}"${xa} style="left:${it.x}%;top:${it.y}%;${wcss}${ccss}${kcss}${zcss}--d:${d}s">${inner}</div>`;
    }).join('');
  };
  function composeCtx(){
    const s = F.state;
    const src = s.mode==='design' ? s.slides[s.cur] : (s.timeline[s.curScene]||{});
    return {title:src.title||'', sub:src.sub||'', kicker:src.kicker||'',
      cta:s.cta, img:src.img||null, icon:src.icon||s.accentIcon};
  }
  F.addComposeItem = function(comp, x, y, extra={}){
    const s = F.state, key = F.editKey();
    s.compose = s.compose || {}; s.compose[key] = s.compose[key] || [];
    s.compose[key].push({id:'c'+Date.now()+Math.floor(Math.random()*999),
      comp, x:+x.toFixed(1), y:+y.toFixed(1), seed:Math.floor(Math.random()*9999), ...extra});
    F.autoSave(); F.render();
    if(F.ui && F.ui.refreshActive) F.ui.refreshActive();
    if(!F.editor.on) $('#btnEdit').click();
    F.toast('Componente adicionado — arraste para posicionar, A−/A+ para escalar.');
  };
  F.removeComposeItem = function(key, id){
    const list = (F.state.compose||{})[key]; if(!list) return;
    const i = list.findIndex(o=>o.id===id); if(i>=0) list.splice(i,1);
    F.autoSave(); F.render();
    if(F.ui && F.ui.refreshActive) F.ui.refreshActive();
  };

  /* ---------- edições (genérico por raiz+chave) ---------- */
  F.applyEditsIn = function(root, key){
    const els = [...root.querySelectorAll('[data-anim], .abs')];
    els.forEach((el,i)=>el.dataset.eid = i);
    const list = (F.state.edits||{})[key] || [];
    list.forEach(op=>{
      const el = els[op.eid]; if(!el) return;
      if(op.del){ el.style.display = 'none'; return; }
      if(op.k && op.k !== 1) el.style.scale = op.k;   // 'scale' não desloca offsets (zoom deslocava)
      if(op.w){                                          // largura de TEXTO (resize lateral):
        el.style.width = op.w + '%';                     // o conteúdo REFLUI para o novo box
        el.style.maxWidth = 'none';
        el.classList.add('tflex');                       // <br> fixos viram quebra flexível
      }
      if(op.dx || op.dy) el.style.translate = `${op.dx||0}px ${op.dy||0}px`;
      if(op.anim) el.dataset.anim = op.anim;            // troca/adiciona animação
      if(op.c) paintColor(el, op.c);                     // recolore texto/ícones/acentos
      if(op.z!=null){                                    // camada persistida (frente/trás)
        el.style.zIndex = op.z;
        if(!el.classList.contains('abs') && !el.classList.contains('compitem'))
          el.style.position = 'relative';               // z-index exige elemento posicionado
      }
      if(op.lock) el.dataset.locked = '1';
    });
    /* itens compostos travados */
    const comp = (F.state.compose||{})[key] || [];
    comp.filter(o=>o.lock).forEach(o=>{
      const el = root.querySelector(`[data-cid="${o.id}"]`); if(el) el.dataset.locked='1'; });
    if(F.editor && F.editor.on) F.paintLocks && F.paintLocks();
  };
  /* marcação visual dos travados enquanto o modo edição está ativo */
  F.paintLocks = function(){
    art().querySelectorAll('[data-locked]').forEach(el=>{
      if(!F.editor.sels.includes(el)){ el.style.outline = '2px dotted #9aa0ad'; el.style.outlineOffset = '2px'; }});
  };
  function isLocked(el){ return el && el.dataset.locked === '1'; }
  /* recolore o elemento: cor direta + tokens de acento (ícones e textos
     que usam var(--b-ac/p1/p2) seguem pela cascata) */
  function paintColor(el, c){
    el.style.color = c;
    ['--b-ac','--b-p1','--b-p2'].forEach(k=>el.style.setProperty(k, c));
  }
  function composeItemOf(el){
    if(!el || !el.dataset.cid) return null;
    return ((F.state.compose||{})[F.editKey()]||[]).find(o=>o.id===el.dataset.cid) || null;
  }

  /* ---------- SELEÇÃO (única e múltipla) ---------- */
  function syncSelCount(){
    const b = document.getElementById('edCount');
    if(!b) return;
    const n = F.editor.sels.length;
    b.style.display = n>1 ? '' : 'none';
    b.textContent = n>1 ? n+' sel.' : '';
  }
  function outlineOff(el){
    if(!el || !el.isConnected) return;
    if(isLocked(el)){ el.style.outline = '2px dotted #9aa0ad'; el.style.outlineOffset = '2px'; }
    else el.style.outline = '';
  }
  function setSel(list){
    F.editor.sels.forEach(outlineOff);
    F.editor.sels = (list||[]).filter((el,i,a)=>el && a.indexOf(el)===i);
    F.editor.sel = F.editor.sels[F.editor.sels.length-1] || null;
    F.editor.sels.forEach(el=>{ el.style.outline = '3px dashed #5ee6c7'; el.style.outlineOffset = '3px'; });
    syncSelCount();
    if(F.editor.syncHandles) F.editor.syncHandles();   // alças de redimensionamento (ui/resize.js)
  }
  function select(el){ setSel(el ? [el] : []); }
  function toggleSel(el){
    const s = [...F.editor.sels], i = s.indexOf(el);
    if(i>=0) s.splice(i,1); else s.push(el);
    setSel(s);
  }
  function selection(){ return F.editor.sels.length ? F.editor.sels : (F.editor.sel ? [F.editor.sel] : []); }
  /* re-seleciona após um re-render (os nós são recriados) */
  function selSnapshot(){
    return F.editor.sels.map(el=>el.dataset.cid ? {cid:el.dataset.cid} : {eid:el.dataset.eid});
  }
  function selRestore(list){
    const a = art();
    setSel((list||[]).map(d=>d.cid
      ? a.querySelector(`[data-cid="${d.cid}"]`)
      : a.querySelector(`[data-eid="${d.eid}"]`)).filter(Boolean));
  }

  /* aplicar ANIMAÇÃO ao(s) elemento(s) selecionado(s) (barra do palco) */
  F.editor.setAnim = function(v){
    const els = selection();
    if(!els.length){ F.toast('Clique num elemento da arte primeiro.'); return false; }
    const free = els.filter(el=>!isLocked(el));
    if(!free.length){ F.toast('Elemento(s) travado(s) — destrave para animar.'); return false; }
    free.forEach(el=>{
      const it = composeItemOf(el);
      if(it){ if(v==='') delete it.anim; else it.anim = v; }
      else{ const op = opFor(+el.dataset.eid); if(v==='') delete op.anim; else op.anim = v; }
    });
    const snap = selSnapshot();
    F.autoSave(); F.render();
    selRestore(snap);
    const def = F.anims.get(v);
    F.toast(v==='none' ? (free.length>1 ? 'Animação removida de '+free.length+' elementos.' : 'Animação removida do elemento.')
          : 'Animação "'+((def&&def.n)||v)+'" aplicada'+(free.length>1?' a '+free.length+' elementos':'')+' — dê Replay para rever.');
    return true;
  };
  /* aplicar COR ao(s) elemento(s) selecionado(s) (ao vivo, sem re-render) */
  F.editor.setColor = function(c){
    const els = selection();
    if(!els.length){ F.toast('Clique num elemento da arte primeiro.'); return false; }
    const free = els.filter(el=>!isLocked(el));
    if(!free.length){ F.toast('Elemento(s) travado(s) — destrave para colorir.'); return false; }
    free.forEach(el=>{
      const it = composeItemOf(el);
      if(it){ if(it.comp==='__icon') it.color = c; else it.c = c; }
      else{ opFor(+el.dataset.eid).c = c; }
      paintColor(el, c);            // feedback imediato; persiste no próximo render
    });
    F.autoSave();
    return true;
  };
  F.applyEdits = function(){
    F.editor.sel = null; F.editor.sels = []; syncSelCount();
    F.applyEditsIn(art(), F.editKey());
  };

  function opFor(eid){
    const s = F.state, key = F.editKey();
    s.edits = s.edits || {}; s.edits[key] = s.edits[key] || [];
    let op = s.edits[key].find(o=>o.eid===eid);
    if(!op){ op = {eid, k:1, dx:0, dy:0}; s.edits[key].push(op); }
    return op;
  }
  /* helpers expostos para módulos adicionais (ui/resize.js): persistir
     escala/largura de um elemento sem duplicar a lógica de edits/compose */
  F.editor._opFor = opFor;
  F.editor._itemOf = el => composeItemOf(el);
  F.editor._isLocked = el => isLocked(el);
  function isFullbleed(el){
    const a = art().getBoundingClientRect(), r = el.getBoundingClientRect();
    return r.width >= a.width*.92 && r.height >= a.height*.92;
  }
  function editablesAt(x, y){
    const all = document.elementsFromPoint(x, y)
      .filter(el => art().contains(el) && el !== art())
      .map(el => el.closest('[data-anim], .abs'))
      .filter(el => el && el !== art() && !el.classList.contains('scenelayer'))
      .filter((el,i,a) => a.indexOf(el) === i);
    /* seleção certeira: entre os elementos sob o cursor, o MENOR (mais
       específico) vem primeiro — 1 clique pega o que se vê; cliques
       repetidos continuam ciclando para os maiores/abaixo. Fundos e
       contêineres full-bleed vão para o fim: o topo da fila é o que se vê */
    const vis = all.filter(el=>!isFullbleed(el))
      .map(el=>{ const b2 = el.getBoundingClientRect(); return [el, b2.width*b2.height]; })
      .sort((a2,b3)=>a2[1]-b3[1]).map(p2=>p2[0]);
    return [...vis, ...all.filter(isFullbleed)];
  }
  function lockSel(){
    const els = selection();
    if(!els.length) return F.toast('Selecione um elemento primeiro.');
    const key = F.editKey();
    /* comportamento de grupo: se houver algum destravado, TRAVA todos;
       se todos já estão travados, DESTRAVA todos */
    const locking = els.some(el=>!isLocked(el));
    els.forEach(el=>{
      if(locking && isLocked(el)) return;    // já travado, mantém
      if(el.dataset.cid){
        const it = ((F.state.compose||{})[key]||[]).find(o=>o.id===el.dataset.cid);
        if(it){ if(locking) it.lock = 1; else delete it.lock; }
      } else { const op = opFor(+el.dataset.eid); if(locking) op.lock = 1; else delete op.lock; }
      if(locking){ el.dataset.locked = '1'; el.style.outline='2px dotted #9aa0ad'; el.style.outlineOffset='2px'; }
      else{ delete el.dataset.locked; el.style.outline=''; }
    });
    F.autoSave();
    if(locking){
      setSel([]);
      F.toast(els.length>1
        ? els.length+' elementos travados — ficam pontilhados e não movem/escalam/apagam. Selecione (marquee) e use Travar de novo para destravar.'
        : 'Travado — fica marcado (pontilhado) e não move/escala/apaga. Selecione e use Travar de novo para destravar.');
    } else {
      setSel(els);                            // devolve o contorno de seleção
      F.toast(els.length>1 ? els.length+' elementos destravados.' : 'Destravado.');
    }
  }
  function unlockAll(){
    const key = F.editKey();
    (((F.state.edits||{})[key])||[]).forEach(o=>{ delete o.lock; });
    (((F.state.compose||{})[key])||[]).forEach(o=>{ delete o.lock; });
    art().querySelectorAll('[data-locked]').forEach(el=>{ delete el.dataset.locked; el.style.outline=''; });
    F.editor.sels.forEach(el=>{ if(el.isConnected){ el.style.outline='3px dashed #5ee6c7'; el.style.outlineOffset='3px'; } });
    F.autoSave(); F.toast('Todas as travas desta arte removidas.');
  }
  function scaleSel(mult){
    const els = selection();
    if(!els.length) return F.toast('Clique num elemento da arte primeiro.');
    const free = els.filter(el=>!isLocked(el));
    if(!free.length) return F.toast('Elemento(s) travado(s) — use o botão de trava para destravar.');
    const clamp = k => Math.min(4, Math.max(.2, Math.round(k*mult*100)/100));
    free.forEach(el=>{
      const it = composeItemOf(el);
      if(it){ it.k = clamp(it.k||1); el.style.scale = it.k; }        // item composto: persiste em it.k
      else{ const op = opFor(+el.dataset.eid); op.k = clamp(op.k||1); el.style.scale = op.k; }
    });
    F.autoSave();
    if(F.editor.syncHandles) F.editor.syncHandles();
  }
  function delSel(){
    const els = selection();
    if(!els.length) return F.toast('Clique num elemento da arte primeiro.');
    const free = els.filter(el=>!isLocked(el));
    if(!free.length) return F.toast('Elemento(s) travado(s) — use o botão de trava para destravar.');
    const key = F.editKey();
    let removedComp = false;
    free.forEach(el=>{
      if(el.dataset.cid){
        const list = (F.state.compose||{})[key];
        if(list){ const i = list.findIndex(o=>o.id===el.dataset.cid);
          if(i>=0){ list.splice(i,1); removedComp = true; } }
        el.style.display = 'none';
      } else {
        opFor(+el.dataset.eid).del = 1;
        el.style.display = 'none';
      }
    });
    select(null);
    F.autoSave();
    if(removedComp){ F.render(); if(F.ui && F.ui.refreshActive) F.ui.refreshActive(); }
    F.toast(free.length>1
      ? free.length+' elementos removidos desta arte — Desfazer reverte.'
      : 'Elemento removido desta arte — Desfazer reverte.');
  }
  function resetEdits(){
    delete (F.state.edits||{})[F.editKey()];
    delete (F.state.compose||{})[F.editKey()];
    F.autoSave(); F.render();
    F.toast('Edições e composições desta arte desfeitas.');
  }

  /* ---------- CAMADAS: frente/trás com z-index persistente ----------
     modelo unificado: z efetivo = inline > (compitem: 60 | template: 0).
     'front'/'back' vão aos extremos do que existe na arte; 'fwd'/'bwd'
     dão um passo. Vale para a seleção múltipla inteira, ao vivo. */
  function effZ(el){
    const v = el.style.zIndex;
    if(v!=='' && v!=null && !isNaN(+v)) return +v;
    return el.classList.contains('compitem') ? 60 : 0;
  }
  function layerSel(dir){
    const els = selection();
    if(!els.length) return F.toast('Clique num elemento da arte primeiro.');
    const free = els.filter(el=>!isLocked(el));
    if(!free.length) return F.toast('Elemento(s) travado(s) — destrave para mudar a camada.');
    const all = [...art().querySelectorAll('[data-eid]')]
      .filter(el=>el.style.display!=='none' && !isFullbleed(el));
    const maxZ = Math.max(0, ...all.map(effZ)), minZ = Math.min(0, ...all.map(effZ));
    free.forEach(el=>{
      const cur = effZ(el);
      const nz = dir==='front' ? maxZ+1 : dir==='back' ? minZ-1 : dir==='fwd' ? cur+1 : cur-1;
      const it = composeItemOf(el);
      if(it) it.z = nz; else opFor(+el.dataset.eid).z = nz;
      el.style.zIndex = nz;
      if(!el.classList.contains('abs') && !el.classList.contains('compitem'))
        el.style.position = 'relative';
    });
    F.autoSave();
    const msg = {front:'trazido(s) para a frente', fwd:'avançou(aram) uma camada',
                 bwd:'recuou(aram) uma camada', back:'enviado(s) para trás'}[dir];
    F.toast((free.length>1 ? free.length+' elementos ' : 'Elemento ') + msg + '.');
  }

  /* guias de alinhamento com snap: centro da arte (verde), bordas e
     margens (cinza) e arestas/centros dos DEMAIS elementos (rosa) */
  const GUIDE_COLORS = {center:'#5ee6c7', edge:'#9aa0ad', el:'#ff5ea0'};
  function guide(axis){ // linha dinâmica posicionada em px do espaço da arte
    let g = art().querySelector('#guideD'+axis);
    if(!g){ g = document.createElement('div'); g.id = 'guideD'+axis;
      g.style.cssText = 'position:absolute;pointer-events:none;z-index:999;opacity:.95;display:none;'
        + (axis==='V' ? 'top:0;bottom:0;width:1.5px' : 'left:0;right:0;height:1.5px');
      art().appendChild(g); }
    return g;
  }
  function hideGuides(){ ['V','H'].forEach(a=>{ const g=art().querySelector('#guideD'+a); if(g) g.style.display='none'; }); }
  /* coleta alvos de snap no espaço da arte (px não escalados);
     `exclude`: elementos que se movem junto (grupo) não são alvo */
  function collectSnapTargets(dragEl, exclude){
    const a = art().getBoundingClientRect(), k = a.width/art().offsetWidth;
    const W = art().offsetWidth, H = art().offsetHeight;
    const M = Math.min(W,H)/100*7;                     // margem padrão dos templates (7u)
    const xs = [{v:0,c:'edge'},{v:M,c:'edge'},{v:W/2,c:'center'},{v:W-M,c:'edge'},{v:W,c:'edge'}];
    const ys = [{v:0,c:'edge'},{v:M,c:'edge'},{v:H/2,c:'center'},{v:H-M,c:'edge'},{v:H,c:'edge'}];
    [...art().querySelectorAll('.compitem, [data-anim]')]
      .filter(el=>el!==dragEl && !(exclude&&exclude.includes(el)) && !dragEl.contains(el) && !el.contains(dragEl) && el.style.display!=='none')
      .forEach(el=>{
        const r = el.getBoundingClientRect();
        if(r.width<4 || r.height<4) return;
        if(r.width>=a.width*.92 && r.height>=a.height*.92) return;    // ignora full-bleed
        const l=(r.left-a.left)/k, rr=(r.right-a.left)/k, t=(r.top-a.top)/k, b=(r.bottom-a.top)/k;
        xs.push({v:l,c:'el'},{v:(l+rr)/2,c:'el'},{v:rr,c:'el'});
        ys.push({v:t,c:'el'},{v:(t+b)/2,c:'el'},{v:b,c:'el'});
      });
    return {xs, ys};
  }
  /* melhor snap de um conjunto de arestas contra os alvos */
  function bestSnap(edges, targets, thr){
    let best = null;
    for(const t of targets) for(const e of edges){
      const d = t.v - e;
      if(Math.abs(d) < thr && (!best || Math.abs(d) < Math.abs(best.d))) best = {d, t};
    }
    return best;
  }

  /* ---------- marquee (retângulo de seleção múltipla) ---------- */
  let mqBox = null;
  function mqRect(mq, e){
    return {left:Math.min(mq.x0,e.clientX), top:Math.min(mq.y0,e.clientY),
      right:Math.max(mq.x0,e.clientX), bottom:Math.max(mq.y0,e.clientY)};
  }
  function drawMq(r){
    const a = art().getBoundingClientRect(), k = a.width/art().offsetWidth;
    if(!mqBox){
      mqBox = document.createElement('div');
      mqBox.id = 'mqBox';
      mqBox.style.cssText = 'position:absolute;z-index:1000;pointer-events:none;'
        + 'border:1.5px dashed #FB923C;background:rgba(245,98,15,.08);border-radius:4px';
      art().appendChild(mqBox);
    }
    mqBox.style.left = ((r.left-a.left)/k)+'px';
    mqBox.style.top = ((r.top-a.top)/k)+'px';
    mqBox.style.width = ((r.right-r.left)/k)+'px';
    mqBox.style.height = ((r.bottom-r.top)/k)+'px';
  }
  function clearMq(){ if(mqBox){ mqBox.remove(); mqBox = null; } }
  function marqueeHits(r){
    const a = art();
    const els = [...a.querySelectorAll('[data-anim], .abs')]
      .filter(el=>el!==a && !el.classList.contains('scenelayer')
        && el.style.display!=='none' && !(el.id||'').startsWith('guideD') && el.id!=='mqBox')
      .filter(el=>!isFullbleed(el))
      .filter(el=>{ const b = el.getBoundingClientRect();
        return b.width>2 && b.height>2 && b.right>r.left && b.left<r.right && b.bottom>r.top && b.top<r.bottom; });
    /* mantém só os mais externos: mover pai e filho juntos duplicaria o deslocamento */
    return els.filter(el=>!els.some(o=>o!==el && o.contains(el)));
  }

  F.editorInit = function(){
    const btn = $('#btnEdit'), tools = $('#editTools');
    btn.onclick = ()=>{
      F.editor.on = !F.editor.on;
      btn.classList.toggle('editing', F.editor.on);
      tools.hidden = !F.editor.on;           // dropdown flutuante — a barra não estica
      art().style.cursor = F.editor.on ? 'crosshair' : '';
      /* touch: sem isso o navegador rola a página em vez de arrastar o elemento */
      art().style.touchAction = F.editor.on ? 'none' : '';
      art().style.userSelect = F.editor.on ? 'none' : '';
      art().style.webkitUserSelect = F.editor.on ? 'none' : '';
      if(!F.editor.on){ select(null); clearMq(); }
      else F.toast('Modo edição: clique seleciona (repita para pegar o de baixo); arraste no fundo para selecionar VÁRIOS; Shift+clique soma; arrastar move; use as alças do box para dimensionar.');
      if(F.ui && F.ui.onEditToggle) F.ui.onEditToggle(F.editor.on);   // sidebar abre a aba EDITAR
      if(F.editor.syncHandles) F.editor.syncHandles();
    };
    $('#edMinus').onclick = ()=>scaleSel(1/1.12);
    $('#edPlus').onclick  = ()=>scaleSel(1.12);
    $('#edDel').onclick   = delSel;
    $('#edReset').onclick = resetEdits;
    $('#edLock').onclick  = lockSel;
    $('#edUnlock').onclick = unlockAll;
    $('#edFront').onclick = ()=>layerSel('front');
    $('#edFwd').onclick   = ()=>layerSel('fwd');
    $('#edBwd').onclick   = ()=>layerSel('bwd');
    $('#edBack').onclick  = ()=>layerSel('back');
    /* animação do(s) elemento(s) selecionado(s) */
    const selAnim = $('#edAnim');
    if(selAnim){
      selAnim.innerHTML = '<option value="">Animar…</option><option value="none">— sem animação —</option>';
      F.anims.entries().forEach(([id,a])=>{
        if(id==='letters') return;                 // exige marcação .ltr; draw vale para ícones/SVGs
        const o = document.createElement('option');
        o.value = id; o.textContent = a.n + (a.kind==='loop'?' ∞':'');
        selAnim.appendChild(o);
      });
      selAnim.onchange = ()=>{ const v = selAnim.value; selAnim.value = '';
        if(v!=='') F.editor.setAnim(v); };
    }
    /* cor do(s) elemento(s) selecionado(s) */
    const inColor = $('#edColor');
    if(inColor) inColor.oninput = ()=>F.editor.setColor(inColor.value);

    /* atalhos: Esc limpa a seleção; Delete/Backspace apaga os selecionados */
    document.addEventListener('keydown', e=>{
      if(!F.editor.on) return;
      const t = e.target;
      if(t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
      if(e.key==='Escape'){ select(null); }
      else if((e.key==='Delete' || e.key==='Backspace') && F.editor.sels.length){
        e.preventDefault(); delSel();
      }
    });

    /* modelo de interação: tocar SELECIONA; tocar de novo no mesmo lugar CICLA
       para o de baixo; arrastar MOVE o(s) selecionado(s). Full-bleed (fundos e
       contêineres do tamanho da arte) só movem se já estavam selecionados.
       Arrastar a partir do FUNDO (full-bleed não selecionado / vazio) abre o
       retângulo de seleção múltipla; Shift+clique soma/remove da seleção. */
    let drag = null, mq = null;
    art().addEventListener('pointerdown', e=>{
      if(!F.editor.on) return;
      if(e.target && e.target.closest && e.target.closest('#rzBox')) return;   // alças (ui/resize.js) cuidam do próprio gesto
      e.preventDefault(); e.stopPropagation();
      const cands = editablesAt(e.clientX, e.clientY);
      /* Shift: alterna o elemento sob o cursor na seleção múltipla */
      if(e.shiftKey){
        if(cands.length) toggleSel(cands[0]);
        return;
      }
      /* fundo da prancheta (full-bleed não selecionado) ou área vazia:
         vira marquee se arrastar; clique simples mantém o comportamento antigo */
      if(!cands.length || (isFullbleed(cands[0]) && !F.editor.sels.includes(cands[0]))){
        mq = {x0:e.clientX, y0:e.clientY, cands, moved:false};
        art().setPointerCapture && art().setPointerCapture(e.pointerId);
        return;
      }
      const wasSel = F.editor.sel;
      let el;
      if(F.editor.sels.length>1 && cands.some(c=>F.editor.sels.includes(c)))
        el = cands.find(c=>F.editor.sels.includes(c));      // pegar o grupo por qualquer membro
      else if(wasSel && cands.includes(wasSel)) el = wasSel; // já selecionado sob o dedo
      else { el = cands[0]; select(el); }                    // topo visível da pilha
      const groupEls = (F.editor.sels.length>1 && F.editor.sels.includes(el))
        ? F.editor.sels.filter(x=>x!==el && !isLocked(x) && !isFullbleed(x)) : null;
      const canDrag = !isLocked(el) && (!isFullbleed(el) || el === wasSel);  // travado não move; prancheta exige seleção prévia
      const scale = art().getBoundingClientRect().width / art().offsetWidth;
      const key = F.editKey();
      /* fresh: a seleção nasceu NESTE toque — o pointerup não deve ciclar
         (antes, o 1º clique selecionava no down e o up já pulava para o de
         baixo, exigindo 2+ cliques para pegar o elemento visado) */
      drag = {el, cands, fresh: el !== wasSel, x0:e.clientX, y0:e.clientY, scale, moved:false, canDrag,
        cid:el.dataset.cid||null, eid:+el.dataset.eid,
        snap: canDrag ? collectSnapTargets(el, groupEls) : null,
        base: el.dataset.cid ? null : {...opFor(+el.dataset.eid)},
        group: (canDrag && groupEls && groupEls.length) ? groupEls.map(x=>{
          const cid = x.dataset.cid||null;
          if(cid){ const it = ((F.state.compose||{})[key]||[]).find(o=>o.id===cid);
            return it ? {el:x, cid, bx:it.x, by:it.y} : null; }
          return {el:x, eid:+x.dataset.eid, bt:{...opFor(+x.dataset.eid)}};
        }).filter(Boolean) : null};
      art().setPointerCapture && art().setPointerCapture(e.pointerId);
    }, true);
    art().addEventListener('pointermove', e=>{
      if(!F.editor.on) return;
      if(mq){
        if(Math.abs(e.clientX-mq.x0)+Math.abs(e.clientY-mq.y0) > 5) mq.moved = true;
        if(mq.moved) drawMq(mqRect(mq, e));
        return;
      }
      if(!drag) return;
      const dx=(e.clientX-drag.x0)/drag.scale, dy=(e.clientY-drag.y0)/drag.scale;
      if(Math.abs(dx)+Math.abs(dy) > 4) drag.moved = true;
      if(!drag.moved || !drag.canDrag) return;
      /* posição tentativa */
      if(drag.cid){
        const item=((F.state.compose||{})[F.editKey()]||[]).find(o=>o.id===drag.cid);
        if(item){ drag.el.style.left = (item.x + dx/art().offsetWidth*100)+'%';
                  drag.el.style.top  = (item.y + dy/art().offsetHeight*100)+'%'; }
      }else{
        drag.el.style.translate = `${(drag.base.dx||0)+dx}px ${(drag.base.dy||0)+dy}px`;
      }
      /* snap: bordas/margens/centro da arte + arestas e centros dos demais elementos */
      const a = art().getBoundingClientRect(), k = drag.scale;
      const rct = drag.el.getBoundingClientRect();
      const thr = Math.max(5, art().offsetWidth*0.008);          // px no espaço da arte
      const L=(rct.left-a.left)/k, R=(rct.right-a.left)/k;
      const T=(rct.top-a.top)/k,   B=(rct.bottom-a.top)/k;
      const bx = drag.snap ? bestSnap([L,(L+R)/2,R], drag.snap.xs, thr) : null;
      const by = drag.snap ? bestSnap([T,(T+B)/2,B], drag.snap.ys, thr) : null;
      const gv = guide('V'), gh = guide('H');
      if(bx){ gv.style.display='block'; gv.style.left = bx.t.v+'px'; gv.style.background = GUIDE_COLORS[bx.t.c]; }
      else gv.style.display='none';
      if(by){ gh.style.display='block'; gh.style.top = by.t.v+'px'; gh.style.background = GUIDE_COLORS[by.t.c]; }
      else gh.style.display='none';
      const sx = bx ? bx.d : 0, sy = by ? by.d : 0;
      if(sx || sy){
        if(drag.cid){
          drag.el.style.left = (parseFloat(drag.el.style.left) + sx/art().offsetWidth*100)+'%';
          drag.el.style.top  = (parseFloat(drag.el.style.top)  + sy/art().offsetHeight*100)+'%';
        }else{
          const cur = (drag.el.style.translate||'0px 0px').split(' ').map(parseFloat);
          drag.el.style.translate = `${(cur[0]||0)+sx}px ${(cur[1]||0)+sy}px`;
        }
      }
      drag.snapped = {sx, sy};
      /* grupo: replica o delta efetivo (arrasto + snap) nos demais selecionados */
      if(drag.group){
        const gdx = dx + sx, gdy = dy + sy;
        drag.group.forEach(m=>{
          if(m.cid){
            m.el.style.left = (m.bx + gdx/art().offsetWidth*100)+'%';
            m.el.style.top  = (m.by + gdy/art().offsetHeight*100)+'%';
          } else {
            m.el.style.translate = `${(m.bt.dx||0)+gdx}px ${(m.bt.dy||0)+gdy}px`;
          }
        });
      }
      if(F.editor.syncHandles) F.editor.syncHandles(true);   // alças acompanham o arrasto
    });
    const endDrag = e=>{
      /* fim do marquee: clique simples preserva o comportamento antigo;
         com movimento, seleciona tudo que o retângulo tocou */
      if(mq){
        if(!mq.moved){
          if(!mq.cands.length) select(null);
          else{
            const wasSel = F.editor.sel;
            if(wasSel && mq.cands.includes(wasSel) && mq.cands.length > 1){
              const i = mq.cands.indexOf(wasSel);
              const next = mq.cands[(i+1) % mq.cands.length];
              select(next);
              if(next.dataset.cid && F.ui && F.ui.focusComposeItem) F.ui.focusComposeItem(next.dataset.cid);
            } else select(mq.cands[0]);
          }
        } else if(e){
          const hits = marqueeHits(mqRect(mq, e));
          setSel(hits);
          F.toast(hits.length
            ? hits.length+' elemento'+(hits.length>1?'s':'')+' selecionado'+(hits.length>1?'s':'')+' — mova, escale, trave, anime, colora ou apague em conjunto.'
            : 'Nada selecionado nessa área.');
        }
        clearMq(); mq = null;
        return;
      }
      if(!drag) return;
      if(!drag.moved){
        /* toque sem arrasto: cicla só se o elemento JÁ estava selecionado
           antes deste toque (toque repetido no mesmo lugar) */
        if(!drag.fresh && drag.el === F.editor.sel && F.editor.sels.length<=1 && drag.cands.length > 1){
          const i = drag.cands.indexOf(drag.el);
          const next = drag.cands[(i+1) % drag.cands.length];
          if(next !== drag.el){ select(next);
            if(next.dataset.cid && F.ui && F.ui.focusComposeItem) F.ui.focusComposeItem(next.dataset.cid);
            drag = null; return; }
        }
      }
      if(drag.moved && drag.canDrag){
        if(drag.cid){
          const item=((F.state.compose||{})[F.editKey()]||[]).find(o=>o.id===drag.cid);
          if(item){ item.x=+parseFloat(drag.el.style.left).toFixed(1);
                    item.y=+parseFloat(drag.el.style.top).toFixed(1); }
        }else{
          const cur=(drag.el.style.translate||'0px 0px').split(' ').map(parseFloat);
          const op=opFor(drag.eid);
          op.dx=Math.round(cur[0]||0); op.dy=Math.round(cur[1]||0);
        }
        /* persiste o grupo inteiro */
        if(drag.group){
          const key = F.editKey();
          drag.group.forEach(m=>{
            if(m.cid){
              const it=((F.state.compose||{})[key]||[]).find(o=>o.id===m.cid);
              if(it){ it.x=+parseFloat(m.el.style.left).toFixed(1);
                      it.y=+parseFloat(m.el.style.top).toFixed(1); }
            }else{
              const cur=(m.el.style.translate||'0px 0px').split(' ').map(parseFloat);
              const op=opFor(m.eid);
              op.dx=Math.round(cur[0]||0); op.dy=Math.round(cur[1]||0);
            }
          });
        }
        F.autoSave();
      }
      if(!drag.moved && drag.cid && F.editor.sels.length<=1 && F.ui && F.ui.focusComposeItem){
        F.ui.focusComposeItem(drag.cid);      // tocar num item composto abre o formulário dele
      }
      hideGuides();
      drag=null;
      if(F.editor.syncHandles) F.editor.syncHandles();
    };
    art().addEventListener('pointerup', endDrag);
    art().addEventListener('pointercancel', ()=>{ clearMq(); mq=null; drag=null; hideGuides(); });
    art().addEventListener('contextmenu', e=>{ if(F.editor.on) e.preventDefault(); });
  };
})(window.FORMA);

</script>
<script>
/* ===== js/ui/panels.js ===== */
/* =====================================================
   FORJE·studio — ui/panels.js
   Interface do estúdio. Painéis por modo:
   design → MARCA / FORMATO / CONTEÚDO / IMAGEM / LIB
   motion → MARCA / TIMELINE / CENA / ESTILO / LIB
   Uploads usam <label> nativo (funciona em sandbox),
   com alternativas: arrastar no palco e colar Ctrl+V.
   ===================================================== */
(function(F){
  const $ = s=>document.querySelector(s), $$ = s=>[...document.querySelectorAll(s)];
  F.ui = {};

  /* ---------- listas de transição de cena ---------- */
  const SCENE_ENTERS = [['none','—'],['fade','Fade'],['wipe','Wipe →'],['wipe-up','Wipe ↑'],['wipe-down','Wipe ↓'],
