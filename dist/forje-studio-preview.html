<script>
/* ===== js/core/content.js ===== */
/* =====================================================
   FORJE·studio — core/content.js  (NOVO · Eixo 2 · S4)
   CONTEÚDO QUE VIRA DESIGN: parser DETERMINÍSTICO
   texto → carrossel (fase 2.1), ROTEAMENTO SEMÂNTICO
   por slide (fase 2.2, via slide.tpl opcional com
   fallback no template global), FIT TIPOGRÁFICO
   programático (fase 2.2) e markdown leve (fase 2.3,
   sem IA). Nenhuma dependência de rede: heurísticas
   puras, mesma entrada → mesma saída (P3).

   O que o parser entende:
   - blocos separados por linha em branco → um slide cada;
   - bloco único longo → fatiado por SENTENÇAS com alvo
     de ~180–240 caracteres por slide (proporção P4);
   - linha curta em CAIXA ALTA, terminada em ':' ou
     "Parte/Passo/Dica N" → kicker; '###' → kicker;
   - '#'/'##' → título; 1ª linha ≤ 56 chars → título;
     sem linha-título, o título é DERIVADO da 1ª sentença
     (essência até a 1ª vírgula/travessão) — nunca corta
     no meio de palavra, nunca reticências;
   - quebra inteligente do título no ponto de MENOR
     desequilíbrio entre as linhas;
   - '>' ou aspas envolventes → citação (atribuição na
     linha com travessão vira o sub);
   - linhas '-', '•', '*', '1.' → lista (roteia p/ o
     template de tópicos; >6 itens divide em slides);
   - número protagonista ('98%', '+120', 'R$ 1,2 mi',
     '3x') → estatística (roteia p/ tipografia monumental);
   - **palavra** → DESTAQUE persistido em slide.hl
     (marca-texto/sublinhado garantido no título);
   - ![alt](url), URL de imagem ou dataURL → slide.img;
   - bloco final curto com verbo de ação/URL/@ → vira o
     CTA global (s.cta), não um slide; bloco de ação
     longo → slide roteado ao template Produto/CTA.

   Roteamento (fase 2.2): lista→topicos · citação→quote ·
   estatística→poster · ação→cta · com imagem→split ·
   default alterna manifesto/split (1º slide = manifesto).

   FIT TIPOGRÁFICO: mapa determinístico caracteres →
   fator de escala (com piso de legibilidade), consumido
   pelos templates via F.fitT/F.fitS. Comprimentos dentro
   do orçamento original devolvem o TAMANHO ORIGINAL
   INALTERADO — projetos existentes renderizam byte a
   byte igual (P1); o fator só age no excedente.

   Carregar após core/composer.js e antes dos templates.
   ===================================================== */
(function(F){
  'use strict';

  /* ============ template EFETIVO por slide (fase 2.2) ============
     slide.tpl é opcional; fallback no global — chaves de edição de
     projetos antigos (sem slide.tpl) permanecem idênticas (P1). */
  F.tplOf = function(i){
    const s = F.state;
    return ((s.slides||[])[i] || {}).tpl || s.tpl;
  };

  /* ============ FIT TIPOGRÁFICO (fase 2.2) ============
     Orçamentos calibrados no design atual dos templates:
     título ≤ 48 chars e sub ≤ 190 chars → fator 1 (byte a byte
     igual ao render de hoje). Acima, escala côncava com piso. */
  F.fitK = function(s){
    const t = String((s && s.title) || '').replace(/\n/g,'');
    const n = t.length;
    if(n <= 48) return 1;
    return Math.max(.5, Math.min(1, +Math.pow(48/n, .6).toFixed(3)));
  };
  F.fitKSub = function(s){
    const n = String((s && s.sub) || '').length;
    if(n <= 190) return 1;
    return Math.max(.68, Math.min(1, +Math.pow(190/n, .55).toFixed(3)));
  };
  /* devolvem o argumento ORIGINAL quando o fator é 1 — a string
     interpolada no template não muda um byte (P1) */
  F.fitT = function(size, s){
    const k = F.fitK(s);
    if(k >= 1) return size;
    return Math.max(3.4, parseFloat(size)*k).toFixed(1);
  };
  F.fitS = function(size, s){
    const k = F.fitKSub(s);
    if(k >= 1) return size;
    return Math.max(1.9, +(parseFloat(size)*k).toFixed(2));
  };

  /* ============ utilitários do parser ============ */
  const IMG_LINE = /^!\[[^\]]*\]\((\S+?)\)\s*$/;
  const IMG_URL  = /^(https?:\/\/\S+\.(?:png|jpe?g|webp|gif|svg)(?:\?\S*)?)$/i;
  const IMG_DATA = /^data:image\/\S+$/;
  const URL_ANY  = /https?:\/\/\S+|www\.\S+/i;
  const LIST_LN  = /^\s*(?:[-•*–]|\d{1,2}[.)])\s+/;
  const ACTIONS  = /^(acesse|saiba|confira|baixe|compre|inscreva|assine|siga|clique|veja|garanta|comece|experimente|fale|entre|participe|aproveite|cadastre|agende|solicite|pe[cç]a|descubra|conhe[cç]a|get|join|follow|visit|learn|sign|start|try|buy|shop|book|download|subscribe|discover|claim|order)\b/i;
  const KICKER_N = /^(parte|passo|dica|cap[íi]tulo|cap\.|dia|semana|step|part|tip|day|week)\s*\d+/i;
  const ABBR     = /^(?:[A-Za-zÀ-ÿ]|Dr|Sr|Sra|Srta|Prof|etc|ex|p\.ex|vs|No|nº|art|fig|pág|pg|Mr|Mrs|Ms|St|Jr)\.$/i;

  const normalize = txt => String(txt||'')
    .replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ')
    .replace(/[ \t]+$/gm,'').replace(/\n{3,}/g,'\n\n').trim();

  /* fatiador de sentenças sem lookbehind (Safari antigo) e com
     tolerância a abreviações e decimais ("1.5" não quebra) */
  F.splitSentences = function(t){
    t = String(t||'').replace(/\s+/g,' ').trim();
    const out = []; let cur = '';
    for(let i=0;i<t.length;i++){
      cur += t[i];
      if(!/[.!?…]/.test(t[i])) continue;
      while(i+1<t.length && /["”'’)\]]/.test(t[i+1])) cur += t[++i];
      const rest = t.slice(i+1);
      if(!rest.trim()){ out.push(cur.trim()); cur=''; continue; }
      if(!/^\s/.test(rest)) continue;                       // "1.5", "v2.0"
      const tail = (cur.trim().split(/\s+/).pop()||'');
      if(ABBR.test(tail)) continue;                          // "Dr.", "p.ex."
      if(/^[\sA-ZÀ-ÖØ-Þ0-9“"'(¿¡]/.test(rest.trim()[0]||'')){ out.push(cur.trim()); cur=''; }
    }
    if(cur.trim()) out.push(cur.trim());
    return out;
  };

  /* empacota sentenças com alvo de caracteres por slide (proporção);
     resto minúsculo no fim é fundido no bloco anterior */
  function packSentences(sents, target){
    const out = []; let cur = '';
    for(const sn of sents){
      if(!cur){ cur = sn; continue; }
      if((cur.length + 1 + sn.length) <= target*1.15) cur += ' '+sn;
      else { out.push(cur); cur = sn; }
    }
    if(cur) out.push(cur);
    if(out.length>1 && out[out.length-1].length < target*.35){
      const last = out.pop(); out[out.length-1] += ' '+last;
    }
    return out;
  }

  /* quebra inteligente do título: espaço mais próximo do ponto de
     menor desequilíbrio entre as linhas (2 linhas; 3 se muito longo) */
  F.breakTitle = function(t){
    t = String(t||'').trim();
    if(t.indexOf('\n')>=0 || t.length<=26) return t;
    const brk = (str)=>{                     // melhor espaço ~metade
      let best=-1, diff=Infinity;
      for(let i=0;i<str.length;i++) if(str[i]===' '){
        const d = Math.abs(i - str.length/2);
        if(d<diff && i>=8 && str.length-i-1>=6){ diff=d; best=i; }
      }
      return best<0 ? str : str.slice(0,best)+'\n'+str.slice(best+1);
    };
    if(t.length<=58) return brk(t);
    /* 3 linhas: quebra nos terços */
    const cut = (str, at)=>{ let best=-1, diff=Infinity;
      for(let i=0;i<str.length;i++) if(str[i]===' '){
        const d = Math.abs(i-at); if(d<diff && i>=8){ diff=d; best=i; } }
      return best; };
    const a = cut(t, t.length/3);
    if(a<0) return brk(t);
    const rest = t.slice(a+1), b = cut(rest, rest.length/2);
    return b<0 ? t.slice(0,a)+'\n'+rest : t.slice(0,a)+'\n'+rest.slice(0,b)+'\n'+rest.slice(b+1);
  };

  /* **destaque** / __destaque__ / *destaque* → texto limpo + palavras */
  function emphasis(str){
    const words = [];
    let s = String(str||'');
    const grab = (m, g)=>{ g.split(/\s+/).forEach(w=>{
      const c = w.replace(/[^\p{L}\p{N}]+/gu,'');
      if(c.length>2 && words.indexOf(c)<0) words.push(c); }); return g; };
    s = s.replace(/\*\*([^*\n]+)\*\*/g, grab).replace(/__([^_\n]+)__/g, grab);
    s = s.replace(/(^|[\s(])\*([^*\n]{2,}?)\*(?=[\s).,;:!?]|$)/g, (m,p,g)=>p+grab(m,g));
    return { text:s, words: words.slice(0,3) };
  }

  /* essência de uma sentença longa para virar título: 1ª cláusula
     (vírgula/travessão/dois-pontos) ou primeiras ~7 palavras */
  function titleFrom(sent){
    const s = String(sent||'').trim().replace(/[.…]+$/,'');
    if(s.length<=56) return { t:s, rest:'' };
    const m = s.match(/^(.{12,56}?)[,;:—–]\s+(.+)$/);
    if(m) return { t:m[1].trim(), rest:m[2].trim() };
    const w = s.split(' ');
    let t = '', i = 0;
    while(i<w.length && (t+' '+w[i]).trim().length<=52){ t = (t+' '+w[i]).trim(); i++; }
    return { t, rest: w.slice(i).join(' ') };
  }

  /* ============ parser de UM bloco → proto-slide ============ */
  function parseBlock(block, opts){
    const out = { kicker:'', title:'', sub:'', img:null, mask:null, hl:[], kind:'default', warn:null };
    let lines = block.split('\n').map(l=>l.trim()).filter(Boolean);

    /* imagens: linha-imagem inteira ou embutida no texto */
    if(opts.useImages !== false){
      lines = lines.filter(l=>{
        const m = l.match(IMG_LINE) || l.match(IMG_URL) || (IMG_DATA.test(l) ? [l,l] : null);
        if(m && !out.img){ out.img = m[1]; out.mask = opts.mask || 'cover'; return false; }
        return !m;                                   // 2ª imagem do bloco: descartada
      }).map(l=>l.replace(/!\[[^\]]*\]\((\S+?)\)/g, (mm,u)=>{
        if(!out.img){ out.img = u; out.mask = opts.mask || 'cover'; } return ''; }).trim())
        .filter(Boolean);
    }
    if(!lines.length) return out.img ? (out.kind='image', out.title='', out) : null;

    /* CITAÇÃO: '>' de markdown, aspas envolventes ou atribuição por travessão */
    const attrIx = lines.findIndex((l,i)=> i>0 && /^(—|–|--)\s*\S/.test(l));
    const quoted = /^>/.test(lines[0]) ||
      (/^[“"']/.test(lines[0]) && /[”"']$/.test(lines[attrIx>0? attrIx-1 : lines.length-1]||''));
    if(quoted){
      let body = (attrIx>0? lines.slice(0,attrIx) : lines).map(l=>l.replace(/^>\s?/,'')).join(' ');
      body = body.replace(/^[“"']\s*/,'').replace(/\s*[”"']$/,'');
      const e = emphasis(body);
      out.kind='quote';
      out.title = F.breakTitle(e.text); out.hl = e.words;
      out.sub = attrIx>0 ? lines.slice(attrIx).join(' ').replace(/^(—|–|--)\s*/,'') : '';
      return out;
    }

    /* kicker: '###', CAIXA ALTA curta, 'Rótulo:', 'Parte N' */
    const kick = l => {
      if(/^###\s+/.test(l)) return l.replace(/^###\s+/,'');
      if(l.length<=48 && /:$/.test(l) && !LIST_LN.test(l)) return l.replace(/:$/,'');
      if(l.length<=38 && l===l.toUpperCase() && /[A-ZÀ-ÖØ-Þ]/.test(l) && l.split(' ').length<=5 && !LIST_LN.test(l)) return l;
      if(l.length<=30 && KICKER_N.test(l)) return l;
      return null;
    };
    if(lines.length>1){
      const k = kick(lines[0]);
      if(k!=null){ out.kicker = k; lines = lines.slice(1); }
    }

    /* LISTA: 2+ linhas marcadas */
    const marked = lines.filter(l=>LIST_LN.test(l));
    if(marked.length>=2){
      out.kind='list';
      const pre = lines.slice(0, lines.indexOf(marked[0]));
      const items = lines.filter(l=>LIST_LN.test(l)).map(l=>{
        const e = emphasis(l.replace(LIST_LN,''));
        e.words.forEach(w=>{ if(out.hl.indexOf(w)<0) out.hl.push(w); });
        return e.text;
      });
      const tl = pre.map(l=>l.replace(/^#{1,2}\s+/,'')).join(' ').trim();
      const et = emphasis(tl);
      out.title = F.breakTitle(et.text || out.kicker || F.dtr('Pontos-chave'));
      if(!tl && out.kicker) out.kicker = '';
      et.words.forEach(w=>{ if(out.hl.indexOf(w)<0) out.hl.push(w); });
      out.hl = out.hl.slice(0,3);
      out.sub = items.join('\n');
      out._items = items.length;
      return out;
    }

    /* título: '#'/'##' ou 1ª linha curta */
    let title = null;
    if(/^#{1,2}\s+/.test(lines[0])){ title = lines[0].replace(/^#{1,2}\s+/,''); lines = lines.slice(1); }
    else if(lines[0].length<=56 && lines.length>1){ title = lines[0]; lines = lines.slice(1); }
    else if(lines.length===1 && lines[0].length<=72){ title = lines[0]; lines = []; }

    let body = lines.join(' ').trim();

    /* ESTATÍSTICA: número protagonista em linha própria ou abrindo o bloco */
    const statRe = /^[+\-]?\s?(?:R\$|US\$|\$|€)?\s?\d[\d.,]*\s?(?:%|x|X|\+|mi|mil|bi|k|K|M)?$/;
    const statTok = (title && title.length<=10 && statRe.test(title)) ? title
                  : (!title && statRe.test((body.split(' ')[0]||'')) && body.split(' ')[0].length<=8 ? body.split(' ')[0] : null);
    if(statTok){
      out.kind='stat';
      if(title && statRe.test(title)){ /* título já é o número */ }
      else { body = body.slice(statTok.length).trim(); title = statTok; }
    }

    if(!title){
      const sents = F.splitSentences(body);
      const d = titleFrom(sents[0]||'');
      title = d.t; out.warn = 'derived-title';
      body = [d.rest, ...sents.slice(1)].filter(Boolean).join(' ');
    }

    const et = emphasis(title), eb = emphasis(body);
    out.title = F.breakTitle(et.text);
    out.sub = eb.text;
    out.hl = et.words.concat(eb.words.filter(w=>et.words.indexOf(w)<0)).slice(0,3);
    return out;
  }

  /* ============ F.parseContent — o pipeline completo ============ */
  F.parseContent = function(txt, opts){
    opts = Object.assign({ target:220, maxSub:300, useImages:true, route:true, maxSlides:20 }, opts||{});
    const warnings = [];
    const text = normalize(txt);
    if(!text) return { slides:[], cta:null, warnings:['empty'] };

    let blocks = text.split(/\n{2,}/);

    /* bloco único e longo, sem estrutura de linhas: fatiar por sentenças */
    if(blocks.length===1 && blocks[0].length > opts.target*1.4 &&
       blocks[0].split('\n').length === 1 && !LIST_LN.test(blocks[0])){
      blocks = packSentences(F.splitSentences(blocks[0]), opts.target);
      warnings.push('sliced');
    }

    /* CTA global: bloco FINAL curto com verbo de ação, URL ou @ */
    let cta = null;
    if(blocks.length>1){
      const last = blocks[blocks.length-1].trim();
      const short = last.length<=90 && last.split('\n').length<=2;
      if(short && (ACTIONS.test(last) || URL_ANY.test(last) || /^@\w/.test(last) || /→/.test(last))){
        cta = last.split('\n')[0].trim();
        blocks = blocks.slice(0,-1);
        warnings.push('cta');
      }
    }

    /* blocos → proto-slides */
    let slides = [];
    for(let bi=0; bi<blocks.length; bi++){
      const p = parseBlock(blocks[bi], opts);
      if(!p) continue;
      if(p.warn) warnings.push(p.warn);

      /* bloco FINAL de AÇÃO que não coube no CTA global → slide Produto/CTA */
      if(p.kind==='default' && ACTIONS.test((p.title||'').replace(/\n/g,' ')) &&
         (p.title+p.sub).length<=200 && bi===blocks.length-1 && blocks.length>1)
        p.kind='ctaSlide';

      /* PROPORÇÃO (P4): sub excedente é dividido em slides de continuação */
      if(p.kind!=='list' && p.sub && p.sub.length > opts.maxSub){
        const chunks = packSentences(F.splitSentences(p.sub), opts.target);
        p.sub = chunks[0]||'';
        slides.push(p);
        for(const ch of chunks.slice(1)){
          const sents = F.splitSentences(ch);
          const d = titleFrom(sents[0]||'');
          slides.push({ kicker:p.kicker, title:F.breakTitle(d.t),
            sub:[d.rest, ...sents.slice(1)].filter(Boolean).join(' '),
            img:null, mask:null, hl:[], kind:'default', warn:null });
        }
        warnings.push('split');
        continue;
      }
      /* LISTA longa: fatiar em slides de até 6 itens */
      if(p.kind==='list' && p._items>6){
        const items = p.sub.split('\n');
        for(let i=0;i<items.length;i+=6)
          slides.push({ ...p, sub:items.slice(i,i+6).join('\n'), _items:Math.min(6,items.length-i) });
        warnings.push('list-split');
        continue;
      }
      slides.push(p);
    }

    if(slides.length > opts.maxSlides){
      slides = slides.slice(0, opts.maxSlides);
      warnings.push('capped');
    }

    /* ============ ROTEAMENTO SEMÂNTICO (fase 2.2) ============ */
    if(opts.route){
      let dflt = 0;
      slides.forEach((p,i)=>{
        p.tpl = p.kind==='quote'    ? 'quote'
              : p.kind==='list'     ? 'topicos'
              : p.kind==='stat'     ? 'poster'
              : p.kind==='ctaSlide' ? 'cta'
              : (p.img || p.kind==='image') ? 'split'
              : (i===0 ? 'manifesto' : (dflt++ % 2 ? 'manifesto' : 'split'));
      });
    }

    slides.forEach(p=>{ delete p._items; delete p.warn; });
    return { slides, cta, warnings };
  };

  /* ============ geração: povoar o estado e ENCADEAR a folha ============ */
  F.generateFromContent = function(txt, opts){
    opts = Object.assign({ mode:'replace', openSheet:true }, opts||{});
    const P = F.parseContent(txt, opts);
    if(!P.slides.length){
      if(F.toast) F.toast('Nenhum conteúdo reconhecido.');
      return P;
    }
    const s = F.state;
    const mk = b => Object.assign({ kicker:b.kicker||'', title:b.title||'', sub:b.sub||'',
      img:b.img||null, mask:b.mask||'cover' },
      b.hl && b.hl.length ? {hl:b.hl} : {},
      b.tpl ? {tpl:b.tpl} : {});

    if(opts.mode==='append'){
      const base = s.slides.length;
      s.slides = s.slides.concat(P.slides.map(mk));
      s.cur = base;
    } else {
      /* substituir: as chaves de edição/composição/cores do modo design
         pertencem ao carrossel antigo — descartadas para não vazarem
         para as artes novas (motion permanece intacto) */
      F.remapArtKeys && F.remapArtKeys('design', ()=>-1);
      s.slides = P.slides.map(mk);
      s.cur = 0;
    }
    if(P.cta) s.cta = P.cta;

    /* seeds de eixo NOVOS (travas respeitadas) — o carrossel nasce com
       cara própria e desagua na folha de contato: cole → gere → escolha.
       opts.seed (opcional) torna a derivação determinística p/ testes. */
    const L = s.seedLocks||{};
    const rr = opts.seed!=null ? F.rngOf(opts.seed) : Math.random;
    const rnd = ()=>1+Math.floor(rr()*99999);
    s.seeds = {
      layout : L.layout  ? F.seedOf('layout') : rnd(),
      palette: L.palette ? ((s.seeds||{}).palette ?? null) : rnd(),
      type   : L.type    ? F.seedOf('type')   : rnd(),
    };

    if(F.render) F.render();
    F.autoSave && F.autoSave();
    if(F.toast) F.toast(P.slides.length+' slides gerados do conteúdo'+(P.cta?' · CTA detectado':'')+'.');
    if(opts.openSheet!==false && F.ui && F.ui.toggleVarSheet) F.ui.toggleVarSheet(true);
    return P;
  };
})(window.FORMA);

</script>
<script>
/* ===== js/core/batch.js ===== */
/* =====================================================
   FORJE·studio — core/batch.js  (Eixo 3 · fase 3.1)
   DADOS → N ARTES. CSV/JSON local (parser próprio, sem
   dependência), mapeamento coluna → campo, seed POR LINHA
   (hash(linha) ⊕ eixo de layout → slide.sd) e export
   nomeado por campo. Determinístico: mesmos dados + mesmos
   seeds → mesmas artes (P3); travas de eixo respeitadas.
   Nada aqui roda em projetos antigos — sem sd, F.artOff
   devolve exatamente i*101 (P1).
   ===================================================== */
(function(F){

  /* ---------- hash determinístico (djb2 xor) ---------- */
  F.hashStr = function(str){
    let h = 5381;
    for(let i=0;i<str.length;i++) h = ((h*33) ^ str.charCodeAt(i)) >>> 0;
    return h >>> 0;
  };

  /* ---------- CSV: parser pequeno e correto ----------
     Aspas (RFC 4180): campo entre "…" preserva vírgulas,
     quebras de linha e "" (aspas escapadas). Delimitador
     detectado entre , ; e TAB pela 1ª linha fora de aspas.
     BOM e CRLF tolerados. */
  F.parseCSV = function(txt){
    txt = String(txt||'').replace(/^\uFEFF/,'');
    /* detecção do delimitador: conta candidatos fora de aspas na 1ª linha lógica */
    let inQ=false, counts={',':0,';':0,'\t':0}, i=0;
    for(; i<txt.length; i++){
      const c = txt[i];
      if(c==='"') inQ=!inQ;
      else if(!inQ && (c==='\n')) break;
      else if(!inQ && counts[c]!=null) counts[c]++;
    }
    const delim = counts[';']>counts[','] ? ';' : (counts['\t']>counts[','] ? '\t' : ',');

    const rows=[]; let row=[], cell='', q=false;
    for(i=0;i<txt.length;i++){
      const c = txt[i];
      if(q){
        if(c==='"'){ if(txt[i+1]==='"'){ cell+='"'; i++; } else q=false; }
        else cell+=c;
      } else {
        if(c==='"') q=true;
        else if(c===delim){ row.push(cell); cell=''; }
        else if(c==='\n'){ row.push(cell.replace(/\r$/,'')); rows.push(row); row=[]; cell=''; }
        else cell+=c;
      }
    }
    if(cell!=='' || row.length){ row.push(cell.replace(/\r$/,'')); rows.push(row); }
    while(rows.length && rows[rows.length-1].every(v=>v==='')) rows.pop();
    if(!rows.length) return {headers:[], rows:[]};
    const headers = rows[0].map(h=>String(h).trim());
    const out = rows.slice(1).map(r=>{
      const o={}; headers.forEach((h,k)=>{ o[h] = (r[k]??'').trim(); }); return o;
    });
    return {headers, rows:out};
  };

  /* ---------- tabela: JSON (array de objetos) ou CSV ---------- */
  F.parseTable = function(txt){
    const t = String(txt||'').trim();
    if(t[0]==='[' || t[0]==='{'){
      try{
        let j = JSON.parse(t);
        if(!Array.isArray(j)) j = j.rows||j.data||j.items||[j];
        j = j.filter(o=>o && typeof o==='object');
        const headers = []; j.forEach(o=>Object.keys(o).forEach(k=>{ if(headers.indexOf(k)<0) headers.push(k); }));
        return {headers, rows:j.map(o=>{ const r={}; headers.forEach(h=>r[h]=String(o[h]??'').trim()); return r; })};
      }catch(e){ /* cai para CSV */ }
    }
    return F.parseCSV(t);
  };

  /* ---------- mapeamento coluna → campo (palpite por nome) ---------- */
  const GUESS = {
    title : /^(t[ií]tulo|title|nome do post|headline|produto|product|nome|name|episo|assunto)/i,
    kicker: /^(kicker|chap[eé]u|categoria|category|tag|se[çc][ãa]o|section|tipo|label|r[óo]tulo)/i,
    sub   : /^(sub|descri|desc|texto|body|corpo|apoio|resumo|summary|detal|bio|fala|convidado|guest)/i,
    img   : /^(img|image|imagem|foto|photo|capa|thumb|url da imagem|picture)/i,
    name  : /^(arquivo|file|filename|slug|nome do arquivo|id|c[óo]digo|sku)$/i,
    value : /^(valor|value|n[úu]mero|number|qtd|quantidade|count|m[ée]trica|metric)/i,
    suffix: /^(sufixo|suffix|unidade|unit)$/i,
  };
  F.guessMap = function(headers){
    const map = {title:'', kicker:'', sub:'', img:'', name:'', value:'', suffix:''};
    for(const field of ['title','kicker','sub','img','name','value','suffix'])
      for(const h of headers)
        if(!map[field] && GUESS[field].test(h) &&
           Object.values(map).indexOf(h)<0){ map[field]=h; break; }
    if(!map.title && headers.length) map.title = headers.find(h=>Object.values(map).indexOf(h)<0) || headers[0];
    return map;
  };

  /* ---------- helpers de célula (mesma gramática do parser do Eixo 2) --- */
  const STAT = /^\s*(?:[+\-~≈]?\s*(?:R\$|US\$|\$|€|£)?\s*\d[\d.,]*\s*(?:%|x|X|mi|mil|bi|k|K|M|\+)?)\s*$/;
  const IMGU = /^(https?:\/\/\S+\.(?:png|jpe?g|webp|gif|avif|svg)(?:\?\S*)?|data:image\/[^;]+;base64,\S+)$/i;
  function pullMarks(txt){                       // **palavra** → destaque garantido
    const hl=[];
    const out = String(txt||'').replace(/\*\*([^*\n]{1,40})\*\*|__([^_\n]{1,40})__/g,
      (m,a,b)=>{ const w=(a||b).trim(); if(w && hl.length<3) hl.push(w); return a||b; });
    return {txt:out, hl};
  }
  F.slug = function(s){
    return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase().slice(0,48) || 'arte';
  };

  /* ---------- linhas → slides ----------
     mapping: {title, kicker, sub, img, name} (nomes de coluna; vazio = ignora)
     opts: { route:true       — img→split, número protagonista→poster
             perLine:true     — slide.sd = hash(linha) ⊕ seedOf('layout')
             max:60 }                                                     */
  F.batchSlides = function(rows, mapping, opts){
    opts = Object.assign({route:true, perLine:true, max:60}, opts||{});
    const warnings = [];
    if(rows.length > opts.max){ rows = rows.slice(0, opts.max); warnings.push('capped'); }
    const axis = F.seedOf ? (F.seedOf('layout')||0) : 0;
    const slides = rows.map((row,i)=>{
      const cell = k => mapping[k] ? String(row[mapping[k]]??'').trim() : '';
      const T = pullMarks(cell('title')), S = pullMarks(cell('sub'));
      const sl = {
        kicker: cell('kicker'),
        title : F.breakTitle ? F.breakTitle(T.txt) : T.txt,
        sub   : S.txt,
        img   : IMGU.test(cell('img')) ? cell('img') : null,
        mask  : 'cover',
      };
      const hl = T.hl.concat(S.hl).slice(0,3);
      if(hl.length) sl.hl = hl;
      const nm = cell('name') || cell('title');
      if(nm) sl.name = F.slug(nm);
      if(opts.route){
        if(sl.img) sl.tpl = 'split';
        else if(STAT.test(T.txt)) sl.tpl = 'poster';
      }
      if(opts.perLine){
        const rowStr = ['title','kicker','sub','img','name'].map(cell).join('\u001f');
        sl.sd = ((F.hashStr(rowStr) ^ axis) >>> 0) % 900000;    // hash(linha) ⊕ eixo
      }
      if(!sl.title && !sl.sub) warnings.push('empty:'+(i+1));
      return sl;
    }).filter(sl=>sl.title || sl.sub || sl.img);
    return {slides, warnings};
  };

  /* ---------- geração: dados → estado (espelho do generateFromContent) -- */
  F.generateFromData = function(rows, mapping, opts){
    opts = opts||{};
    const s = F.state;

    /* seeds de eixo primeiro (travas respeitadas) — o sd por linha
       é derivado do eixo de layout NOVO, ficando estável dentro da
       geração e re-derivável com o mesmo opts.seed (P3) */
    const L = s.seedLocks||{};
    const rr = opts.seed!=null ? F.rngOf(opts.seed) : Math.random;
    const rnd = ()=>1+Math.floor(rr()*99999);
    s.seeds = {
      layout : L.layout  ? F.seedOf('layout') : rnd(),
      palette: L.palette ? ((s.seeds||{}).palette ?? null) : rnd(),
      type   : L.type    ? F.seedOf('type')   : rnd(),
    };

    const B = F.batchSlides(rows, mapping, opts);
    if(!B.slides.length){ F.toast && F.toast('Nenhuma linha com conteúdo — confira o mapeamento.'); return B; }

    if(opts.mode==='append'){
      const base = s.slides.length;
      s.slides = s.slides.concat(B.slides.map(b=>Object.assign(F.defSlide(0), b)));
      s.cur = base;
    } else {
      F.remapArtKeys && F.remapArtKeys('design', ()=>-1);   // edições do carrossel antigo
      s.slides = B.slides.map(b=>Object.assign(F.defSlide(0), b));
      s.cur = 0;
    }

    if(F.render) F.render();
    F.autoSave && F.autoSave();
    if(F.toast) F.toast(B.slides.length+' artes geradas dos dados'+(B.warnings.indexOf('capped')>=0?' (limite de '+(opts.max||60)+' linhas)':'')+'.');
    if(opts.openSheet!==false && F.ui && F.ui.toggleVarSheet) F.ui.toggleVarSheet(true);
    return B;
  };

  /* =====================================================
     Fase 3.3 · DADOS → MOTION (um MP4 por linha)
     A timeline é o TEMPLATE. Mecanismo primário: mail-merge
     por placeholder {{coluna}} nos textos das cenas — preciso,
     preserva narrativas multi-cena (certificado: "Certificamos
     que {{nome}}…"). Fallback: sem nenhum placeholder na
     timeline, os campos MAPEADOS (kicker/título/sub/img/
     valor/sufixo) são aplicados a todas as cenas.
     ===================================================== */
  const PH = /\{\{\s*([^{}\n]+?)\s*\}\}/g;
  const SUBFIELDS = ['kicker','title','sub','items','suffix'];

  F.timelineHasPH = function(timeline){
    return (timeline||[]).some(sc=>SUBFIELDS.concat('img').some(f=>{
      PH.lastIndex = 0; return typeof sc[f]==='string' && PH.test(sc[f]); }));
  };

  /* substitui UMA linha na timeline → cópia profunda; nunca muta o template */
  F.subTimeline = function(timeline, row, mapping){
    const keys = Object.keys(row||{});
    const kmap = {}; keys.forEach(k=>kmap[k.trim().toLowerCase()]=k);
    const cellByPH = name => { const k = kmap[String(name).trim().toLowerCase()];
      return k!=null ? String(row[k]??'') : null; };
    const cell = f => mapping && mapping[f] ? String(row[mapping[f]]??'').trim() : '';
    const usePH = F.timelineHasPH(timeline);
    let hits = 0;
    const sub = s => String(s).replace(PH, (m,name)=>{
      const v = cellByPH(name); if(v==null) return m;      // coluna desconhecida fica visível
      hits++; return v; });
    const out = (timeline||[]).map(sc=>{
      const c = JSON.parse(JSON.stringify(sc));
      if(usePH){
        for(const f of SUBFIELDS) if(typeof c[f]==='string') c[f] = sub(c[f]);
        if(typeof c.img==='string' && PH.test((PH.lastIndex=0, c.img))){
          const v = sub(c.img); c.img = IMGU.test(v.trim()) ? v.trim() : null;
        }
        if(typeof c.value==='string'){ const v = parseFloat(sub(c.value).replace(',','.'));
          c.value = isFinite(v) ? v : 0; }
      } else {
        if(cell('kicker')) c.kicker = cell('kicker');
        if(cell('title'))  c.title  = cell('title');
        if(cell('sub'))    c.sub    = cell('sub');
        if(cell('img') && IMGU.test(cell('img'))) c.img = cell('img');
        if(mapping && mapping.value){ const v = parseFloat(cell('value').replace(',','.'));
          if(isFinite(v)) c.value = v; }
        if(cell('suffix')) c.suffix = cell('suffix');
      }
      return c;
    });
    return { timeline: out, hits, mode: usePH ? 'placeholder' : 'mapping' };
  };

  /* nomes por linha, com dedup por sufixo -rN */
  F.batchVideoNames = function(rows, mapping){
    const seen = {};
    return rows.map((row,i)=>{
      const cell = f => mapping && mapping[f] ? String(row[mapping[f]]??'').trim() : '';
      let base = F.slug(cell('name') || cell('title') || ('linha-'+(i+1)));
      if(seen[base]) base += '-r'+(i+1);
      seen[base] = 1;
      return 'forje_'+base+'.mp4';
    });
  };

  F.exportVideoBatch = async function(rows, mapping, opts){
    opts = opts||{};
    const s = F.state, max = opts.max||20;
    if(!s.timeline || !s.timeline.length) return F.toast('Monte a timeline (modo MOTION) primeiro — ela é o template do lote.');
    if(!('VideoEncoder' in window) || !('VideoFrame' in window) || !window.Mp4Muxer)
      return F.toast('Lote de vídeo requer WebCodecs (Chrome/Edge) — o fallback WebM em tempo real seria inviável para N vídeos.');
    let capped = false;
    if(rows.length > max){ rows = rows.slice(0,max); capped = true; }
    const names = F.batchVideoNames(rows, mapping);
    const keepTL = s.timeline, keepMode = s.mode, keepScene = s.curScene;
    const N = rows.length; let done = 0;
    F.prog(true, 'Lote de vídeo · timeline como template…'); F.progSet(0);
    try{
      s.mode = 'motion';
      for(let r=0; r<N; r++){
        const S = F.subTimeline(keepTL, rows[r], mapping);
        s.timeline = S.timeline;
        await F.exportVideo({ quiet:true, name:names[r],
          progBase: r/N, progSpan: 1/N });
        done++;
      }
      F.toast(done+' vídeos gerados da timeline'+(capped?' (limite de '+max+' linhas)':'')+'.');
    }catch(e){ console.error(e); F.toast('Lote interrompido no vídeo '+(done+1)+'/'+N+': '+e.message);
    }finally{
      s.timeline = keepTL; s.mode = keepMode; s.curScene = keepScene;
      F.prog(false); if(F.render) F.render();
    }
    return { done, names: names.slice(0,done) };
  };
})(window.FORMA);

</script>

  /* ---------- padrões dinâmicos: [regex, en(m), es(m)] ---------- */
  const RX = [
    [/^Slide (\d+) removido — composições e cores dos demais preservadas\.$/,
      m=>`Slide ${m[1]} removed — compositions and colors of the others preserved.`,
      m=>`Slide ${m[1]} eliminado — composiciones y colores de los demás preservados.`],
    [/^Slide (\d+) adicionado e selecionado\.$/,
      m=>`Slide ${m[1]} added and selected.`, m=>`Slide ${m[1]} añadido y seleccionado.`],
    [/^Imagem aplicada (.+)\.$/,
      m=>`Image applied (${m[1]}).`, m=>`Imagen aplicada (${m[1]}).`],
    [/^Fonte "(.+)" carregada como display\. Salve o brandbook para persistir\.$/,
      m=>`Font "${m[1]}" loaded as display. Save the brandbook to persist it.`,
      m=>`Fuente "${m[1]}" cargada como display. Guarda el brandbook para persistirla.`],
    [/^Não consegui carregar essa fonte: (.*)$/,
      m=>`Could not load this font: ${m[1]}`, m=>`No pude cargar esta fuente: ${m[1]}`],
    [/^Plugin "(.+)" falhou: (.*)$/,
      m=>`Plugin "${m[1]}" failed: ${m[2]}`, m=>`El plugin "${m[1]}" falló: ${m[2]}`],
    [/^Falha no PDF: (.*)$/, m=>`PDF failure: ${m[1]}`, m=>`Fallo en el PDF: ${m[1]}`],
    [/^Falha no PPTX: (.*)$/, m=>`PPTX failure: ${m[1]}`, m=>`Fallo en el PPTX: ${m[1]}`],
    [/^Falha no vídeo: (.*)$/, m=>`Video failure: ${m[1]}`, m=>`Fallo en el video: ${m[1]}`],
    [/^Falha na exportação: (.*)$/, m=>`Export failure: ${m[1]}`, m=>`Fallo en la exportación: ${m[1]}`],
    [/^cena (\d+)\/(\d+)(.*)$/, m=>`scene ${m[1]}/${m[2]}${m[3]}`, m=>`escena ${m[1]}/${m[2]}${m[3]}`],
    [/^Cena (\d+) — (.*)$/, m=>`Scene ${m[1]} — ${tr(m[2])}`, m=>`Escena ${m[1]} — ${tr(m[2])}`],
    [/^Imagem do slide (\d+)$/, m=>`Slide ${m[1]} image`, m=>`Imagen del slide ${m[1]}`],
    [/^remover slide (\d+)$/, m=>`remove slide ${m[1]}`, m=>`quitar slide ${m[1]}`],
    [/^remover o slide (\d+)$/, m=>`remove slide ${m[1]}`, m=>`quitar el slide ${m[1]}`],
    [/^remover cena (\d+)$/, m=>`remove scene ${m[1]}`, m=>`quitar escena ${m[1]}`],
    [/^selecionar (slide|cena) (\d+) para edição em todas as abas$/,
      m=>`select ${m[1]==='slide'?'slide':'scene'} ${m[2]} for editing in all tabs`,
      m=>`seleccionar ${m[1]==='slide'?'slide':'escena'} ${m[2]} para edición en todas las pestañas`],
  ];

  /* ---------- estado do idioma ---------- */
  const LANGS = ['pt','en','es'];
  F.langPref = 'auto';                 // 'auto' | 'pt' | 'en' | 'es'
  F.lang = 'pt';

  function detect(){
    const cands = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'pt'])
      .map(l=>String(l).toLowerCase());
    for(const l of cands){
      if(l.startsWith('pt')) return 'pt';
      if(l.startsWith('es')) return 'es';
      if(l.startsWith('en')) return 'en';
    }
    return 'en';                       // fallback global: inglês
  }
  function resolve(){ return F.langPref==='auto' ? detect() : F.langPref; }

  const COL = {en:0, es:1};
  function tr(pt){                     // traduz uma string PT → idioma atual
    if(F.lang==='pt' || pt==null) return pt;
    const key = String(pt);
    const hit = S[key];
    if(hit) return hit[COL[F.lang]] || key;
    for(const [rx, en, es] of RX){
      const m = key.match(rx);
      if(m) return (F.lang==='en' ? en : es)(m);
    }
    return key;                        // sem tradução: mantém PT
  }
  F.t = tr;                            // API pública p/ novos módulos

  /* ---------- tradutor de DOM ----------
     Guarda o original PT de cada nó/atributo num WeakMap e
     sempre traduz A PARTIR do original — trocar de idioma
     re-traduz tudo, inclusive de volta ao PT. */
  const origText = new WeakMap();      // Text -> string PT
  const lastSet  = new WeakMap();      // Text -> última string escrita por nós
  const origAttr = new WeakMap();      // Element -> {attr: valor PT}
  const ATTRS = ['title','placeholder','aria-label','alt'];

  function skip(el){
    for(let n = el; n; n = n.parentElement){
      if(n.classList && (n.classList.contains('art') || n.hasAttribute('data-no-i18n'))) return true;
      const tag = n.tagName;
      if(tag==='SCRIPT' || tag==='STYLE' || tag==='TEXTAREA') return true;
    }
    return false;
  }

  function txNode(node){
    const cur = node.nodeValue;
    if(!cur || !cur.trim()) return;
    let pt = origText.get(node);
    if(pt===undefined || (lastSet.get(node)!==cur)){ pt = cur; origText.set(node, pt); }
    const lead = pt.match(/^\s*/)[0], tail = pt.match(/\s*$/)[0];
    const out = lead + tr(pt.trim()) + tail;
    if(out!==cur){ lastSet.set(node, out); node.nodeValue = out; }
    else lastSet.set(node, cur);
  }

  function txAttrs(el){
    let store = origAttr.get(el);
    for(const a of ATTRS){
      if(!el.hasAttribute(a)) continue;
      const cur = el.getAttribute(a);
      if(!store) { store = {}; origAttr.set(el, store); }
      if(store[a]===undefined || store['__set_'+a]!==cur) store[a] = cur;
      const out = tr(store[a]);
      if(out!==cur) el.setAttribute(a, out);
      store['__set_'+a] = el.getAttribute(a);
    }
  }

  function txTree(root){
    if(root.nodeType===3){ if(root.parentElement && !skip(root.parentElement)) txNode(root); return; }
    if(root.nodeType!==1 || skip(root)) return;
    txAttrs(root);
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
      acceptNode(n){
        if(n.nodeType===1) return skip(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n; while((n = walker.nextNode())){
      if(n.nodeType===3) txNode(n); else txAttrs(n);
    }
  }

  const TITLES = {
    pt:'Forje·studio — design & motion por sistema',
    en:'Forje·studio — design & motion by system',
    es:'Forje·studio — diseño & motion por sistema',
  };
  function apply(){
    document.documentElement.lang = F.lang==='pt' ? 'pt-BR' : F.lang;
    document.title = TITLES[F.lang] || TITLES.pt;
    if(document.body) txTree(document.body);
    artSync();
  }

  /* ---------- conteúdo PADRÃO da arte (templates/cenas pré-prontos) ----------
     Regra: o que o USUÁRIO escreveu jamais é tocado. Só trocamos textos que
     são EXATAMENTE um padrão de fábrica (em qualquer dos 3 idiomas) pelo
     equivalente no idioma atual — slides/cenas/CTA pré-prontos acompanham a
     troca de idioma; o design em criação permanece intacto. */
  const ART = {
    'LANÇAMENTO': ['LAUNCH','LANZAMIENTO'],
    'PARTE': ['PART','PARTE'],
    'Pontos-chave': ['Key points','Puntos clave'],
    'Design de sistema,\nnão de sorte': ['Design by system,\nnot by luck','Diseño por sistema,\nno por suerte'],
    'Continue a história aqui': ['Continue the story here','Continúa la historia aquí'],
    'Um brandbook, infinitas composições. Determinístico quando você quer, variável quando você pede.':
      ['One brandbook, endless compositions. Deterministic when you want, variable when you ask.',
       'Un brandbook, infinitas composiciones. Determinístico cuando quieres, variable cuando lo pides.'],
    'Saiba mais →': ['Learn more →','Saber más →'],
    'Rápido\nConsistente\nSeu': ['Fast\nConsistent\nYours','Rápido\nConsistente\nTuyo'],
    /* nomes das cenas pré-prontas (viram o título default da cena) */
    'Abertura de logo': ['Logo opening','Apertura de logo'],
    'Statement': ['Statement','Statement'],
    'Ponto com ícone': ['Point with icon','Punto con icono'],
    'Vitrine de imagem': ['Image showcase','Vitrina de imagen'],
    'Número que cresce': ['Growing number','Número que crece'],
    'Lista revelada': ['Revealed list','Lista revelada'],
    'Encerramento CTA': ['CTA closing','Cierre CTA'],
    'Split imagem+texto': ['Split image+text','Split imagen+texto'],
    'Citação': ['Quote','Cita'],
    'Passos numerados': ['Numbered steps','Pasos numerados'],
    'Marquee': ['Marquee','Marquee'],
  };
  const A_COL = {pt:null, en:0, es:1};
  /* qualquer idioma → idioma atual (só para valores exatamente padrão) */
  function artTr(v){
    if(v==null || v==='') return v;
    const s = String(v);
    for(const pt in ART){
      const [en,es] = ART[pt];
      if(s===pt || s===en || s===es)
        return F.lang==='pt' ? pt : ART[pt][A_COL[F.lang]];
    }
    const m = s.match(/^(PARTE|PART) (0?\d+)$/);
    if(m) return (F.lang==='en' ? 'PART ' : 'PARTE ') + m[2];
    return v;                                   // texto do usuário: intocado
  }
  F.dtr = artTr;                                // defaults novos nascem no idioma atual
  function artSync(){
    if(!F.state) return;
    let dirty = false;
    const sw = (obj,k)=>{ const nv = artTr(obj[k]); if(nv!==obj[k]){ obj[k]=nv; dirty=true; } };
    sw(F.state,'cta');
    (F.state.slides||[]).forEach(sl=>{ sw(sl,'kicker'); sw(sl,'title'); sw(sl,'sub'); });
    (F.state.timeline||[]).forEach(sc=>{ sw(sc,'kicker'); sw(sc,'title'); sw(sc,'sub'); sw(sc,'items'); });
    if(dirty){
      F.autoSave && F.autoSave();
      F.render && F.render(false);
      if(F.ui && F.ui.refreshActive) F.ui.refreshActive();   // inputs do CONTEÚDO/CENA acompanham
    }
  }

  F.setLang = async function(pref){
    F.langPref = LANGS.includes(pref) ? pref : 'auto';
    F.lang = resolve();
    try{ await F.stSet('forma:lang', F.langPref); }catch(e){}
    apply();
  };

  /* observer: pega painéis reconstruídos, toasts, labels dinâmicos */
  let obs;
  function watch(){
    if(obs) return;
    obs = new MutationObserver(muts=>{
      if(F.lang==='pt') return;                      // PT é a fonte: nada a fazer
      for(const m of muts){
        if(m.type==='characterData'){
          const node = m.target;
          if(node.nodeValue!==lastSet.get(node) && node.parentElement && !skip(node.parentElement)){
            origText.set(node, node.nodeValue);      // novo conteúdo genuíno
            txNode(node);
          }
        }else if(m.type==='childList'){
          m.addedNodes.forEach(n=>txTree(n));
        }else if(m.type==='attributes'){
          const el = m.target;
          if(el.nodeType===1 && !skip(el)){
            const store = origAttr.get(el), a = m.attributeName;
            const cur = el.getAttribute(a);
            if(cur!=null && (!store || store['__set_'+a]!==cur)){
              if(store) store[a] = cur;
              txAttrs(el);
            }
          }
        }
      }
    });
    obs.observe(document.body, {childList:true, subtree:true, characterData:true,
      attributes:true, attributeFilter:ATTRS});
  }

  /* ---------- boot ---------- */
  F.i18nInit = async function(){
    try{ const saved = await F.stGet('forma:lang'); if(saved && LANGS.concat('auto').includes(saved)) F.langPref = saved; }catch(e){}
    F.lang = resolve();
    apply();
    watch();
  };

})(window.FORMA);

</script>
<script>
/* ===== js/lib/fonts.js ===== */
/* =====================================================
   FORJE·studio — lib/fonts.js
   Catálogo de fontes por PAPEL (display/body), expansível.
   Para adicionar: FORMA.fonts.register(id,{n,css,gf,role})
   e incluir a família no link do Google Fonts (index.html).
   Fontes custom (.ttf/.otf/.woff2) entram via upload e são
   persistidas em dataURL dentro do brandbook.
   ===================================================== */
(function(F){
  const r = (id,n,css,role)=>F.fonts.register(id,{n,css,role});

  /* display — personalidade */
  r('archivo',  'Archivo Black',   "'Archivo Black',sans-serif",        'display');
  r('anton',    'Anton',           "'Anton',sans-serif",                'display');
  r('bebas',    'Bebas Neue',      "'Bebas Neue',sans-serif",           'display');
  r('space',    'Space Grotesk',   "'Space Grotesk',sans-serif",        'both');
  r('sora',     'Sora',            "'Sora',sans-serif",                 'both');
  r('syne',     'Syne',            "'Syne',sans-serif",                 'display');
  r('unbounded','Unbounded',       "'Unbounded',sans-serif",            'display');
  r('playfair', 'Playfair Display',"'Playfair Display',serif",          'display');
  r('fraunces', 'Fraunces',        "'Fraunces',serif",                  'display');
  r('dmserif',  'DM Serif Display',"'DM Serif Display',serif",          'display');

  /* body — leitura */
  r('inter',    'Inter',           "'Inter',sans-serif",                'body');
  r('manrope',  'Manrope',         "'Manrope',sans-serif",              'body');
  r('outfit',   'Outfit',          "'Outfit',sans-serif",               'body');
  r('worksans', 'Work Sans',       "'Work Sans',sans-serif",            'body');
  r('plexmono', 'IBM Plex Mono',   "'IBM Plex Mono',monospace",         'both');
  r('jetbrains','JetBrains Mono',  "'JetBrains Mono',monospace",        'both');

  /* resolve o css de uma fonte (catálogo ou custom do brandbook) */
  F.fontCSS = function(id){
    if(id && id.startsWith('custom:')){
      const name = id.slice(7);
      return `'${name}',sans-serif`;
    }
    const f = F.fonts.get(id);
    return f ? f.css : "'Inter',sans-serif";
  };

  /* carrega as fontes custom do brandbook no documento via FontFace */
  F.loadCustomFonts = async function(){
    const list = F.state.brand.customFonts || [];
    for(const cf of list){
      try{
        const ff = new FontFace(cf.name, `url(${cf.data})`);
        await ff.load(); document.fonts.add(ff);
      }catch(e){ console.warn('fonte custom falhou:', cf.name, e); }
    }
  };
  F.addCustomFont = async function(file){
    const name = file.name.replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9 _-]/g,'');
    const data = await new Promise((res,rej)=>{ const rd=new FileReader();
      rd.onload=()=>res(rd.result); rd.onerror=rej; rd.readAsDataURL(file); });
    const ff = new FontFace(name, `url(${data})`);
    await ff.load(); document.fonts.add(ff);
    F.state.brand.customFonts = F.state.brand.customFonts || [];
    F.state.brand.customFonts.push({name, data});
    return 'custom:'+name;
  };
})(window.FORMA);

</script>

<script>
/* ===== js/lib/anims.js ===== */
/* =====================================================
   FORJE·studio — lib/anims.js
   1) anims: metadados das animações disponíveis (as
      keyframes vivem em css/art.css). Serve de contrato
      para templates/cenas e para UIs futuras de edição.
   2) fx: efeitos de acabamento (camadas sobre a arte).
   3) elements: decorações compostas por RNG.
   Expandir = registrar aqui + (se nova) keyframe no art.css.
   ===================================================== */
(function(F){

  /* ---------- animações ---------- */
  const a = (id,n,kind)=>F.anims.register(id,{n,kind});
  a('fade','Fade','in');            a('fade-up','Fade sobe','in');
  a('clip','Revela →','in');        a('clip-up','Revela ↑','in');
  a('scale','Escala','in');         a('blur','Desfoque','in');
  a('line','Linha →','in');         a('line-y','Linha ↓','in');
  a('pop','Pop','in');              a('slide-l','Desliza ←','in');
  a('slide-r','Desliza →','in');    a('rise','Sobe e assenta','in');
  a('letters','Letra a letra','in');a('draw','Traço SVG','in');
  a('flip-x','Vira ↕ 3D','in');     a('flip-y','Vira ↔ 3D','in');
  a('bounce','Quica','in');         a('swing','Balança','in');
  a('rotate','Gira e entra','in');  a('zoom-in','Aproxima','in');
  a('blur-up','Desfoque sobe','in');a('skew','Inclina','in');
  a('tracking','Espaça letras','in');a('iris','Íris','in');
  a('type','Digitação','in');
  a('sketch','Rascunho (traço)','in');a('ink','Tinta (traço+fade)','in');
  a('unfold','Desdobra','in');       a('roll','Rola e entra','in');
  a('elastic','Elástico','in');      a('trace','Traço vivo','loop');
  a('float','Flutua','loop');       a('orbit','Orbita','loop');
  a('spin','Gira','loop');          a('pulse','Pulsa','loop');
  a('wobble','Gangorra','loop');    a('breathe','Respira','loop');

  /* ---------- efeitos de acabamento ---------- */
  const x = (id,n,cls)=>F.fx.register(id,{n,cls});
  x('grain',    'Granulado',   'fx-grain');
  x('vignette', 'Vinheta',     'fx-vignette');
  x('scanlines','Scanlines',   'fx-scanlines');
  x('frame',    'Moldura',     'fx-frame');
  x('glowtop',  'Brilho topo', 'fx-glowtop');

  /* ---------- elementos decorativos (usam RNG) ---------- */
  const e = (id,n,html)=>F.elements.register(id,{n,html});
  e('ring','Anel', r =>
    `<div class="abs" data-anim="spin" style="right:${(-16+r()*10).toFixed(0)}%;top:${(-20+r()*10).toFixed(0)}%;width:52%;aspect-ratio:1;border:calc(var(--u)*0.5px) solid color-mix(in srgb,var(--b-p1) 55%,transparent);border-radius:50%"></div>`);
  e('asterisk','Asterisco', r =>
    `<div class="abs" data-anim="pulse" style="right:${(6+r()*8).toFixed(0)}%;top:${(8+r()*8).toFixed(0)}%;font-size:calc(var(--u)*7px);color:var(--b-p2)">✳</div>`);
  e('dots','Pontos', r =>
    `<div class="abs" data-anim="orbit" style="right:${(5+r()*8).toFixed(0)}%;top:${(6+r()*8).toFixed(0)}%;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1.4px)">${'<i style="width:calc(var(--u)*1px);aspect-ratio:1;border-radius:50%;background:var(--b-p2)"></i>'.repeat(12)}</div>`);
  e('cross','Cruzeta', r =>
    `<div class="abs" data-anim="pulse" style="left:${(6+r()*6).toFixed(0)}%;bottom:${(10+r()*10).toFixed(0)}%;width:calc(var(--u)*5px);aspect-ratio:1;color:var(--b-ac)"><svg class="ic" viewBox="0 0 24 24" style="width:100%;height:100%"><path d="M12 4v16M4 12h16"/></svg></div>`);
  e('squiggle','Rabisco', r =>
    `<div class="abs" data-anim="draw" style="--dash:200;left:${(50+r()*20).toFixed(0)}%;bottom:${(8+r()*8).toFixed(0)}%;width:calc(var(--u)*16px);color:var(--b-ac)"><svg class="ic" viewBox="0 0 100 20" style="width:100%;height:auto;stroke-width:4"><path d="M2 12 C 15 2, 25 22, 38 12 S 60 2, 72 12 S 92 20, 98 8"/></svg></div>`);
  e('burst','Explosão', r =>
    `<div class="abs" data-anim="spin" style="right:${(8+r()*8).toFixed(0)}%;bottom:${(12+r()*8).toFixed(0)}%;width:calc(var(--u)*9px);aspect-ratio:1;color:var(--b-ac)"><svg class="ic" viewBox="0 0 24 24" style="width:100%;height:100%;stroke-width:1.4"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></div>`);

  e('plusgrid','Grade de cruzetas', r =>{
    let g=''; for(let i=0;i<9;i++) g+=`<span style="display:grid;place-items:center;font-size:calc(var(--u)*1.6px);opacity:.7">+</span>`;
    return `<div class="abs" data-anim="fade" style="right:${(6+r()*8).toFixed(0)}%;top:${(8+r()*10).toFixed(0)}%;display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.6px);color:var(--b-ac);font-weight:700">${g}</div>`;});
  e('orbits','Órbitas', r =>
    `<div class="abs" data-anim="fade" style="left:${(4+r()*6).toFixed(0)}%;top:${(8+r()*12).toFixed(0)}%;width:calc(var(--u)*11px);aspect-ratio:1;color:var(--b-p2)">
      <i style="position:absolute;inset:0;border:1px solid currentColor;border-radius:50%;opacity:.55"></i>
      <i style="position:absolute;inset:22%;border:1px solid currentColor;border-radius:50%;opacity:.75"></i>
      <i data-anim="pulse" style="position:absolute;left:50%;top:-3%;width:14%;aspect-ratio:1;border-radius:50%;background:var(--b-ac)"></i></div>`);
  e('sparkles','Faíscas', r =>{
    let sp='';
    for(let i=0;i<3;i++) sp+=`<i data-anim="pop" style="--d:${(.4+i*.25).toFixed(2)}s;position:absolute;left:${(i*34+r()*14).toFixed(0)}%;top:${(r()*70).toFixed(0)}%;width:calc(var(--u)*${(2+r()*2).toFixed(1)}px);aspect-ratio:1;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);background:var(--b-ac)"></i>`;
    return `<div class="abs" style="right:${(6+r()*10).toFixed(0)}%;top:${(8+r()*12).toFixed(0)}%;width:calc(var(--u)*14px);height:calc(var(--u)*10px)">${sp}</div>`;});
  e('ticks','Riscos diagonais', r =>{
    let t=''; for(let i=0;i<4;i++) t+=`<i style="display:block;width:calc(var(--u)*4px);height:calc(var(--u)*0.5px);background:currentColor;border-radius:99px"></i>`;
    return `<div class="abs" data-anim="slide-r" style="left:${(5+r()*6).toFixed(0)}%;bottom:${(10+r()*10).toFixed(0)}%;display:flex;flex-direction:column;gap:calc(var(--u)*1px);transform:rotate(-24deg);color:var(--b-ac);opacity:.85">${t}</div>`;});
  e('halfring','Meio-anel', r =>
    `<div class="abs" data-anim="fade" style="--d:.5s;right:${(-4+r()*4).toFixed(0)}%;bottom:${(-6+r()*6).toFixed(0)}%;width:calc(var(--u)*${(14+r()*8).toFixed(0)}px);aspect-ratio:1;color:var(--b-p1)"><svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible"><path d="M5 50A45 45 0 0 1 95 50" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity=".7"/></svg></div>`);

  F.decorate = function(r){ // uma decoração aleatória do registry
    const ids = F.elements.ids();
    return F.elements.get(F.pick(r, ids)).html(r);
  };
})(window.FORMA);

</script>
<script>
/* ===== js/lib/bgs.js ===== */
/* =====================================================
   FORJE·studio — lib/bgs.js
   Biblioteca de FUNDOS geradores: cada entrada devolve
   camadas HTML absolutas construídas por RNG com os
   tokens da marca. Templates usam F.bgOf(r) para variar
   drasticamente a cada seed. Expandir = registrar.
   ===================================================== */
(function(F){
  F.bgs = (function(){ const map={};
    /* prancheta com cor própria: o fundo gerativo cede lugar ao sólido */
    const wrap = fn => fn && (r => { const cv = F.canvasColor && F.canvasColor();
      return cv ? `<div class="abs" style="inset:0;background:${cv}"></div>` : fn(r); });
    return {
    map, register:(id,fn)=>map[id]=fn, get:id=>wrap(map[id]),
    ids:()=>Object.keys(map), entries:()=>Object.entries(map).map(([id,fn])=>[id,wrap(fn)])}; })();
  const b = (id,fn)=>F.bgs.register(id,fn);
  const base = `<div class="abs" style="inset:0;background:var(--b-bg)"></div>`;
  const pct = (r,a,z)=>(a+r()*(z-a)).toFixed(0);

  /* mesh gradient — manchas radiais sobrepostas */
  b('mesh', r=>{
    let g='';
    const tones=['p1','p2','ac'];
    for(let i=0;i<3;i++) g+=`radial-gradient(${pct(r,40,70)}% ${pct(r,40,70)}% at ${pct(r,0,100)}% ${pct(r,0,100)}%,color-mix(in srgb,var(--b-${tones[i]}) ${pct(r,16,30)}%,transparent),transparent 70%),`;
    return base+`<div class="abs" style="inset:0;background:${g}transparent"></div>`;
  });
  /* aurora — blobs desfocados orbitando */
  b('aurora', r=>{
    let blobs='';
    ['p1','p2','ac'].forEach((tn,i)=>{
      blobs+=`<div class="abs" data-anim="orbit" style="--d:${(-i*3)}s;left:${pct(r,i*25,i*25+35)}%;top:${pct(r,10,70)}%;width:${pct(r,34,52)}%;aspect-ratio:1;border-radius:50%;background:var(--b-${tn});opacity:.5;filter:blur(calc(var(--u)*8px))"></div>`;});
    return base+blobs+`<div class="abs" style="inset:0;background:color-mix(in srgb,var(--b-bg) 34%,transparent)"></div>`;
  });
  /* varredura cônica */
  b('sweep', r=>base+`<div class="abs" style="inset:0;background:conic-gradient(from ${pct(r,0,360)}deg at ${pct(r,30,70)}% ${pct(r,30,70)}%,color-mix(in srgb,var(--b-p1) 26%,var(--b-bg)),var(--b-bg) 40%,color-mix(in srgb,var(--b-p2) 18%,var(--b-bg)) 70%,var(--b-bg));opacity:.9"></div>`);
  /* listras diagonais sutis */
  b('stripes', r=>{
    const w=(1.5+r()*3).toFixed(1);
    return base+`<div class="abs" style="inset:0;background:repeating-linear-gradient(${pct(r,20,70)}deg,color-mix(in srgb,var(--b-fg) 5%,transparent) 0 calc(var(--u)*${w}px),transparent calc(var(--u)*${w}px) calc(var(--u)*${(+w*2).toFixed(1)}px))"></div>
    <div class="abs" style="inset:0;background:radial-gradient(90% 90% at ${pct(r,20,80)}% 20%,transparent,color-mix(in srgb,var(--b-bg) 72%,transparent))"></div>`;
  });
  /* matriz de pontos */
  b('dots', r=>base+`<div class="abs" style="inset:0;background-image:radial-gradient(color-mix(in srgb,var(--b-fg) ${pct(r,10,20)}%,transparent) calc(var(--u)*0.35px),transparent calc(var(--u)*0.35px));background-size:calc(var(--u)*${pct(r,3,6)}px) calc(var(--u)*${pct(r,3,6)}px)"></div>
    <div class="abs" style="inset:0;background:radial-gradient(80% 80% at 50% 30%,transparent 40%,color-mix(in srgb,var(--b-bg) 80%,transparent))"></div>`);
  /* papel milimetrado */
  b('gridpaper', r=>{const g=pct(r,6,10);
    return base+`<div class="abs" style="inset:0;background:linear-gradient(color-mix(in srgb,var(--b-fg) 9%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--b-fg) 9%,transparent) 1px,transparent 1px);background-size:calc(var(--u)*${g}px) calc(var(--u)*${g}px)"></div>
    <div class="abs" style="inset:0;background:radial-gradient(100% 100% at 50% 0%,transparent 50%,color-mix(in srgb,var(--b-bg) 75%,transparent))"></div>`;});
  /* spotlight teatral */
  b('spotlight', r=>base+`<div class="abs" style="inset:0;background:radial-gradient(${pct(r,50,80)}% ${pct(r,50,80)}% at ${pct(r,30,70)}% ${pct(r,15,45)}%,color-mix(in srgb,var(--b-p1) 24%,var(--b-bg)),var(--b-bg) 75%)"></div>`);
  /* horizonte dividido */
  b('horizon', r=>{const h=pct(r,55,75);
    return base+`<div class="abs" style="left:0;right:0;top:${h}%;bottom:0;background:color-mix(in srgb,var(--b-p1) ${pct(r,14,26)}%,var(--b-bg))"></div>
    <div class="abs" style="left:0;right:0;top:calc(${h}% - 1px);height:2px;background:var(--b-ac);opacity:.8"></div>`;});

  /* raios cônicos alternados */
  b('rays', r=>{
    const seg=(6+r()*8).toFixed(1);
    return base+`<div class="abs" style="inset:-30%;background:repeating-conic-gradient(from ${pct(r,0,360)}deg at ${pct(r,30,70)}% ${pct(r,20,60)}%,color-mix(in srgb,var(--b-p1) 14%,var(--b-bg)) 0 ${seg}deg,var(--b-bg) ${seg}deg ${(+seg*2).toFixed(1)}deg);opacity:.9"></div>
    <div class="abs" style="inset:0;background:radial-gradient(80% 80% at 50% 45%,transparent 30%,color-mix(in srgb,var(--b-bg) 78%,transparent))"></div>`;
  });
  /* ondas empilhadas no rodapé */
  b('waves', r=>{
    let w='';
    ['p1','p2','ac'].forEach((tn,i)=>{
      const y=58+i*13, a=10-i*2;
      w+=`<path d="M0 ${y} Q ${pct(r,15,35)} ${y-a}, 50 ${y} T 100 ${y} V100 H0 Z" fill="color-mix(in srgb,var(--b-${tn}) ${pct(r,14,26)}%,var(--b-bg))"/>`;});
    return base+`<svg class="abs" style="inset:0;width:100%;height:100%" viewBox="0 0 100 100" preserveAspectRatio="none">${w}</svg>`;
  });
  /* arcos concêntricos */
  b('arcs', r=>{
    const cx=pct(r,20,80), cy=pct(r,-10,20);
    let rings='';
    for(let i=1;i<=5;i++) rings+=`<div class="abs" style="left:${cx}%;top:${cy}%;transform:translate(-50%,-50%);width:${i*26}%;aspect-ratio:1;border-radius:50%;border:1px solid color-mix(in srgb,var(--b-fg) ${16-i*2}%,transparent)"></div>`;
    return base+rings+`<div class="abs" style="left:${cx}%;top:${cy}%;transform:translate(-50%,-50%);width:20%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--b-p1) 30%,transparent),transparent 70%)"></div>`;
  });
  /* xadrez sutil desbotado */
  b('checker', r=>{
    const g=pct(r,6,11);
    return base+`<div class="abs" style="inset:0;opacity:.5;background:repeating-conic-gradient(color-mix(in srgb,var(--b-fg) 6%,transparent) 0 90deg,transparent 90deg 180deg);background-size:calc(var(--u)*${g}px) calc(var(--u)*${g}px)"></div>
    <div class="abs" style="inset:0;background:radial-gradient(90% 90% at 50% 40%,transparent 30%,color-mix(in srgb,var(--b-bg) 82%,transparent))"></div>`;
  });
  /* bokeh — luzes desfocadas */
  b('bokeh', r=>{
    let d='';
    for(let i=0;i<7;i++){ const tn=F.pick(r,['p1','p2','ac']);
      d+=`<div class="abs" style="left:${pct(r,0,92)}%;top:${pct(r,0,88)}%;width:${pct(r,5,16)}%;aspect-ratio:1;border-radius:50%;background:var(--b-${tn});opacity:.${pct(r,1,3)};filter:blur(calc(var(--u)*${(1+r()*3).toFixed(1)}px))"></div>`;}
    return base+d+`<div class="abs" style="inset:0;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--b-bg) 55%,transparent))"></div>`;
  });
  /* brilho de canto */
  b('corner', r=>{
    const cn=F.pick(r,['0% 0%','100% 0%','0% 100%','100% 100%']);
    return base+`<div class="abs" style="inset:0;background:radial-gradient(${pct(r,60,95)}% ${pct(r,60,95)}% at ${cn},color-mix(in srgb,var(--b-ac) ${pct(r,18,30)}%,var(--b-bg)),var(--b-bg) 70%)"></div>
    <div class="abs" style="inset:0;background:radial-gradient(50% 50% at ${cn},color-mix(in srgb,var(--b-p2) 14%,transparent),transparent 60%)"></div>`;
  });

  /* sorteia um fundo da biblioteca */
  F.bgOf = function(r){
    const id = F.pick(r, F.bgs.ids());
    return F.bgs.get(id)(r);
  };
})(window.FORMA);

<script>
/* ===== js/lib/shapes.js ===== */
/* =====================================================
   FORJE·studio — lib/shapes.js
   Biblioteca de FORMAS GEOMÉTRICAS (registry expansível).
   Cada forma: {n, cat, prev, html(props)}
   - prev: HTML da pré-visualização 22px (usa currentColor)
   - html: render final no palco (props do formulário COMPOR:
     kind, sw, sh, fill, nofill, op, rot, rad, bw, bc)
   Os ids legados (rect, pill, circle, ring, tri, star, line)
   continuam com saída visual idêntica — nada regride.
   Expandir = F.shapes.register(id, {...}).
   ===================================================== */
(function(F){
  F.shapes = (function(){ const map={}; return {
    map, register:(id,def)=>map[id]=def, get:id=>map[id],
    ids:()=>Object.keys(map), entries:()=>Object.entries(map)}; })();

  /* ---------- contexto derivado das props ---------- */
  function ctx(p){
    const sw = +p.sw||16, sh = +p.sh||16;
    const col = p.fill||'#F5620F';
    const fill = p.nofill ? 'transparent' : col;
    const op = (p.op!=null ? +p.op : 100)/100, rot = +p.rot||0;
    const rad = +p.rad||0, bw = +p.bw||0, bc = p.bc||col;
    return { sw, sh, col, fill, op, rot, rad, bw, bc, nofill:!!p.nofill,
      W:`width:calc(var(--u)*${sw}px);`, H:`height:calc(var(--u)*${sh}px);`,
      base:`opacity:${op};rotate:${rot}deg;`,
      bord: bw ? `border:calc(var(--u)*${bw}px) solid ${bc};` : '',
      box:'box-sizing:border-box;' };
  }
  /* div simples com estilo extra */
  const dv = (c, extra) => `<div style="${c.W}${c.H}${c.base}${extra}"></div>`;
  /* forma via clip-path (contorno não se aplica — recorte) */
  const clip = (c, poly) => dv(c, `clip-path:polygon(${poly});background:${c.fill||c.col}`);
  /* forma via SVG preenchido (estica no box; contorno = bw) */
  function svgFill(c, body){
    const swv = (c.bw || (c.nofill ? 1.4 : 0)) * 100/Math.max(1,c.sw);
    const at = `fill="${c.nofill?'none':c.col}"${(c.bw||c.nofill)?` stroke="${c.nofill&&!c.bw?c.col:c.bc}" stroke-width="${swv.toFixed(1)}" stroke-linejoin="round"`:''}`;
    return `<div style="${c.W}${c.H}${c.base}"><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block;overflow:visible">${body(at)}</svg></div>`;
  }
  /* forma de TRAÇO (linha viva): usa a cor principal como stroke */
  function svgStroke(c, d, cap='round'){
    const swv = Math.max(1.5, (c.bw||2) * 100/Math.max(1,c.sw));
    return `<div style="${c.W}${c.H}${c.base}"><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block;overflow:visible"><path d="${d}" fill="none" stroke="${c.col}" stroke-width="${swv.toFixed(1)}" stroke-linecap="${cap}" stroke-linejoin="round"/></svg></div>`;
  }
  /* polígono estrelado paramétrico (pontas n, raio interno ir%) */

  s('rect','Retângulo','Básicas', pv('width:22px;height:16px;border-radius:3px;background:currentColor'),

  s('blob','Blob orgânico','Básicas', pv('width:19px;height:18px;border-radius:62% 38% 55% 45%/48% 60% 40% 52%;background:currentColor'),
    p=>{const c=ctx(p); return dv(c,`${c.bord}${c.box}border-radius:62% 38% 55% 45%/48% 60% 40% 52%;background:${c.fill}`);});
  s('leaf','Folha / pétala','Básicas', pv('width:17px;height:17px;border-radius:0 50% 0 50%;background:currentColor'),
    p=>{const c=ctx(p); return dv(c,`${c.bord}${c.box}border-radius:0 50% 0 50%;background:${c.fill}`);});
  s('frame','Moldura','Básicas', pv('width:20px;height:15px;border:2.5px solid currentColor;border-radius:3px'),
    p=>{const c=ctx(p); return dv(c,`${c.box}border:calc(var(--u)*${c.bw||0.8}px) solid ${c.col};border-radius:calc(var(--u)*${c.rad}px);background:transparent`);});
  s('tab','Aba','Básicas', pv('width:22px;height:13px;border-radius:6px 6px 0 0;background:currentColor'),
    p=>{const c=ctx(p); return dv(c,`${c.bord}${c.box}border-radius:calc(var(--u)*${c.rad||1.6}px) calc(var(--u)*${c.rad||1.6}px) 0 0;background:${c.fill}`);});

  /* ══════════ POLÍGONOS ══════════ */
  s('tri','Triângulo','Polígonos', pvClip(P.tri), p=>clip(ctx(p), P.tri));
  s('tri-down','Triângulo ▽','Polígonos', pvClip(P.triDown), p=>clip(ctx(p), P.triDown));
  s('tri-right','Triângulo ▷','Polígonos', pvClip(P.triRight), p=>clip(ctx(p), P.triRight));

  s('parallel','Paralelogramo','Polígonos', pvClip(P.par), p=>clip(ctx(p), P.par));
  s('trapezoid','Trapézio','Polígonos', pvClip(P.trap), p=>clip(ctx(p), P.trap));

  s('star','Estrela','Estrelas & selos', pvClip(P.star5), p=>clip(ctx(p), P.star5));

  s('flower','Flor','Estrelas & selos', pvSvg('<circle cx="50" cy="22" r="19" fill="currentColor"/><circle cx="74" cy="36" r="19" fill="currentColor"/><circle cx="74" cy="64" r="19" fill="currentColor"/><circle cx="50" cy="78" r="19" fill="currentColor"/><circle cx="26" cy="64" r="19" fill="currentColor"/><circle cx="26" cy="36" r="19" fill="currentColor"/>'),

  s('ticket','Cupom recortado','Setas & símbolos', pvClip(P.ticket), p=>clip(ctx(p), P.ticket));

  /* ══════════ LINHAS & TRAÇOS ══════════ */
  s('line','Linha','Linhas & traços', pv('width:24px;height:3px;border-radius:99px;background:currentColor'),
    p=>{const c=ctx(p); return `<div style="${c.W}height:calc(var(--u)*${Math.max(.2,c.bw||.7)}px);${c.base}border-radius:999px;background:${c.col}"></div>`;});
  s('line-v','Linha vertical','Linhas & traços', pv('width:3px;height:22px;border-radius:99px;background:currentColor'),

  s('dashes','Linha tracejada','Linhas & traços', pvSvg('M4 50H96', true).replace('stroke-width="9"','stroke-width="9" stroke-dasharray="14 12"'),
    p=>{const c=ctx(p); const swv=Math.max(1.5,(c.bw||2)*100/Math.max(1,c.sw));
      return `<div style="${c.W}${c.H}${c.base}"><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block;overflow:visible"><path d="M2 50H98" fill="none" stroke="${c.col}" stroke-width="${swv.toFixed(1)}" stroke-linecap="round" stroke-dasharray="10 8"/></svg></div>`;});
  s('wave','Onda','Linhas & traços', pvSvg('M2 60Q14 20 26 60T50 60T74 60T98 60', true),
    p=>svgStroke(ctx(p), 'M2 60Q14 20 26 60T50 60T74 60T98 60'));
  s('zigzag','Zigue-zague','Linhas & traços', pvSvg('M2 70L18 30L34 70L50 30L66 70L82 30L98 70', true),
    p=>svgStroke(ctx(p), 'M2 70L18 30L34 70L50 30L66 70L82 30L98 70'));
  s('arc','Arco','Linhas & traços', pvSvg('M8 82A42 42 0 0 1 92 82', true),
    p=>svgStroke(ctx(p), 'M8 82A42 42 0 0 1 92 82'));
  s('spiral','Espiral','Linhas & traços', pvSvg('M50 50m0 -6a6 6 0 0 1 6 6a12 12 0 0 1 -12 12a20 20 0 0 1 -20 -20a30 30 0 0 1 30 -30a40 40 0 0 1 40 40', true),
    p=>svgStroke(ctx(p), 'M50 50m0 -6a6 6 0 0 1 6 6a12 12 0 0 1 -12 12a20 20 0 0 1 -20 -20a30 30 0 0 1 30 -30a40 40 0 0 1 40 40'));

  /* nome amigável (usado nas listas do painel COMPOR) */
  F.shapeName = kind => (F.shapes.get(kind)||{}).n || 'Retângulo';
})(window.FORMA);

<script>
/* ===== js/lib/codes.js ===== */
/* =====================================================
   FORJE·studio — lib/codes.js
   Códigos REAIS e escaneáveis para a composição:
   · F.qrSVG(texto)      → QR Code (vendor qrcode-generator,
     correção M, zona de silêncio de 4 módulos, UTF-8)
   · F.barcodeSVG(texto) → Code 128 (subconjuntos B/C com
     seleção automática e dígito verificador — norma
     ISO/IEC 15417)
   Ambos são determinísticos: o mesmo conteúdo gera sempre
   o mesmo código, em qualquer preview e em todos os exports.
   ===================================================== */
(function(F){
  'use strict';

  /* ---------- QR Code ---------- */
  F.qrSVG = function(text){
    try{
      if(typeof qrcode !== 'function') throw new Error('lib QR indisponível');
      const qr = qrcode(0, 'M');            // tipo 0 = menor versão que couber
      qr.addData(String(text||''), 'Byte'); // Byte + override UTF-8 do vendor
      qr.make();
      const n = qr.getModuleCount(), Q = 4; // zona de silêncio: 4 módulos (norma)
      const size = n + Q*2;
      let d = '';
      for(let y=0;y<n;y++) for(let x=0;x<n;x++)
        if(qr.isDark(y,x)) d += `M${x+Q} ${y+Q}h1v1h-1z`;
      /* shape-rendering:crispEdges — módulos sem antialiasing = leitura confiável */
      return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" style="width:100%;display:block" role="img" aria-label="QR code">`
        + `<rect width="${size}" height="${size}" fill="#fff"/>`
        + `<path d="${d}" fill="#111"/></svg>`;
    }catch(e){
      return `<svg viewBox="0 0 29 29" style="width:100%;display:block"><rect width="29" height="29" fill="#fff"/><text x="14.5" y="16" text-anchor="middle" font-size="3" fill="#111">conteúdo longo demais</text></svg>`;
    }
  };

  /* ---------- Code 128 ----------
     Tabela oficial de padrões (larguras barra/espaço, 11 módulos por
     símbolo; stop = 13). Índices 0–102 são os valores dos caracteres,
     103–105 os starts A/B/C, 106 o stop. */
  const C128 = ('212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 '
    + '221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 '
    + '221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 '
    + '212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 '
    + '231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 '
    + '231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 '
    + '314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 '
    + '112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 '
    + '111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 '
    + '214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 '
    + '114131 311141 411131 211412 211214 211232 2331112').split(' ');

  /* codifica em valores Code 128 com seleção automática B/C:
     trechos 100% numéricos com 4+ dígitos entram em C (2 dígitos por
     símbolo = barras mais curtas); o resto em B (ASCII 32–126). */
  function c128values(text){
    const s = [...String(text)].map(ch=>{
      const c = ch.codePointAt(0);
      return (c>=32 && c<=126) ? ch : ' ';       // fora do conjunto B → espaço
    }).join('');
    if(!s) return null;
    const vals = [];
    let mode = null, i = 0;
    const digitRun = j=>{ let k=j; while(k<s.length && s[k]>='0' && s[k]<='9') k++; return k-j; };
    while(i < s.length){
      const run = digitRun(i);
      const useC = run>=4 || (run>=2 && i===0 && run===s.length);
      if(useC){
        const take = run - (run%2);              // C usa pares de dígitos
        if(mode===null){ vals.push(105); mode='C'; }
        else if(mode!=='C'){ vals.push(99); mode='C'; }
        for(let k=0;k<take;k+=2) vals.push(+s.substr(i+k,2));
        i += take;
      } else {
        if(mode===null){ vals.push(104); mode='B'; }
        else if(mode!=='B'){ vals.push(100); mode='B'; }
        vals.push(s.charCodeAt(i)-32);
        i++;
      }
    }
    let sum = vals[0];
    for(let k=1;k<vals.length;k++) sum += vals[k]*k;
    vals.push(sum % 103);                        // dígito verificador
    vals.push(106);                              // stop
    return vals;
  }

  F.barcodeSVG = function(text){
    const vals = c128values(text);
    if(!vals) return '';
    const Q = 10;                                // zona de silêncio ≥10 módulos
    let x = Q, rects = '';
    vals.forEach(v=>{
      const pat = C128[v];
      for(let k=0;k<pat.length;k++){
        const w = +pat[k];
        if(k%2===0) rects += `<rect x="${x}" y="0" width="${w}" height="30" fill="currentColor"/>`;
        x += w;
      }
    });
    const W = x + Q;
    return `<svg viewBox="0 0 ${W} 30" preserveAspectRatio="none" shape-rendering="crispEdges" style="width:100%;display:block" role="img" aria-label="código de barras">${rects}</svg>`;
  };
})(window.FORMA);

</script>
<script>
/* ===== js/lib/components.js ===== */
/* =====================================================
   FORJE·studio — lib/components.js
   Design system de COMPONENTES: peças de UI prontas
   (buttons, cards, charts, badges…) desenhadas com os
   tokens da marca, para compor sobre qualquer template
   ou cena (aba COMPOR → arrastar no palco).
   Contrato: F.components.register(id, {n, cat, html(rng, ctx)})
   ctx = {title, sub, cta, img, icon} do slide/cena atual.
   ===================================================== */
(function(F){
  F.components = (function(){ const map={}; return {
    map, register:(id,def)=>map[id]=def, get:id=>map[id],
    ids:()=>Object.keys(map), entries:()=>Object.entries(map)}; })();
  const c = (id,n,cat,html)=>F.components.register(id,{n,cat,html});
  const u = x=>`calc(var(--u)*${x}px)`;
  const esc = s=>F.esc(s);

  /* ---------- ações ---------- */
  c('btn','Botão','Ações',(r,x)=>`<span class="cta" style="font-size:${u(2.8)}">${esc(x.cta||'Começar')} ${F.icon('arrow-right')}</span>`);
  c('btn-ghost','Botão ghost','Ações',(r,x)=>`<span style="display:inline-flex;align-items:center;gap:.5em;border:${u(0.22)} solid var(--b-fg);color:var(--b-fg);font-weight:700;font-size:${u(2.6)};padding:.7em 1.4em;border-radius:calc(var(--b-r)*1px)">${esc(x.cta||'Saber mais')}</span>`);
  c('badge','Badge','Ações',(r,x)=>`<span style="background:var(--b-ac);color:var(--b-bg);font-weight:800;font-size:${u(2.2)};padding:.5em .9em;border-radius:99px;display:inline-flex;align-items:center;gap:.4em">${F.icon(x.icon||'spark')} ${esc((x.kicker||'NOVO').toUpperCase())}</span>`);
  c('status','Status','Ações',()=>`<span style="display:inline-flex;align-items:center;gap:.5em;background:color-mix(in srgb,var(--b-p2) 18%,transparent);border:1px solid color-mix(in srgb,var(--b-p2) 50%,transparent);color:var(--b-fg);font-size:${u(2.2)};padding:.5em 1em;border-radius:99px"><i style="width:.6em;height:.6em;border-radius:50%;background:var(--b-p2)"></i> Online agora</span>`);
  c('kbd','Tecla','Ações',(r,x)=>`<span class="fm" style="display:inline-flex;gap:.4em">${(x.title||'Ctrl K').split(' ').map(k=>
    `<i style="font-style:normal;background:color-mix(in srgb,var(--b-fg) 12%,transparent);border:1px solid color-mix(in srgb,var(--b-fg) 30%,transparent);border-bottom-width:${u(0.4)};border-radius:.4em;padding:.35em .7em;font-size:${u(2.2)}">${esc(k)}</i>`).join('')}</span>`);

  /* ---------- cards ---------- */
  c('card-glass','Card liquid glass','Cards',(r,x)=>`<div class="glass2" style="width:${u(34)};padding:${u(3)};display:flex;flex-direction:column;gap:${u(1.2)}">
    <span style="color:var(--b-ac);font-size:${u(3.4)};display:flex">${F.icon(x.icon||'spark')}</span>
    <b class="fh" style="font-size:${u(2.8)}">${esc((x.title||'Título').split('\n')[0])}</b>
    <span style="font-size:${u(2)};opacity:.8;line-height:1.5">${esc(x.sub||'Descrição do card.')}</span></div>`);
  c('card-stat','Card de métrica','Cards',(r,x)=>`<div class="glass2" style="width:${u(24)};padding:${u(2.6)};display:flex;flex-direction:column;gap:${u(0.8)}">
    <span class="fm" style="font-size:${u(1.8)};letter-spacing:.12em;opacity:.7">${esc((x.kicker||'RECEITA').toUpperCase())}</span>
    <b class="fh" style="font-size:${u(4.6)};color:var(--b-ac)">${esc(x.title||('R$ '+(40+Math.floor(r()*60))+'k'))}</b>
    <span style="font-size:${u(1.9)};color:var(--b-p2);display:inline-flex;align-items:center;gap:.3em">${F.icon('trend')} ${esc(x.sub||('+'+(8+Math.floor(r()*20))+'% no mês'))}</span></div>`);
  c('card-quote','Depoimento','Cards',(r,x)=>`<div class="glass2" style="width:${u(38)};padding:${u(3)};display:flex;flex-direction:column;gap:${u(1.4)}">

    <span style="display:flex;align-items:center;gap:${u(1.2)}">
      <i style="width:${u(4)};height:${u(4)};border-radius:50%;background:linear-gradient(135deg,var(--b-p1),var(--b-p2));display:grid;place-items:center;font-style:normal;font-weight:800;font-size:${u(1.8)};color:var(--b-fg)">AB</i>
      <span style="display:flex;flex-direction:column"><b style="font-size:${u(2)}">Ana B.</b><span style="font-size:${u(1.7)};opacity:.65">Diretora de marca</span></span></span></div>`);
  c('price','Etiqueta de preço','Cards',(r,x)=>`<div style="background:var(--b-ac);color:var(--b-bg);border-radius:calc(var(--b-r)*1px);padding:${u(1.6)} ${u(2.4)};display:flex;flex-direction:column;align-items:center;transform:rotate(${(r()*8-4).toFixed(1)}deg)">
    <s style="font-size:${u(1.9)};opacity:.65">${esc(x.kicker||('R$ '+(150+Math.floor(r()*100))))}</s>
    <b class="fh" style="font-size:${u(4.2)};line-height:1">${esc(x.title||('R$ '+(59+Math.floor(r()*40))))}</b>
    <span class="fm" style="font-size:${u(1.5)};letter-spacing:.1em">${esc(x.sub||'/mês')}</span></div>`);

  /* ---------- dados ---------- */
  c('chart-bars','Gráfico de barras','Dados',(r,x)=>{
    /* dados reais: linhas "Rótulo | valor" (ou só o valor) no campo Dados;
