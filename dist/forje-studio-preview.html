    const rows = F.dataRows(x.data).filter(o=>o.value!=null || /^[\d.,\-]+$/.test(o.label));
    let vals, labs;
    if(rows.length){
      vals = rows.map(o=>o.value!=null?o.value:parseFloat(o.label.replace(',','.'))||0).slice(0,8);
      labs = rows.map(o=>o.value!=null?o.label:'').slice(0,8);
    } else { vals=[]; labs=[]; for(let i=0;i<7;i++){ vals.push(20+r()*70); labs.push(''); } }
    const max = Math.max(...vals.map(v=>Math.abs(v)), 1e-9);
    const hi = rows.length ? vals.indexOf(Math.max(...vals)) : 5;
    const n = vals.length, bw = Math.min(9, 100/n*0.62), gap = 100/n;
    const hasLabs = labs.some(Boolean);
    let bars='';
    vals.forEach((v,i)=>{ const h=Math.max(2, Math.abs(v)/max*70+2);
      bars+=`<rect x="${(i*gap+(gap-bw)/2).toFixed(1)}" y="${(92-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${i===hi?'var(--b-ac)':'color-mix(in srgb,var(--b-p1) 70%,var(--b-fg))'}" opacity="${i===hi?1:.55}"/>`; });
    const legend = hasLabs
      ? `<div style="display:grid;grid-template-columns:repeat(${n},1fr);gap:${u(0.4)};margin-top:${u(0.7)}">${
          labs.map((l2,i)=>`<span class="fm" style="font-size:${u(1.25)};text-align:center;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${i===hi?'color:var(--b-ac);font-weight:700':'opacity:.62'}">${esc(l2)}</span>`).join('')}</div>` : '';
    return `<div class="glass2" style="width:${u(28)};padding:${u(2.2)}"><svg viewBox="0 0 100 96" style="width:100%;display:block">${bars}<line x1="0" y1="93" x2="100" y2="93" stroke="color-mix(in srgb,var(--b-fg) 30%,transparent)"/></svg>${legend}</div>`;});
  c('chart-line','Gráfico de linha','Dados',(r,x)=>{
    /* dados reais: números no campo Dados (vírgula/espaço/linha); vazio → seed */
    let vals = F.numList(x.data);
    if(vals.length<2){ vals=[]; for(let i=0;i<=8;i++) vals.push(75-r()*55); }
    else{ const mn=Math.min(...vals), mx=Math.max(...vals), sp=(mx-mn)||1;
      vals = vals.slice(0,24).map(v=>72-((v-mn)/sp)*58); }
    const n=vals.length, pts=vals.map((y,i)=>`${(i*100/(n-1)).toFixed(1)},${y.toFixed(1)}`);
    const d='M'+pts.join(' L');
    return `<div class="glass2" style="width:${u(28)};padding:${u(2.2)}"><svg viewBox="0 0 100 80" style="width:100%;display:block">
      <path d="${d} L100,80 L0,80 Z" fill="color-mix(in srgb,var(--b-ac) 18%,transparent)"/>
      <path d="${d}" fill="none" stroke="var(--b-ac)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-anim="draw" style="--dash:220"/></svg></div>`;});
  c('chart-donut','Donut','Dados',(r,x)=>{
    const p=String(Math.min(100,parseInt(x.value)||+(30+r()*55).toFixed(0))), C=2*Math.PI*30;
    return `<div style="width:${u(16)};position:relative"><svg viewBox="0 0 80 80" style="width:100%">
      <circle cx="40" cy="40" r="30" fill="none" stroke="color-mix(in srgb,var(--b-fg) 14%,transparent)" stroke-width="11"/>
      <circle cx="40" cy="40" r="30" fill="none" stroke="var(--b-ac)" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="${(C*p/100).toFixed(0)} ${C.toFixed(0)}" transform="rotate(-90 40 40)"/></svg>
      <b class="fh" style="position:absolute;inset:0;display:grid;place-items:center;font-size:${u(3)}">${p}%</b></div>`;});
  c('progress','Barra de progresso','Dados',(r,x)=>{const p=String(parseInt(x.value)||(35+r()*55).toFixed(0));
    return `<div style="width:${u(26)};display:flex;flex-direction:column;gap:${u(0.8)}">
    <span style="display:flex;justify-content:space-between;font-size:${u(1.9)}"><b>${esc(x.kicker||'Meta')}</b><span class="fm" style="opacity:.7">${p}%</span></span>
    <div style="height:${u(1.4)};background:color-mix(in srgb,var(--b-fg) 14%,transparent);border-radius:99px;overflow:hidden">
      <div data-anim="line" style="width:${p}%;height:100%;background:linear-gradient(90deg,var(--b-p1),var(--b-ac));border-radius:99px"></div></div></div>`;});
  c('table','Tabela','Dados',(r,x)=>{
    /* dados reais: Cabeçalho "PLANO | PREÇO | NÍVEL";
       Linhas: um registro por linha "Starter | R$ 29 | ✓".
       Vazio → tabela de exemplo original (sem regressão). */
    const split = s=>String(s).split('|').map(z=>esc(z.trim()));
    const head = (x.thead||'').trim() ? split(x.thead.split('\n')[0]) : ['PLANO','PREÇO','NÍVEL'];
    const bodyLines = String(x.trows||'').split('\n').map(l=>l.trim()).filter(Boolean);
    const rows = bodyLines.length ? bodyLines.slice(0,7).map(split)
      : [['Starter','R$ 29','✓'],['Pro','R$ 79','✓✓'],['Studio','R$ 149','✓✓✓']];
    const cols = Math.max(head.length, ...rows.map(rw=>rw.length));
    const grid = '2fr'+' 1fr'.repeat(Math.max(0,cols-1));
    const hiRow = rows.length===3 && !bodyLines.length ? 1 : -1;   // destaque só na tabela de exemplo
    const cell = (v,i)=>`<span style="padding:${u(0.5)} 0;border-top:1px solid color-mix(in srgb,var(--b-fg) 14%,transparent);${i===hiRow?'color:var(--b-ac);font-weight:700':''}">${v??''}</span>`;
    return `<div class="glass2" style="width:${u(32)};padding:${u(1.4)};font-size:${u(2)}">
    <div style="display:grid;grid-template-columns:${grid};gap:${u(0.6)} ${u(1)};padding:${u(1)}">
      ${Array.from({length:cols},(_,ci)=>`<b class="fm" style="font-size:${u(1.6)};letter-spacing:.1em;opacity:.6">${head[ci]??''}</b>`).join('')}
      ${rows.map((rw,i)=>Array.from({length:cols},(_,ci)=>cell(rw[ci],i)).join('')).join('')}
    </div></div>`;});

  /* ---------- pessoas & feedback ---------- */
  c('avatar-group','Avatares','Pessoas',(r,x)=>{
    const tones=['p1','p2','ac'];
    return `<span style="display:inline-flex;align-items:center">${[0,1,2].map(i=>
      `<i style="width:${u(4.2)};height:${u(4.2)};border-radius:50%;margin-left:${i?u(-1.4):0};border:${u(0.3)} solid var(--b-bg);background:linear-gradient(135deg,var(--b-${tones[i]}),var(--b-${tones[(i+1)%3]}));display:grid;place-items:center;font-style:normal;font-weight:800;font-size:${u(1.7)}">${'ABC'[i]}${'NRS'[i]}</i>`).join('')}
      <span style="margin-left:${u(1)};font-size:${u(2)};opacity:.8">${esc(x.title||('+'+(90+Math.floor(r()*900))+' pessoas'))}</span></span>`;});
  c('rating','Avaliação','Pessoas',(r,x)=>`<span style="display:inline-flex;align-items:center;gap:${u(0.5)};color:var(--b-ac);font-size:${u(2.8)}">${F.icon('star')}${F.icon('star')}${F.icon('star')}${F.icon('star')}${F.icon('star')}<b style="color:var(--b-fg);font-size:${u(2.2)};margin-left:.3em">${esc(x.title||'4.9')}</b></span>`);
  c('notify','Notificação','Pessoas',(r,x)=>`<div class="glass2" style="width:${u(32)};padding:${u(1.8)};display:flex;gap:${u(1.4)};align-items:center">
    <span style="width:${u(4.4)};height:${u(4.4)};border-radius:${u(1.2)};background:var(--b-ac);color:var(--b-bg);display:grid;place-items:center;font-size:${u(2.4)}">${F.icon(x.icon||'bolt')}</span>

    <span style="font-size:${u(1.8)};opacity:.7">${esc(x.sub||'agora mesmo · toque para ver')}</span></span></div>`);

  /* ---------- mockups ---------- */
  c('browser','Janela de navegador','Mockups',(r,x)=>{
    /* imagem: própria (props.img, via formulário do COMPOR) > do slide/cena;
       ajustes: imgfit (cover/contain), imgx/imgy (posição %), imgzoom (×) */
    const fit = x.imgfit==='contain' ? 'contain' : 'cover';
    const px = x.imgx!=null && x.imgx!=='' ? +x.imgx : 50;
    const py = x.imgy!=null && x.imgy!=='' ? +x.imgy : 50;
    const zm = Math.min(3, Math.max(1, +x.imgzoom || 1));
    const media = x.img
      ? `<img src="${x.img}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:${fit};object-position:${px}% ${py}%;transform:scale(${zm});transform-origin:${px}% ${py}%">`
      : `<div style="position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--b-p1) 24%,var(--b-bg)),var(--b-bg))"><b class="fh" style="font-size:${u(3)}">${esc((x.title||'Preview').split('\n')[0].slice(0,18))}</b></div>`;
    return `<div style="width:${u(40)};border-radius:calc(var(--b-r)*1px);overflow:hidden;border:1px solid color-mix(in srgb,var(--b-fg) 22%,transparent);box-shadow:0 ${u(2)} ${u(6)} rgba(0,0,0,.35)">
    <div style="background:color-mix(in srgb,var(--b-fg) 10%,var(--b-bg));padding:${u(1)} ${u(1.4)};display:flex;gap:${u(0.6)};align-items:center">
      <i style="width:${u(1)};height:${u(1)};border-radius:50%;background:#ff5f57"></i><i style="width:${u(1)};height:${u(1)};border-radius:50%;background:#febc2e"></i><i style="width:${u(1)};height:${u(1)};border-radius:50%;background:#28c840"></i>
      <span class="fm" style="margin-left:${u(1)};font-size:${u(1.5)};opacity:.6">${esc(x.url||'suamarca.com')}</span></div>
    <div style="height:${u(22)};position:relative;overflow:hidden;background:var(--b-bg)">${media}</div></div>`;});
  c('code','Janela de código','Mockups',(r,x)=>{
    const lines = x.sub ? esc(x.sub).split('\n').map((ln,i)=>
        `<span style="color:${['var(--b-p2)','var(--b-fg)','var(--b-ac)'][i%3]}">${ln}</span>`).join('<br>')
      : `<span style="color:var(--b-p2)">const</span> <span style="color:var(--b-fg)">marca</span> = <span style="color:var(--b-ac)">'sua'</span>;<br>
    <span style="color:var(--b-p2)">design</span>.<span style="color:var(--b-p1)">compose</span>(<span style="color:var(--b-fg)">marca</span>)<br>
    <span style="opacity:.5">// determinístico ✓</span>`;
    return `<div class="fm" style="width:${u(34)};background:#0d0f14;border:1px solid color-mix(in srgb,var(--b-fg) 20%,transparent);border-radius:calc(var(--b-r)*1px);padding:${u(2)};font-size:${u(1.8)};line-height:1.7;box-shadow:0 ${u(2)} ${u(6)} rgba(0,0,0,.35)">${lines}</div>`;});
  c('checklist','Checklist','Mockups',(r,x)=>{
    const items=(x.sub||'Rápido\nConsistente\nSeu').split(/[\n.]/).filter(Boolean).slice(0,3);
    return `<div style="display:flex;flex-direction:column;gap:${u(1.2)}">${items.map((it,i)=>
      `<span data-anim="slide-r" style="--d:${(i*.15).toFixed(2)}s;display:inline-flex;align-items:center;gap:${u(1)};font-size:${u(2.4)};font-weight:600"><i style="width:${u(3)};height:${u(3)};border-radius:${u(0.8)};background:var(--b-ac);color:var(--b-bg);display:grid;place-items:center;font-style:normal;font-size:${u(1.8)}">${F.icon('check')}</i>${esc(it.trim().slice(0,64))}</span>`).join('')}</div>`;});

  /* campos editáveis por componente (formulário na aba COMPOR) */
  const FIELDS = {
    btn:['cta'], 'btn-ghost':['cta'], badge:['kicker','icon'], status:['kicker'], kbd:['title'],
    'card-glass':['title','sub','icon'], 'card-quote':['sub'], 'card-stat':['kicker','title','sub'],
    price:['kicker','title','sub'], notify:['kicker','sub','icon'], checklist:['sub'],
    browser:['url','title'], code:['sub'], progress:['kicker','value'], 'chart-donut':['value'],
    rating:['title'], 'avatar-group':['title'],
    'chart-bars':['data'], 'chart-line':['data'], table:['thead','trows'],
  };
  Object.entries(FIELDS).forEach(([id,f])=>{ const d=F.components.get(id); if(d) d.fields=f; });
  /* componentes que acoplam imagem: o formulário do COMPOR ganha upload
     próprio + controles de encaixe/posição/zoom (extensível a plugins) */
  ['browser'].forEach(id=>{ const d=F.components.get(id); if(d) d.imgSlot=true; });
})(window.FORMA);

</script>

/* =====================================================
   FORJE·studio — lib/components-extra.js
   EXPANSÃO do design system de componentes: +45 peças
   novas em 8 categorias, todas desenhadas com os tokens
   da marca e prontas para compor sobre qualquer template
   ou cena (aba COMPOR). Mesmo contrato de components.js:
   F.components.register(id, {n, cat, html(rng, ctx), fields})

(function(F){

  const u = x=>`calc(var(--u)*${x}px)`;
  const esc = s=>F.esc(s);
  const nl = s=>F.nl(s);
  const lines = (s,fb)=> String(s||fb).split('\n').map(x=>x.trim()).filter(Boolean);

    if(vals.length>=2){
      const mn=Math.min(...vals), mx=Math.max(...vals), sp=(mx-mn)||1, vv=vals.slice(0,24), n=vv.length;

  c('chart-pie','Gráfico de pizza','Dados',(r,x)=>{

    const segs = [['ac', F.splitVal(x.kicker,'Orgânico')],
                  ['p1', F.splitVal(x.title,'Pago')],
                  ['p2', F.splitVal(x.sub,'Indicação')]];
    let a, b, cx3;
    if(segs.some(([,o])=>o.value!=null)){
      const raw = segs.map(([,o])=>Math.max(0, o.value!=null?o.value:0));
      const tot = raw.reduce((s2,v)=>s2+v,0)||1;
      a = Math.round(raw[0]/tot*100); b = Math.round(raw[1]/tot*100); cx3 = 100-a-b;
    } else {
      a = Math.round(20+r()*45); b = Math.round(15+r()*(85-a)); cx3 = 100-a-b;

    const vals=[a,b,cx3], pie=['ac','p1'].map((t,i)=>`var(--b-${t}) ${i?a+'% '+(a+b)+'%':'0 '+a+'%'}`).join(',');

    return `<div data-anim="spin" style="width:${u(15)};aspect-ratio:1;position:relative;color:var(--b-ac)">
    <svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible">
      <defs><path id="stc${Math.floor(r()*1e6)}" d="M50 50m-38 0a38 38 0 1 1 76 0a38 38 0 1 1 -76 0"/></defs>
      <circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <circle cx="50" cy="50" r="29" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text style="font-size:11px;letter-spacing:2.6px;font-weight:700;fill:currentColor;font-family:var(--fm)"><textPath href="#stc${Math.floor(r()*1e6)}" startOffset="0">${txt}</textPath></text>
    </svg>
    <span style="position:absolute;inset:0;display:grid;place-items:center;font-size:${u(4)}">${F.icon(x.icon||'spark')}</span></div>`;});
  c('discount-seal','Selo de oferta','Rótulos',(r,x)=>`<div data-anim="pop" style="width:${u(13)};aspect-ratio:1;clip-path:polygon(${(function(){const pts=[];for(let k=0;k<24;k++){const a=Math.PI*k/12-Math.PI/2,rr=k%2?42:50;pts.push((50+rr*Math.cos(a)).toFixed(1)+'% '+(50+rr*Math.sin(a)).toFixed(1)+'%');}return pts.join(',');})()});background:var(--b-ac);color:var(--b-bg);display:grid;place-items:center;text-align:center;transform:rotate(${(r()*16-8).toFixed(0)}deg)">
    <span style="display:flex;flex-direction:column;line-height:1"><b class="fh" style="font-size:${u(3.4)}">${esc(x.title||'-40%')}</b><span class="fm" style="font-size:${u(1.2)};letter-spacing:.12em;font-weight:700">${esc((x.sub||'SÓ HOJE').toUpperCase())}</span></span></div>`);
  c('flag-new','Bandeira NOVO','Rótulos',(r,x)=>`<span style="display:inline-flex;align-items:center;gap:.5em;background:var(--b-p2);color:var(--b-bg);font-weight:900;font-size:${u(2)};letter-spacing:.14em;padding:.45em 1em;clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%)">${esc((x.kicker||'NOVO').toUpperCase())}&nbsp;&nbsp;</span>`);
  c('date-chip','Chip de data','Rótulos',(r,x)=>`<span class="fm" style="display:inline-flex;align-items:center;gap:.55em;border:1px solid color-mix(in srgb,var(--b-fg) 30%,transparent);border-radius:99px;padding:.5em 1.1em;font-size:${u(1.9)}"><i style="font-style:normal;color:var(--b-ac);display:flex;font-size:1.15em"><svg class="ic" viewBox="0 0 24 24" style="width:1em;height:1em"><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg></i>${esc(x.title||'24 ago · 19h')}</span>`);
  c('loc-chip','Chip de local','Rótulos',(r,x)=>`<span class="fm" style="display:inline-flex;align-items:center;gap:.55em;border:1px solid color-mix(in srgb,var(--b-fg) 30%,transparent);border-radius:99px;padding:.5em 1.1em;font-size:${u(1.9)}"><i style="font-style:normal;color:var(--b-ac);display:flex;font-size:1.15em"><svg class="ic" viewBox="0 0 24 24" style="width:1em;height:1em"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></i>${esc(x.title||'São Paulo · SP')}</span>`);
  c('swatches','Paleta da marca','Rótulos',()=>`<span style="display:inline-flex;gap:${u(0.8)}">${['bg','p1','p2','ac','fg'].map((t,i)=>
    `<i data-anim="pop" style="--d:${(i*.08).toFixed(2)}s;font-style:normal;width:${u(4)};aspect-ratio:1;border-radius:${u(1.1)};background:var(--b-${t});border:1px solid color-mix(in srgb,var(--b-fg) 28%,transparent)"></i>`).join('')}</span>`);
  c('barcode','Código de barras','Rótulos',(r,x)=>{
    /* Code 128 REAL e escaneável (lib/codes.js): o código vem do
       formulário do COMPOR (números e/ou texto) — determinístico. */
    const content = (x.title||'').trim() || '0072026400018';
    return `<span style="display:inline-flex;flex-direction:column;align-items:center;gap:.4em;color:var(--b-fg)">
    <span style="display:block;width:${u(18)};height:${u(5.4)}">${F.barcodeSVG(content)}</span>
    <span class="fm" style="font-size:${u(1.5)};letter-spacing:.3em;opacity:.7">${esc(content)}</span></span>`;});

  /* ---------- campos editáveis por componente ---------- */
  const FIELDS = {
    'btn-play':['title'], 'link-arrow':['cta'], tag:['kicker'], 'tag-row':['sub'],
    'download-chip':['title','sub'], 'card-feature':['title','sub','icon'],
    'card-step':['kicker','title','sub'], 'card-banner':['title','sub','cta'],
    'card-profile':['kicker','title','sub'], 'card-event':['kicker','title','sub'],
    coupon:['kicker','title','sub'], polaroid:['sub'],
    kpi:['title','sub'], 'stat-row':['sub'], sparkline:['data','title','sub'],
    'chart-pie':['kicker','title','sub'], gauge:['value'], 'chart-cols':['sub'],
    compare:['title','kicker','sub'], delta:['title','sub'], heatgrid:['data','sub'],
    'chat-in':['sub'], 'chat-out':['sub'], 'social-post':['kicker','title','sub'],
    comment:['title','sub'], 'id-badge':['kicker','title','sub'],
    phone:['title'], 'video-player':['sub'], 'music-player':['title','sub','icon'],
    'search-bar':['title'], terminal:['sub'], 'credit-card':['title','sub','value'],
    'calendar-date':['title','sub'], 'map-pin':['title','sub'], 'toggle-row':['title','sub'],
    qr:['qrdata','sub'],
    'steps-h':['sub'], 'timeline-v':['sub'], faq:['title','sub'],
    'quote-big':['title','sub'], divider:['icon'], 'section-head':['kicker','title'],
    'checklist-x':['title','sub'],
    ribbon:['kicker'], stamp:['title','icon'], 'discount-seal':['title','sub'],
    'flag-new':['kicker'], 'date-chip':['title'], 'loc-chip':['title'], barcode:['title'],
  };
  Object.entries(FIELDS).forEach(([id,f])=>{ const d=F.components.get(id); if(d) d.fields=f; });
  /* componentes que acoplam imagem própria (upload + enquadramento no COMPOR) */
  ['phone','video-player','polaroid'].forEach(id=>{ const d=F.components.get(id); if(d) d.imgSlot=true; });
})(window.FORMA);

</script>
<script>
/* ===== js/templates/static.js ===== */
/* =====================================================
   FORJE·studio — templates/static.js
   Templates base com VARIAÇÃO COMBINATÓRIA: cada seed
   sorteia fundo (lib bgs) × tratamento do título ×
   tom de destaque × decorações × alinhamento. Todos
   consomem slide.img (cover → fundo; máscara → flutuante).
   ===================================================== */
(function(F){
  const {esc, nl, letters, pick, logoHTML, imgHTML, bgImage, floatImage, icon, fxHTML, slideBadge, mixTitle, fancyTitle} = F;
  const st = () => F.state;

  const veilSide = dir => `linear-gradient(${dir},color-mix(in srgb,var(--b-bg) 92%,transparent) 34%,color-mix(in srgb,var(--b-bg) 45%,transparent) 60%,transparent)`;
  const veilFull = `linear-gradient(180deg,color-mix(in srgb,var(--b-bg) 55%,transparent),color-mix(in srgb,var(--b-bg) 88%,transparent))`;

  /* título com tratamento sorteado (anim compatível) */
  function titleHTML(s, r, size, extra=''){
    /* Eixo 2: slide com DESTAQUE do parser força o modo fancy (o
       destaque tem que aparecer); fit tipográfico só age no excedente */
    const mode = (s.hl && s.hl.length) ? 'fancy' : pick(r, ['letters','letters','fancy','mix','upper']);
    const base = `font-size:calc(var(--u)*${F.fitT ? F.fitT(size, s) : size}px);line-height:1.03;font-weight:800;letter-spacing:-.012em;${extra}`;
    if(mode==='letters') return `<h1 class="fh" data-anim="letters" style="${base}">${letters(s.title)}</h1>`;
    if(mode==='fancy')   return `<h1 class="fh" data-anim="clip-up" style="--dur:1s;${base}">${fancyTitle(s.title, r)}</h1>`;
    if(mode==='mix')     return `<h1 class="fh" data-anim="blur" style="--dur:1s;${base}">${mixTitle(s.title, r, ['','tHollow'])}</h1>`;
    return `<h1 class="fh" data-anim="clip-up" style="--dur:1s;${base}text-transform:uppercase">${fancyTitle(s.title, r)}</h1>`;
  }
  /* fundo: identidade da marca OU biblioteca geradora */
  function bgPick(r, identity){
    return pick(r, ['lib','lib','id']) === 'lib' ? F.bgOf(r) :
      `<div class="abs" style="inset:0;background:${identity}"></div>`;
  }
  const tone = r => pick(r,['ac','ac','p1','p2']);

  /* ============ Eixo 1 v2 · intérpretes do COMPOSITOR ============
     Somente os templates MIGRADOS (manifesto, split, quote) consomem
     F.composeSpec/composeBG/composeOrn; glow, cta e grid seguem os
     helpers originais acima. Nenhum adorno aleatório: ornamento vem
     do compositor (estrutural, ancorado ao grid — premissa C3). */
  const DEN = {                       // respiro → espaçamentos e sub
    air :{gap:3.2, subW:22, subS:2.6},
    mid :{gap:2.6, subW:26, subS:2.7},
    full:{gap:2.2, subW:30, subS:2.8},
  };
  const CON = {                       // contraste tipográfico título/sub
    high:{w:900, ls:'-.02em',  lh:1.0,  subO:.78},
    mid :{w:800, ls:'-.012em', lh:1.05, subO:.88},
    soft:{w:600, ls:'-.004em', lh:1.12, subO:.92},
  };
  const AI = a => a==='center' ? 'center' : (a==='right' ? 'flex-end' : 'flex-start');
  const wideFmt = () => { const f = F.FORMATS[st().format]; return f.w/f.h >= 1.3; };

  /* título honrando contraste + assinatura da direção */
  function titleC(s, r, X, size, extra=''){
    const c = CON[X.contrast];
    const upper = X.dir==='brutal' || (X.dir==='poster' && r()<.5);
    const base = `font-size:calc(var(--u)*${F.fitT ? F.fitT(size, s) : size}px);line-height:${c.lh};font-weight:${c.w};letter-spacing:${c.ls};${upper?'text-transform:uppercase;':''}${F.perspStyle(X)}${extra}`;
    const wantHl = !!(s.hl && s.hl.length);      // Eixo 2: destaque garantido
    if(X.sig==='hollow' && !wantHl) return `<h1 class="fh" data-anim="blur" style="--dur:1s;${base}">${mixTitle(s.title, r, ['','tHollow'])}</h1>`;
    if(wantHl || X.sig==='hl'||X.sig==='ub')
      return `<h1 class="fh" data-anim="clip-up" style="--dur:1s;${base}">${F.fancyTitle(s.title, r, (X.sig==='hl'||X.sig==='ub')?X.sig:undefined)}</h1>`;
    return `<h1 class="fh" data-anim="letters" style="${base}">${letters(s.title)}</h1>`;
  }
  /* kicker via design system (C7): plain/tag/badge/mono/num/dot/underline */
  function kickerC(s, X){
    return `<div style="display:flex" data-anim="clip">${F.dsys.kicker(X.ui.kicker, X, s.kicker)}</div>`;
  }
  function subC(s, X, d='1.1s'){
    const D = DEN[X.density], c = CON[X.contrast];
    return `<p data-anim="fade-up" style="--d:${d};font-size:calc(var(--u)*${F.fitS ? F.fitS(D.subS, s) : D.subS}px);line-height:1.5;opacity:${c.subO};max-width:${D.subW}em">${nl(s.sub)}</p>`;
  }
  /* divisor via design system (C7): solid/double/dotted/slashes */
  function barC(r, X, d='.95s'){
    if(X.sig!=='bar') return '';
    return F.dsys.bar(X.ui.bar, X, (8+r()*10).toFixed(0), d);
  }
  /* rodapé via design system (C7): handle e ação nas variantes da direção */
  function footerC(X){
    return `<div style="display:flex;justify-content:space-between;width:100%;align-items:center">
      ${F.dsys.handle(X.ui.handle, X)}
      ${F.dsys.cta(X.ui.cta, X, st().cta)}
    </div>`;
  }


  /* =====================================================
     MOTOR GENERATIVO · template LIVRE (S3.4)
     A tese do produto: variar não é sacudir o template —
     é COMPOR OUTRO. O Livre é o compositor puro: estrutura
     da biblioteca global (por direção), esquema, acabamento
     e design system geram um template novo a cada seed —
     a lib de templates não precisa crescer para o espaço
     de composições crescer.
     ===================================================== */
  F.composeArt = function(s, r){
    const X = F.composeSpec(r,'livre'), D = DEN[X.density], C = CON[X.contrast];
    const SW = F.schemeVars(X);
    const bg = F.composeBG(r, X, `linear-gradient(${Math.floor(r()*360)}deg,color-mix(in srgb,var(--b-p1) 14%,var(--b-bg)),var(--b-bg) 58%)`);
    const fin = F.composeFinish(r, X), orn = F.composeOrn(X);
    const ai = AI(X.align), P = 'padding:calc(var(--u)*7px)';
    const topRow = `<div style="display:flex;justify-content:space-between;width:100%;align-items:center">${logoHTML()}${kickerC(s,X)}</div>`;
    const floatImg = s.img
      ? floatImage(s.img, s.mask==='cover'?'circle':s.mask, `right:${(6+r()*4).toFixed(0)}%;top:${(8+r()*10).toFixed(0)}%;width:${(20+r()*8).toFixed(0)}%;aspect-ratio:1`) : '';

    /* ---- DIAGONAL: corte diagonal — metade invertida ou imagem ---- */
    if(X.structure==='diagonal'){
      const a = (54+r()*14).toFixed(0), b = (34+r()*14).toFixed(0);
      const half = s.img
        ? `<div class="abs" data-anim="fade" style="--dur:1s;inset:0;clip-path:polygon(${a}% 0,100% 0,100% 100%,${b}% 100%)">${imgHTML(s.img,'','style="position:absolute;inset:0"')}<div class="abs" style="inset:0;background:color-mix(in srgb,var(--b-bg) 25%,transparent)"></div></div>`
        : `<div class="abs" data-anim="fade" style="--dur:1s;inset:0;clip-path:polygon(${a}% 0,100% 0,100% 100%,${b}% 100%);background:var(--b-fg)"></div>`;
      return F.schemeWrap(SW, `${bg}${fin}${half}${orn}
    <div class="abs" style="inset:0;${P};display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left">
      ${topRow}
      <div style="display:flex;flex-direction:column;gap:calc(var(--u)*${D.gap}px);align-items:flex-start;max-width:56%">
        ${barC(r,X)}
        ${titleC(s, r, X, (5.6+r()*1.8).toFixed(1))}
        ${subC(s,X)}
      </div>
      ${footerC(X)}
    </div>${fxHTML()}${slideBadge()}`);
    }
    /* ---- TICKER: faixas de texto repetido + palco central ---- */
    if(X.structure==='ticker'){
      const word = (s.kicker || s.title || '').split('\n')[0];
      const seq = esc((word+'  •  ').repeat(8));
      const row = (pos,d)=>`<div class="abs fh" data-anim="fade" style="--d:${d};${pos};white-space:nowrap;font-size:calc(var(--u)*3.4px);font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.16">${seq}</div>`;
      return F.schemeWrap(SW, `${bg}${fin}${orn}
    ${row('left:-4%;top:calc(var(--u)*8px)','.2s')}
    ${row('left:-14%;bottom:calc(var(--u)*8px)','.35s')}
    <div class="abs" style="inset:0;${P};display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:calc(var(--u)*${D.gap}px)">
      ${kickerC(s,X)}
      ${titleC(s, r, X, (6.4+r()*2).toFixed(1), 'max-width:11em;')}
      ${subC(s,X)}
      ${F.dsys.cta(X.ui.cta, X, st().cta)}
    </div>
    <div class="abs" style="left:calc(var(--u)*7px);right:calc(var(--u)*7px);bottom:calc(var(--u)*14px);display:flex;justify-content:space-between;align-items:center">${logoHTML()}${F.dsys.handle(X.ui.handle, X)}</div>
    ${fxHTML()}${slideBadge()}`);
    }
    /* ---- LETTERBOX: barras cinematográficas + palco largo ---- */
    if(X.structure==='letterbox'){
      const bh = (9+r()*4).toFixed(1);
      const barBox = pos=>`<div class="abs" data-anim="clip" style="--dur:.9s;left:0;right:0;${pos}:0;height:calc(var(--u)*${bh}px);background:var(--b-fg);color:var(--b-bg);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*7px)"></div>`;
      return F.schemeWrap(SW, `${bg}${fin}
    ${barBox('top')}${barBox('bottom')}
    <div class="abs" data-anim="fade" style="--d:.3s;left:calc(var(--u)*7px);top:calc(var(--u)*${(bh/2-1.2).toFixed(1)}px);color:var(--b-bg);display:flex;align-items:center;gap:1em">${logoHTML()}</div>
    <div class="abs fm" data-anim="fade" style="--d:.4s;right:calc(var(--u)*7px);top:calc(var(--u)*${(bh/2-1).toFixed(1)}px);color:var(--b-bg);font-family:var(--fm);font-size:calc(var(--u)*1.9px);letter-spacing:.16em">${esc(s.kicker).toUpperCase()}</div>
    <div class="abs" style="left:0;right:0;top:calc(var(--u)*${bh}px);bottom:calc(var(--u)*${bh}px);${P};display:flex;flex-direction:column;justify-content:center;align-items:${ai};text-align:${X.align};gap:calc(var(--u)*${D.gap}px)">
      ${titleC(s, r, X, (5.8+r()*1.6).toFixed(1), 'max-width:13em;')}
      ${barC(r,X)}
      ${subC(s,X)}
    </div>
    <div class="abs" data-anim="fade" style="--d:1.1s;right:calc(var(--u)*7px);bottom:calc(var(--u)*${(bh/2-1).toFixed(1)}px);color:var(--b-bg);display:inline-flex">${F.dsys.handle(X.ui.handle, X, '1.1s')}</div>
    ${floatImg}${fxHTML()}${slideBadge()}`);
    }
    /* ---- BIGNUM: índice monumental como protagonista gráfico ---- */
    if(X.structure==='bignum'){
      const n = String((F.state.mode==='design'?F.state.cur:F.state.curScene)+1).padStart(2,'0');
      const side = r()<.5;
      return F.schemeWrap(SW, `${bg}${fin}${orn}
    <div class="abs fh" data-anim="blur" style="--dur:1.2s;${side?'right':'left'}:calc(var(--u)*-3px);top:50%;transform:translateY(-50%);font-size:calc(var(--u)*${(38+r()*14).toFixed(0)}px);line-height:1;font-weight:900;color:color-mix(in srgb,var(--b-${X.tone}) 26%,transparent);letter-spacing:-.04em">${n}</div>
    <div class="abs" style="inset:0;${P};display:flex;flex-direction:column;justify-content:space-between;align-items:${side?'flex-start':'flex-end'};text-align:${side?'left':'right'}">
      ${topRow}
      <div style="display:flex;flex-direction:column;gap:calc(var(--u)*${D.gap}px);align-items:${side?'flex-start':'flex-end'};max-width:62%">
        ${titleC(s, r, X, (6+r()*2).toFixed(1))}
        ${barC(r,X)}
        ${subC(s,X)}
      </div>
      ${footerC(X)}
    </div>${fxHTML()}${slideBadge()}`);
    }
    /* ---- FRAMEHERO: moldura grossa + herói central; kicker rompe a borda ---- */
    if(X.structure==='framehero'){
      const bw = (0.9+r()*0.5).toFixed(2);
      return F.schemeWrap(SW, `${bg}${fin}
    <div class="abs" data-anim="fade" style="--d:.2s;inset:calc(var(--u)*4px);border:calc(var(--u)*${bw}px) solid var(--b-${X.tone});pointer-events:none"></div>
    <div class="abs" data-anim="clip" style="--d:.4s;left:50%;top:calc(var(--u)*4px);transform:translate(-50%,-50%);background:var(--b-bg);padding:.2em 1.2em;display:inline-flex">${kickerC(s,X)}</div>
    <div class="abs" style="inset:calc(var(--u)*4px);padding:calc(var(--u)*6px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:calc(var(--u)*${D.gap}px)">
      ${logoHTML('fade-up','.3s')}
      ${titleC(s, r, X, (6+r()*1.8).toFixed(1), 'max-width:11em;')}
      ${subC(s,X)}
      ${F.dsys.cta(X.ui.cta, X, st().cta)}
    </div>
    <div class="abs" data-anim="fade-up" style="--d:1.2s;left:50%;bottom:calc(var(--u)*4px);transform:translate(-50%,50%);background:var(--b-bg);padding:.2em 1em;display:inline-flex">${F.dsys.handle(X.ui.handle, X, '1.2s')}</div>
    ${floatImg}${fxHTML()}${slideBadge()}`);
    }
    /* ---- GIANTMARK: aspas monumentais (família citação) ---- */
    if(X.structure==='giantmark'){
      return F.schemeWrap(SW, `${bg}${fin}${orn}
    <div class="abs fh" data-anim="blur" style="--dur:1.4s;left:50%;top:46%;transform:translate(-50%,-50%);font-size:calc(var(--u)*${(56+r()*14).toFixed(0)}px);line-height:1;color:var(--b-${X.tone});opacity:.16;pointer-events:none">\u201c</div>
    <div class="abs" style="inset:0;padding:calc(var(--u)*8px) calc(var(--u)*9px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:calc(var(--u)*${D.gap}px)">
      ${kickerC(s,X)}
      ${titleC(s, r, X, (5.4+r()*1.4).toFixed(1), 'max-width:15em;')}
      ${subC(s,X)}
    </div>
    <div class="abs" style="left:calc(var(--u)*7px);right:calc(var(--u)*7px);bottom:calc(var(--u)*5px);display:flex;justify-content:space-between;align-items:center">${logoHTML('fade-up','1.2s')}${F.dsys.handle(X.ui.handle, X, '1.25s')}</div>
    ${fxHTML()}${slideBadge()}`);
    }
    /* ---- ATTRIBUTED: bloco editorial com atribuição forte ---- */
    if(X.structure==='attributed'){
      return F.schemeWrap(SW, `${bg}${fin}${orn}

  F.templates.register('split',{n:'Split',d:'Metade imagem, metade texto; lado, fundo e tom variam.',
   mini:'<rect x="52" y="6" width="42" height="32" rx="4" fill="#3b3f4c"/><rect x="8" y="12" width="36" height="6" rx="2" fill="#eceef2"/><rect x="8" y="22" width="28" height="3" rx="1.5" fill="#9aa0ad"/><rect x="8" y="29" width="18" height="5" rx="2.5" fill="#5ee6c7"/>',
   render(s,r){
    /* Eixo 1 v2 — composição por premissas; 'stack' cai para 'half'
       em formato largo (faixa superior rasa demais — P4) */
    const X = F.composeSpec(r,'split'), D = DEN[X.density], C = CON[X.contrast];
    if(X.structure==='stack' && wideFmt()) X.structure = 'half';
    const flip = r()<.45, isCover = s.mask==='cover';
    const orn = F.composeOrn(X);
    const bg = F.composeBG(r, X, `radial-gradient(120% 120% at ${flip?'85%':'15%'} 20%,color-mix(in srgb,var(--b-p1) 22%,var(--b-bg)),var(--b-bg))`);
    const alc = AI(X.align==='right' ? 'left' : X.align);
    const SW = F.schemeVars(X), fin = F.composeFinish(r, X);   // C8/C9
    const ta  = X.align==='center' ? 'center' : 'left';
    const stack = `<div style="display:flex;flex-direction:column;gap:calc(var(--u)*${(D.gap-0.2).toFixed(1)}px);align-items:${alc}">
        ${kickerC(s,X)}

        ${barC(r,X,'.7s')}
        <p data-anim="fade-up" style="--d:.6s;font-size:calc(var(--u)*${F.fitS((D.subS-0.1).toFixed(1), s)}px);line-height:1.5;opacity:${C.subO}">${nl(s.sub)}</p>
        ${st().cta?`<span data-anim="pop" style="--d:.85s;align-self:${alc};display:inline-flex">${F.dsys.cta(X.ui.cta, X, st().cta, '.85s')}</span>`:''}
      </div>`;

    /* STACK — corte horizontal: imagem em faixa superior, texto embaixo */
    if(X.structure==='stack'){
      const hImg = (40+r()*10).toFixed(0);
      const imgTop = isCover
        ? `<div class="abs" data-anim="clip" style="--dur:1.1s;left:0;right:0;top:0;height:${hImg}%">${imgHTML(s.img,'','style="position:absolute;inset:0"')}</div>`
        : `<div class="abs" data-anim="clip" style="--dur:1.1s;left:0;right:0;top:0;height:${hImg}%;display:grid;place-items:center">${floatImage(s.img, s.mask, 'position:relative;width:30%;aspect-ratio:1')}</div>`;
      return F.schemeWrap(SW, `${bg}${fin}${imgTop}${orn}
    <div class="abs" style="left:0;right:0;bottom:0;top:${hImg}%;padding:calc(var(--u)*6px) calc(var(--u)*7px);display:flex;flex-direction:column;justify-content:space-between;align-items:${alc};text-align:${ta}">
      ${stack}
      <div style="display:flex;justify-content:space-between;width:100%;align-items:center">${logoHTML()}${F.dsys.handle(X.ui.handle, X, '1s')}</div>
    </div>${fxHTML()}${slideBadge()}`);
    }
    /* PANEL — imagem full-bleed + cartão de texto sobreposto */
    if(X.structure==='panel'){
      const base = s.img ? bgImage(s.img, veilSide(flip?'270deg':'90deg')) : bg;
      return F.schemeWrap(SW, `${base}${fin}${orn}
    <div class="abs" data-anim="rise" style="--dur:1s;${flip?'right':'left'}:calc(var(--u)*6px);top:50%;transform:translateY(-50%);width:46%;${F.dsys.cardStyle(X.ui.card, X)}padding:calc(var(--u)*5px);display:flex;flex-direction:column;gap:calc(var(--u)*2.2px);align-items:flex-start;text-align:left">
      ${logoHTML()}
      ${kickerC(s,X)}
      ${titleC(s, r, X, (4.6+r()*1.2).toFixed(1))}
      <p data-anim="fade-up" style="--d:.6s;font-size:calc(var(--u)*${F.fitS(2.5, s)}px);line-height:1.5;opacity:${C.subO}">${nl(s.sub)}</p>
      ${st().cta?`<span data-anim="pop" style="--d:.85s;display:inline-flex">${F.dsys.cta(X.ui.cta, X, st().cta, '.85s')}</span>`:''}
    </div>
    <span class="abs" data-anim="fade-up" style="--d:1.1s;${flip?'left':'right'}:calc(var(--u)*7px);bottom:calc(var(--u)*5px);display:inline-flex">${F.dsys.handle(X.ui.handle, X, '1.1s')}</span>
    ${fxHTML()}${slideBadge()}`);
    }
    /* COLUMN — coluna estreita de texto + imagem dominante + régua divisória */
    if(X.structure==='column'){
      const tw = (38+r()*4).toFixed(0);
      const imgSide = isCover
        ? `<div class="abs" data-anim="clip${flip?'':'-up'}" style="--dur:1.1s;${flip?'left':'right'}:0;top:0;bottom:0;width:${(100-tw)}%">${imgHTML(s.img,'','style="position:absolute;inset:0"')}</div>`
        : floatImage(s.img, s.mask, `${flip?'left':'right'}:${((100-tw)/2-17).toFixed(0)}%;top:50%;transform:translateY(-50%);width:34%;aspect-ratio:1`);

      return F.schemeWrap(SW, `${bg}${fin}${imgSide}${divider}${orn}
    <div class="abs" style="${flip?'right':'left'}:0;top:0;bottom:0;width:${tw}%;padding:calc(var(--u)*7px) calc(var(--u)*5px) calc(var(--u)*7px) calc(var(--u)*7px);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left">

        ${barC(r,X,'.7s')}
        <p data-anim="fade-up" style="--d:.6s;font-size:calc(var(--u)*${F.fitS(2.4, s)}px);line-height:1.5;opacity:${C.subO}">${nl(s.sub)}</p>
        ${st().cta?`<span data-anim="pop" style="--d:.85s;display:inline-flex">${F.dsys.cta(X.ui.cta, X, st().cta, '.85s')}</span>`:''}
      </div>
      ${F.dsys.handle(X.ui.handle, X, '1s')}
    </div>${fxHTML()}${slideBadge()}`);

    const imgBox = isCover
      ? `<div class="abs" data-anim="clip${flip?'':'-up'}" style="--dur:1.1s;${flip?'left':'right'}:0;top:0;bottom:0;width:${(42+r()*8).toFixed(0)}%">${imgHTML(s.img,'','style="position:absolute;inset:0"')}</div>`
      : floatImage(s.img, s.mask, `${flip?'left':'right'}:6%;top:50%;transform:translateY(-50%);width:${(32+r()*10).toFixed(0)}%;aspect-ratio:1`);
    return F.schemeWrap(SW, `${bg}${fin}${imgBox}${orn}
    <div class="abs" style="${flip?'right':'left'}:0;top:0;bottom:0;width:52%;padding:calc(var(--u)*7px);display:flex;flex-direction:column;justify-content:space-between;align-items:${alc};text-align:${ta}">
      ${logoHTML()}
      ${stack}
      ${F.dsys.handle(X.ui.handle, X, '1s')}
    </div>${fxHTML()}${slideBadge()}`);

    /* Eixo 1 v2 — composição por premissas; contraste vira peso de
       citação (700/600/500) — leitura mais leve que o manifesto */
    const X = F.composeSpec(r,'quote'), D = DEN[X.density], C = CON[X.contrast];
    const qw = {high:700, mid:600, soft:500}[X.contrast];
    const bg = s.img && s.mask==='cover' ? bgImage(s.img, veilSide('90deg'))
      : F.composeBG(r, X, `linear-gradient(180deg,var(--b-bg),color-mix(in srgb,var(--b-${X.tone}) 10%,var(--b-bg)))`);
    const portrait = s.img && s.mask!=='cover'
      ? floatImage(s.img, s.mask==='blob'?'blob':'circle', 'right:7%;bottom:16%;width:20%;aspect-ratio:1','pop') : '';
    const orn = F.composeOrn(X);
    const SW = F.schemeVars(X), fin = F.composeFinish(r, X);   // C8/C9
    const wantHl = !!(s.hl && s.hl.length);      // Eixo 2: destaque garantido
    const tBody = (X.sig==='hollow' && !wantHl) ? mixTitle(s.title, r, ['','tHollow'])
                : (wantHl || X.sig==='hl'||X.sig==='ub') ? F.fancyTitle(s.title, r, (X.sig==='hl'||X.sig==='ub')?X.sig:undefined)
                : letters(s.title);
    const tAnim = (X.sig==='hollow' && !wantHl) ? 'blur' : (wantHl || X.sig==='hl'||X.sig==='ub') ? 'clip-up' : 'letters';
    const footer = `<div class="abs" style="left:calc(var(--u)*7px);right:calc(var(--u)*7px);bottom:calc(var(--u)*5px);display:flex;justify-content:space-between;align-items:center">
      ${logoHTML('fade-up','1.3s')}${F.dsys.handle(X.ui.handle, X, '1.35s')}
    </div>`;

    /* GIANTMARK — as aspas são o protagonista gráfico (C2): marca
       monumental translúcida atrás do texto centrado */
    if(X.structure==='giantmark'){
      return F.schemeWrap(SW, `${bg}${fin}${orn}
    <div class="abs fh" data-anim="blur" style="--dur:1.4s;left:50%;top:46%;transform:translate(-50%,-50%);font-size:calc(var(--u)*${(56+r()*16).toFixed(0)}px);line-height:1;color:var(--b-${X.tone});opacity:.14;pointer-events:none">\u201c</div>
    <div class="abs" style="inset:0;padding:calc(var(--u)*8px) calc(var(--u)*9px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:calc(var(--u)*${D.gap}px)">
      <h1 class="fh" data-anim="${tAnim}" style="--t0:.35s;${tAnim!=='letters'?'--dur:1s;':''}font-size:calc(var(--u)*${F.fitT((5.6+r()*1.4).toFixed(1), s)}px);line-height:1.22;font-weight:${qw};max-width:15em">${tBody}</h1>
      <div style="display:flex;align-items:center;gap:calc(var(--u)*2px)">
        ${X.sig==='bar'?`<div class="bar" data-anim="line" style="--d:1.05s;width:calc(var(--u)*6px);background:var(--b-${X.tone})"></div>`:''}
        <p data-anim="fade-up" style="--d:1.15s;font-size:calc(var(--u)*${F.fitS(D.subS, s)}px);opacity:${C.subO}">${nl(s.sub)}</p>
      </div>
    </div>${portrait}${footer}${fxHTML()}${slideBadge()}`);
    }
    /* ATTRIBUTED — citação editorial + bloco de atribuição forte */
    if(X.structure==='attributed'){
      const face = s.img && s.mask!=='cover'
        ? floatImage(s.img, 'circle', 'position:relative;width:calc(var(--u)*9px);aspect-ratio:1;flex:0 0 auto','pop') : '';
      return F.schemeWrap(SW, `${bg}${fin}${orn}
    <div class="abs" style="inset:0;padding:calc(var(--u)*8px);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*${(D.gap+0.6).toFixed(1)}px)">
      <div class="fh" data-anim="fade" style="font-size:calc(var(--u)*9px);line-height:.6;color:var(--b-${X.tone})">\u201c</div>
      <h1 class="fh" data-anim="${tAnim}" style="--t0:.3s;${tAnim!=='letters'?'--dur:1s;':''}font-size:calc(var(--u)*${F.fitT((4.8+r()*1.2).toFixed(1), s)}px);line-height:1.24;font-weight:${qw};max-width:17em">${tBody}</h1>
      <div style="display:flex;align-items:center;gap:calc(var(--u)*2.4px)">
        ${face}
        <div class="bar" data-anim="line-y" style="--d:1s;--dur:.7s;width:calc(var(--u)*0.6px);height:calc(var(--u)*6px);background:var(--b-${X.tone})"></div>
        <div style="display:flex;flex-direction:column;gap:calc(var(--u)*0.5px)">
          <strong data-anim="fade-up" style="--d:1.1s;font-size:calc(var(--u)*2.6px);font-weight:800">${nl(s.sub)}</strong>
          <span class="kicker" data-anim="fade-up" style="--d:1.2s;color:var(--b-${X.tone})">${esc(s.kicker)}</span>
        </div>
      </div>
    </div>${footer}${fxHTML()}${slideBadge()}`);
    }
    /* CENTERED — palco central com aspas no eixo */
    if(X.structure==='centered'){
      return F.schemeWrap(SW, `${bg}${fin}${orn}
    <div class="abs fh" data-anim="blur" style="left:50%;transform:translateX(-50%);top:calc(var(--u)*4px);font-size:calc(var(--u)*${(16+r()*6).toFixed(0)}px);line-height:1;color:var(--b-${X.tone});opacity:.9">\u201c</div>
    <div class="abs" style="inset:0;padding:calc(var(--u)*8px) calc(var(--u)*9px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:calc(var(--u)*${D.gap}px)">
      <h1 class="fh" data-anim="${tAnim}" style="--t0:.35s;${tAnim!=='letters'?'--dur:1s;':''}font-size:calc(var(--u)*${F.fitT((5.2+r()*1.4).toFixed(1), s)}px);line-height:1.22;font-weight:${qw};max-width:15em;margin-top:calc(var(--u)*7px)">${tBody}</h1>
      <div style="display:flex;align-items:center;gap:calc(var(--u)*2px)">
        ${X.sig==='bar'?`<div class="bar" data-anim="line" style="--d:1.05s;width:calc(var(--u)*6px);background:var(--b-${X.tone})"></div>`:''}
        <p data-anim="fade-up" style="--d:1.15s;font-size:calc(var(--u)*${F.fitS(D.subS, s)}px);opacity:${C.subO}">${nl(s.sub)}</p>
      </div>
    </div>${portrait}${footer}${fxHTML()}${slideBadge()}`);
    }
    /* CLASSIC — a citação original, dirigida pelos eixos coerentes */
    return F.schemeWrap(SW, `${bg}${fin}${orn}
    <div class="abs fh" data-anim="blur" style="left:calc(var(--u)*5px);top:calc(var(--u)*-2px);font-size:calc(var(--u)*${(22+r()*8).toFixed(0)}px);line-height:1;color:var(--b-${X.tone});opacity:.9">\u201c</div>
    <div class="abs" style="inset:0;padding:calc(var(--u)*7px) calc(var(--u)*8px);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*${D.gap}px)">
      <h1 class="fh" data-anim="${tAnim}" style="--t0:.35s;${tAnim!=='letters'?'--dur:1s;':''}font-size:calc(var(--u)*${F.fitT((5.2+r()*1.4).toFixed(1), s)}px);line-height:1.18;font-weight:${qw};max-width:16em;margin-top:calc(var(--u)*6px)">${tBody}</h1>
      <div style="display:flex;align-items:center;gap:calc(var(--u)*2px)">
        ${X.sig==='bar'?`<div class="bar" data-anim="line" style="--d:1.05s;width:calc(var(--u)*8px);background:var(--b-${X.tone})"></div>`:''}
        <p data-anim="fade-up" style="--d:1.15s;font-size:calc(var(--u)*${F.fitS(D.subS, s)}px);opacity:${C.subO}">${nl(s.sub)}</p>
      </div>
    </div>${portrait}${footer}${fxHTML()}${slideBadge()}`);
  }});

  /* ------------------------------------------------ PRODUTO/CTA */
  F.templates.register('cta',{n:'Produto/CTA',d:'Imagem em destaque com selo; rotação, máscara e fundo variam.',
   mini:'<circle cx="68" cy="22" r="16" fill="#3b3f4c"/><circle cx="80" cy="10" r="6" fill="#ffb020"/><rect x="8" y="14" width="34" height="6" rx="2" fill="#eceef2"/><rect x="8" y="26" width="22" height="6" rx="3" fill="#5ee6c7"/>',
   render(s,r){
    /* S3.3 — migração leve: identidade (produto + selo) preservada;
       esquema e design system por cima; estrutura 'tilt' inclina a
       vitrine e o título em perspectiva */
    const X = F.composeSpec(r,'cta'), SW = F.schemeVars(X);
    const fin = F.composeFinish(r, X);
    const tilt = X.structure==='tilt';
    const rot=((r()*14-7)*(tilt?1.8:1)).toFixed(1), tn = X.tone;
    const persp = tilt ? F.perspStyle({finish:'persp', align:'left'}) : '';
    const mask = s.mask==='cover' ? pick(r,['arch','circle','window']) : s.mask;
    const bg = bgPick(r, `radial-gradient(90% 90% at 78% 30%,color-mix(in srgb,var(--b-p1) 30%,var(--b-bg)),transparent 60%),radial-gradient(70% 70% at 20% 90%,color-mix(in srgb,var(--b-p2) 18%,var(--b-bg)),transparent 55%),var(--b-bg)`);
    return F.schemeWrap(SW, `${bg}${fin}
    <div class="abs" data-anim="scale" style="--dur:1.1s;right:7%;top:50%;transform:translateY(-50%) rotate(${rot}deg);width:${(38+r()*8).toFixed(0)}%;aspect-ratio:1">
      <div class="abs" data-anim="float" style="inset:0">${imgHTML(s.img,{circle:'mask-circle',blob:'mask-blob',arch:'mask-arch',window:'mask-window'}[mask]||'mask-arch','style="position:absolute;inset:0"')}</div>
      <div class="abs" data-anim="pop" style="--d:.9s;right:-4%;top:-6%;display:flex;align-items:center;gap:.4em;background:var(--b-${tn});color:var(--b-bg);font-weight:800;font-size:calc(var(--u)*2.4px);padding:.7em 1em;border-radius:99px;transform:rotate(${(4+r()*8).toFixed(0)}deg)">${icon(st().accentIcon)} ${esc(s.kicker)||'NOVO'}</div>
    </div>
    <div class="abs" style="left:0;top:0;bottom:0;width:50%;padding:calc(var(--u)*7px);display:flex;flex-direction:column;justify-content:space-between">
      ${logoHTML()}
      <div style="display:flex;flex-direction:column;gap:calc(var(--u)*2.4px)">
        <div style="${persp}">${titleHTML(s, r, (5.2+r()*1.4).toFixed(1))}</div>
        <p data-anim="fade-up" style="--d:.55s;font-size:calc(var(--u)*${F.fitS(2.6, s)}px);line-height:1.5;opacity:.88">${nl(s.sub)}</p>
        ${st().cta?`<span data-anim="pop" style="--d:.8s;align-self:flex-start;display:inline-flex">${F.dsys.cta(X.ui.cta, X, st().cta, '.8s')}</span>`:''}
      </div>
      ${F.dsys.handle(X.ui.handle, X, '1s')}
    </div>${fxHTML()}${slideBadge()}`);
  }});

  /* ------------------------------------------------ GRID SUÍÇO */
  F.templates.register('grid',{n:'Grid Suíço',d:'Linhas técnicas; colunas, fundo e tratamento variam.',
   mini:'<path d="M25 0V44 M50 0V44 M75 0V44 M0 15H100 M0 30H100" stroke="#2c2f38"/><rect x="8" y="18" width="50" height="8" rx="1" fill="#eceef2"/><rect x="8" y="6" width="14" height="4" rx="1" fill="#5ee6c7"/>',
   render(s,r){
    /* S3.3 — migração leve com RESTRIÇÃO DE IDENTIDADE: o corpo suíço
       (colunas, réguas, mono) é intocado; variam apenas o esquema de
       superfície e as variantes de handle/ação do design system */
    const X = F.composeSpec(r,'grid'), SW = F.schemeVars(X);
    const cols = pick(r,[4,5,6]), tn = tone(r);
    let lines='';
    for(let i=1;i<cols;i++) lines += `<div class="abs" data-anim="line-y" style="--d:${(i*.06).toFixed(2)}s;--dur:.7s;left:${(100/cols*i).toFixed(2)}%;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--b-fg) 14%,transparent)"></div>`;
    lines += `<div class="abs" data-anim="line" style="--d:.3s;left:0;right:0;top:26%;height:1px;background:color-mix(in srgb,var(--b-fg) 14%,transparent)"></div>
              <div class="abs" data-anim="line" style="--d:.4s;left:0;right:0;bottom:20%;height:1px;background:color-mix(in srgb,var(--b-fg) 14%,transparent)"></div>`;
    const bg = s.img && s.mask==='cover' ? bgImage(s.img, veilFull)
      : pick(r,[F.bgs.get('dots'), F.bgs.get('gridpaper'), F.bgs.get('spotlight'), r2=>`<div class="abs" style="inset:0;background:var(--b-bg)"></div>`])(r);
    const cell = s.img && s.mask!=='cover'
      ? `<div class="abs" data-anim="clip-up" style="--d:.5s;--dur:1s;right:${(100/cols*0.15).toFixed(1)}%;top:29%;width:${(100/cols*1.7).toFixed(1)}%;aspect-ratio:1">${imgHTML(s.img,{circle:'mask-circle',blob:'mask-blob',arch:'mask-arch',window:'mask-window'}[s.mask]||'mask-window','style="position:absolute;inset:0"')}</div>` : '';
    return F.schemeWrap(SW, `${bg}${lines}${cell}
    <div class="abs" style="left:calc(var(--u)*6px);top:calc(var(--u)*5px);right:calc(var(--u)*6px);display:flex;justify-content:space-between;align-items:center">
      ${logoHTML()}
      <span class="kicker" data-anim="clip" style="--d:.2s;color:var(--b-${tn})">${esc(s.kicker)}</span>
    </div>
    <div class="abs" style="left:calc(var(--u)*6px);right:calc(var(--u)*6px);top:31%;display:flex;flex-direction:column;gap:calc(var(--u)*2.6px)">
      ${titleHTML(s, r, (6.4+r()*1.4).toFixed(1), s.img&&s.mask!=='cover'?'max-width:9em;':'')}
      <div style="display:flex;gap:calc(var(--u)*1.4px);align-items:center">
        <span data-anim="pop" style="--d:1s;color:var(--b-${tn});font-size:calc(var(--u)*2.6px);display:flex">${icon(st().accentIcon)}</span>
        <p data-anim="slide-l" style="--d:1.05s;font-size:calc(var(--u)*${F.fitS(2.6, s)}px);opacity:.88;max-width:34em">${nl(s.sub)}</p>
      </div>
    </div>
    <div class="abs" style="left:calc(var(--u)*6px);right:calc(var(--u)*6px);bottom:calc(var(--u)*5px);display:flex;justify-content:space-between;align-items:center">
      ${F.dsys.handle(X.ui.handle, X, '1.2s')}
      ${st().cta?`<span data-anim="pop" style="--d:1.3s;display:inline-flex">${F.dsys.cta(X.ui.cta, X, st().cta, '1.3s')}</span>`:''}
    </div>${fxHTML()}${slideBadge()}`);
  }});
})(window.FORMA);

</script>
<script>
/* ===== js/templates/extra.js ===== */
/* =====================================================
   FORJE·studio — templates/extra.js
   Templates de ASSINATURA — cartaz, editorial, duotone,
   sticker. Este arquivo é também o modelo de como uma
   biblioteca de templates cresce: registre e pronto.
   ===================================================== */
(function(F){
  const {esc, nl, letters, pick, logoHTML, imgHTML, bgImage, floatImage, icon, fxHTML, slideBadge, mixTitle, fancyTitle} = F;
  const st = () => F.state;

  /* faixa marquee reutilizável */
  function marquee(words, pos, dur, style=''){
    const seq = (words.join('  ✦  ')+'  ✦  ').repeat(2);
    return `<div class="marq" style="${pos}"><div class="in" style="--mdur:${dur}s">
      <span class="fh" style="${style}">${esc(seq)}</span><span class="fh" style="${style}">${esc(seq)}</span></div></div>`;
  }

  /* ------------------------------------------------ CARTAZ (brutalista) */
  F.templates.register('poster',{n:'Cartaz',d:'Tipografia monumental vazada, faixa marquee, número de série.',
   mini:'<rect width="100" height="44" fill="#1a1a1e"/><text x="6" y="24" font-size="17" fill="none" stroke="#eceef2" stroke-width=".8" font-weight="900" font-family="sans-serif">AaBb</text><rect x="0" y="34" width="100" height="6" fill="#ffb020"/>',
   render(s,r){
    /* S3.3 — migração leve: identidade preservada; o esquema de
       superfície (C8) recolore a arte via cascata de vars */
    const _X = F.composeSpec(r,'poster'), _SW = F.schemeVars(_X);
    const _fin = F.composeFinish(r, _X);
    const invert = r()<.3;                 // às vezes fundo accent
    const bgc = invert ? 'var(--b-ac)' : 'var(--b-bg)';
    const fgc = invert ? 'var(--b-bg)' : 'var(--b-fg)';
    const rot = (r()*3-1.5).toFixed(2);
    const num = String(Math.floor(r()*98)+1).padStart(2,'0');
    const img = s.img
      ? (s.mask==='cover'
          ? `<div class="abs duo" data-anim="fade" style="--dur:1.2s;right:0;top:0;bottom:0;width:44%;overflow:hidden">${imgHTML(s.img,'','style="position:absolute;inset:0"')}</div>`
          : floatImage(s.img, s.mask, `right:6%;top:9%;width:24%;aspect-ratio:1;transform:rotate(${(r()*10-5).toFixed(1)}deg)`))
      : '';
    return F.schemeWrap(_SW, `
    <div class="abs" style="inset:0;background:${bgc};color:${fgc}"></div>${_fin}${img}
    <div class="abs" style="left:calc(var(--u)*6px);top:calc(var(--u)*5px);display:flex;align-items:center;gap:1em;color:${fgc}">
      ${logoHTML()}<span class="kicker" data-anim="clip" style="--d:.15s">${esc(s.kicker)}</span></div>
    <div class="abs fh fm" data-anim="fade" style="--d:.3s;right:calc(var(--u)*6px);top:calc(var(--u)*4px);font-size:calc(var(--u)*7px);font-weight:800;color:${fgc};opacity:.25">Nº${num}</div>
    <div class="abs" style="left:calc(var(--u)*6px);right:${s.img&&s.mask==='cover'?'46%':'calc(var(--u)*6px)'};top:50%;transform:translateY(-52%) rotate(${rot}deg)">
      <h1 class="fh" data-anim="clip-up" style="--dur:1.1s;--hc:${fgc};font-size:calc(var(--u)*${F.fitT((9+r()*3).toFixed(1), s)}px);line-height:.96;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;color:${fgc}">${mixTitle(s.title, r, ['','tHollow'])}</h1>
      <p data-anim="fade-up" style="--d:.7s;margin-top:calc(var(--u)*2.4px);font-size:calc(var(--u)*${F.fitS(2.6, s)}px);line-height:1.45;opacity:.85;max-width:26em;color:${fgc}">${nl(s.sub)}</p>
    </div>
    <div class="abs" data-anim="fade" style="--d:.5s;left:0;right:0;bottom:0;height:calc(var(--u)*6px);background:${invert?'var(--b-bg)':'var(--b-ac)'};color:${invert?'var(--b-fg)':'var(--b-bg)'};display:flex;align-items:center;overflow:hidden">
      ${marquee([st().brand.handle, st().cta||'FORMA', s.kicker||''].filter(Boolean),
        'top:50%;transform:translateY(-50%)', 12,
        `font-size:calc(var(--u)*2.6px);font-weight:800;letter-spacing:.08em;text-transform:uppercase`)}
    </div>${fxHTML()}${slideBadge()}`);
  }});

  /* ------------------------------------------------ EDITORIAL */
  F.templates.register('editorial',{n:'Editorial',d:'Revista: réguas, colunas, imagem duotone, fólio.',
   mini:'<rect width="100" height="44" fill="#f4f1ea"/><path d="M6 8H94 M6 12H60" stroke="#1a1a1e" stroke-width="1"/><rect x="6" y="18" width="52" height="6" fill="#1a1a1e"/><rect x="64" y="16" width="30" height="22" fill="#8a86d8"/>',
   render(s,r){
    /* S3.3 — migração leve: identidade preservada; o esquema de
       superfície (C8) recolore a arte via cascata de vars */
    const _X = F.composeSpec(r,'editorial'), _SW = F.schemeVars(_X);
    /* variação interna de revista: lado da imagem, corpo/peso do título,
       colunas e régua — a identidade (réguas + fólio + duotone) fica */
    const flip = r()<.35;
    const tsz = (5.6+r()*1.6).toFixed(1), tw = pick(r,[500,600,600,700]);
    const barw = (7+r()*9).toFixed(0);
    const cols = (s.sub && s.sub.length>90) ? (r()<.7?2:1) : 1;
    const img = s.img
      ? (s.mask==='cover'
        ? `<div class="abs duo" data-anim="clip" style="--dur:1.1s;${flip?'left':'right'}:calc(var(--u)*6px);top:calc(var(--u)*14px);bottom:calc(var(--u)*14px);width:34%;overflow:hidden">${imgHTML(s.img,'','style="position:absolute;inset:0"')}</div>`
        : floatImage(s.img, s.mask, `${flip?'left':'right'}:8%;top:50%;transform:translateY(-50%);width:28%;aspect-ratio:1`))
      : `<div class="abs" data-anim="fade" style="--d:.4s;${flip?'left':'right'}:calc(var(--u)*6px);top:calc(var(--u)*14px);bottom:calc(var(--u)*14px);width:34%">${imgHTML(null,'','style="position:absolute;inset:0"')}</div>`;
    return F.schemeWrap(_SW, `
    <div class="abs" style="inset:0;background:var(--b-bg)"></div>
    <div class="abs" data-anim="line" style="left:calc(var(--u)*6px);right:calc(var(--u)*6px);top:calc(var(--u)*10px);height:calc(var(--u)*0.35px);background:var(--b-fg)"></div>
    <div class="abs" data-anim="line" style="--d:.15s;left:calc(var(--u)*6px);right:calc(var(--u)*6px);bottom:calc(var(--u)*10px);height:calc(var(--u)*0.18px);background:color-mix(in srgb,var(--b-fg) 50%,transparent)"></div>
    <div class="abs" style="left:calc(var(--u)*6px);right:calc(var(--u)*6px);top:calc(var(--u)*5px);display:flex;justify-content:space-between;align-items:baseline">
      ${logoHTML('fade','.05s')}
      <span class="fm" data-anim="fade" style="--d:.2s;font-size:calc(var(--u)*2px);letter-spacing:.14em;opacity:.7">${esc(s.kicker).toUpperCase()} — ${new Date().getFullYear()}</span></div>
    ${img}
    <div class="abs" style="left:${flip?'44%':'calc(var(--u)*6px)'};width:52%;top:calc(var(--u)*15px);display:flex;flex-direction:column;gap:calc(var(--u)*2.6px)">
      <h1 class="fh" data-anim="blur" style="--dur:1s;font-size:calc(var(--u)*${F.fitT(tsz, s)}px);line-height:1.04;font-weight:${tw};letter-spacing:-.01em">${fancyTitle(s.title, r)}</h1>
      <div class="bar" data-anim="line" style="--d:.7s;width:calc(var(--u)*${barw}px);height:calc(var(--u)*0.5px);background:var(--b-${_X.tone})"></div>
      <p data-anim="fade-up" style="--d:.85s;font-size:calc(var(--u)*${F.fitS(2.4, s)}px);line-height:1.62;opacity:.86;${cols===2?'column-count:2;column-gap:calc(var(--u)*3px);':''}max-width:34em">${nl(s.sub)}</p>
      ${st().cta?`<span data-anim="fade-up" style="--d:1.05s;font-weight:700;font-size:calc(var(--u)*2.5px)"><span class="ub">${esc(st().cta)}</span></span>`:''}
    </div>
    <div class="abs handle" data-anim="fade" style="--d:1.2s;left:calc(var(--u)*6px);bottom:calc(var(--u)*5.5px)">${esc(st().brand.handle)}</div>
    <div class="abs fm" data-anim="fade" style="--d:1.2s;right:calc(var(--u)*6px);bottom:calc(var(--u)*5.5px);font-size:calc(var(--u)*2px);opacity:.6">${String(st().cur+1).padStart(2,'0')}</div>
    ${fxHTML()}${slideBadge()}`);
  }});

  /* ------------------------------------------------ DUOTONE */
  F.templates.register('duotone',{n:'Duotone',d:'Imagem lavada nas cores da marca, tipografia de festival.',
   mini:'<rect width="100" height="44" fill="#4f46e5"/><rect width="100" height="44" fill="url(#g)" opacity=".5"/><text x="5" y="36" font-size="15" fill="#eceef2" font-weight="900" font-family="sans-serif">FORMA</text><rect x="5" y="6" width="22" height="5" fill="#ffb020"/>',
   render(s,r){
    /* S3.3 — migração leve: identidade preservada; o esquema de
       superfície (C8) recolore a arte via cascata de vars */
    const _X = F.composeSpec(r,'duotone'), _SW = F.schemeVars(_X);
    const bg = s.img
      ? `<div class="abs duo" style="inset:0;overflow:hidden">${imgHTML(s.img,'','style="position:absolute;inset:0"')}</div>`
      : `<div class="abs" style="inset:0;background:linear-gradient(160deg,var(--b-p1),var(--b-p2))"></div>`;
    const up = r()<.6;
    return F.schemeWrap(_SW, `${bg}
    <div class="abs" style="inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--b-bg) 30%,transparent),transparent 40%,color-mix(in srgb,var(--b-bg) 55%,transparent))"></div>
    <div class="abs vtext fm" data-anim="clip-up" style="--d:.3s;right:calc(var(--u)*4px);top:calc(var(--u)*6px);font-size:calc(var(--u)*2.2px);letter-spacing:.3em;opacity:.9">${esc(s.kicker).toUpperCase()}</div>
    <div class="abs" style="left:calc(var(--u)*6px);top:calc(var(--u)*5px);display:flex;align-items:center;gap:1em">${logoHTML()}</div>
    <div class="abs" style="left:calc(var(--u)*6px);right:calc(var(--u)*10px);bottom:calc(var(--u)*7px);display:flex;flex-direction:column;gap:calc(var(--u)*2.2px);align-items:flex-start">
      <h1 class="fh" data-anim="letters" style="font-size:calc(var(--u)*${F.fitT((7.4+r()*2).toFixed(1), s)}px);line-height:.98;font-weight:900;${up?'text-transform:uppercase;':''}letter-spacing:-.015em">${letters(s.title)}</h1>
      <p data-anim="fade-up" style="--d:1s;font-size:calc(var(--u)*${F.fitS(2.6, s)}px);line-height:1.5;opacity:.92;max-width:26em">${nl(s.sub)}</p>
      <div style="display:flex;gap:1em;align-items:center">
        ${st().cta?`<span class="cta" data-anim="pop" style="--d:1.2s">${esc(st().cta)} ${icon('arrow-up-right')}</span>`:''}
        <span class="handle" data-anim="fade-up" style="--d:1.3s">${esc(st().brand.handle)}</span>
      </div>
    </div>${fxHTML()}${slideBadge()}`);
  }});

  /* ------------------------------------------------ STICKER */
  F.templates.register('stickers',{n:'Sticker',d:'Adesivos com sombra dura, fundo chapado, humor pop.',
   mini:'<rect width="100" height="44" fill="#ffb020"/><rect x="14" y="10" width="56" height="22" rx="4" fill="#eceef2" stroke="#1a1a1e" stroke-width="2" transform="rotate(-4 42 21)"/><circle cx="80" cy="12" r="7" fill="#22d3ee" stroke="#1a1a1e" stroke-width="2"/>',
   render(s,r){
    /* S3.3 — migração leve: identidade preservada; o esquema de
       superfície (C8) recolore a arte via cascata de vars */
    const _X = F.composeSpec(r,'stickers'), _SW = F.schemeVars(_X);
    const tones = ['var(--b-ac)','var(--b-p1)','var(--b-p2)'];
    const bgc = pick(r, tones);
    const rot = (r()*8-4).toFixed(1);
    const ids = F.icons.ids();
    const badges = [0,1,2].map(i=>{
      const pos = [['left:8%','top:12%'],['right:9%','top:16%'],['right:14%','bottom:14%']][i];
      return `<div class="sticker abs" data-anim="pop" style="--d:${(0.8+i*0.18).toFixed(2)}s;${pos[0]};${pos[1]};width:calc(var(--u)*9px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*4.4px);transform:rotate(${(r()*30-15).toFixed(0)}deg)">
        <span data-anim="float" style="--d:${i*.6}s;display:flex">${icon(pick(r,ids))}</span></div>`;
    }).join('');
    const img = s.img ? floatImage(s.img, s.mask==='cover'?'circle':s.mask, `left:11%;bottom:12%;width:22%;aspect-ratio:1`,'pop') : '';
    return F.schemeWrap(_SW, `
    <div class="abs" style="inset:0;background:${bgc}"></div>
    <div class="abs" style="inset:0;background:radial-gradient(circle at 20% 15%, #ffffff2e, transparent 40%)"></div>
    ${badges}${img}
    <div class="abs" style="left:50%;top:47%;transform:translate(-50%,-50%) rotate(${rot}deg);width:74%">
      <div class="sticker" data-anim="scale" style="--dur:.9s;border-radius:calc(var(--b-r)*1.6px);padding:calc(var(--u)*5px) calc(var(--u)*5.5px);display:flex;flex-direction:column;gap:calc(var(--u)*1.8px);text-align:center;align-items:center">
        <span class="kicker" data-anim="clip" style="--d:.4s;color:var(--b-p1)">${esc(s.kicker)}</span>
        <h1 class="fh" data-anim="pop" style="--d:.5s;font-size:calc(var(--u)*6px);line-height:1.02;font-weight:900">${nl(s.title)}</h1>
        <p data-anim="fade-up" style="--d:.7s;font-size:calc(var(--u)*${F.fitS(2.4, s)}px);line-height:1.45;opacity:.8;max-width:26em">${nl(s.sub)}</p>
        ${st().cta?`<span class="cta" data-anim="pop" style="--d:.9s;background:var(--b-p1);color:var(--b-bg)">${esc(st().cta)}</span>`:''}
      </div>
    </div>
    <div class="abs" style="left:calc(var(--u)*6px);top:calc(var(--u)*5px)">${logoHTML()}</div>
    <div class="abs handle" data-anim="fade-up" style="--d:1.1s;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*4.5px);color:var(--b-bg)">${esc(st().brand.handle)}</div>
    ${fxHTML()}${slideBadge()}`);
  }});

})(window.FORMA);

</script>
<script>
/* ===== js/templates/doc.js ===== */
/* =====================================================
   FORJE·studio — templates/doc.js
   Templates orientados a DOCUMENTO, desenhados para os
   novos formatos E-book A4 e Apresentação 16:9 (e para a
   exportação PDF/PPTX) — mas funcionam em qualquer formato.
   · capa      — capa de e-book / abertura de deck
   · capitulo  — abertura de capítulo/seção com número monumental
   · topicos   — slide de conteúdo: cada linha do texto vira um bullet
   ===================================================== */
(function(F){
  const {esc, nl, letters, pick, logoHTML, bgImage, floatImage, icon, fxHTML, slideBadge, fancyTitle} = F;
  const st = () => F.state;
  const veilFull = `linear-gradient(180deg,color-mix(in srgb,var(--b-bg) 60%,transparent),color-mix(in srgb,var(--b-bg) 90%,transparent))`;
  const bullets = s => String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);

  /* ------------------------------------------------ CAPA */
  F.templates.register('capa',{n:'Capa de e-book',d:'Capa editorial com moldura, título monumental e assinatura da marca. Feita para o formato E-book A4 e aberturas de apresentação.',
   mini:'<rect x="10" y="4" width="80" height="36" rx="3" fill="none" stroke="#5ee6c7" stroke-width="1.6"/><rect x="18" y="16" width="64" height="7" rx="2" fill="#eceef2"/><rect x="18" y="27" width="34" height="3" rx="1.5" fill="#5ee6c7"/><rect x="40" y="8" width="20" height="3" rx="1.5" fill="#9aa0ad"/>',
   render(s,r){
    const tn = pick(r,['ac','ac','p2']);
    const frame = pick(r,['full','full','corners']);
    const bg = s.img && s.mask==='cover'
      ? bgImage(s.img, veilFull)
      : `<div class="abs" style="inset:0;background:radial-gradient(130% 90% at 50% ${pick(r,['0%','100%'])},color-mix(in srgb,var(--b-p1) ${Math.floor(14+r()*14)}%,var(--b-bg)),var(--b-bg) 62%)"></div>${r()<.6?F.bgOf(r):''}`;
    const floatImg = s.img && s.mask!=='cover'
      ? floatImage(s.img, s.mask, `left:50%;transform:translateX(-50%);top:9%;width:${(26+r()*8).toFixed(0)}%;aspect-ratio:1`) : '';
    const frameHTML = frame==='full'
      ? `<div class="abs" data-anim="fade" style="inset:calc(var(--u)*3.4px);border:calc(var(--u)*0.28px) solid color-mix(in srgb,var(--b-fg) 40%,transparent);border-radius:calc(var(--b-r)*0.6px);pointer-events:none"></div>`
      : `<div class="abs" data-anim="fade" style="left:calc(var(--u)*3.4px);top:calc(var(--u)*3.4px);width:calc(var(--u)*10px);height:calc(var(--u)*10px);border-left:calc(var(--u)*0.5px) solid var(--b-${tn});border-top:calc(var(--u)*0.5px) solid var(--b-${tn})"></div>
         <div class="abs" data-anim="fade" style="right:calc(var(--u)*3.4px);bottom:calc(var(--u)*3.4px);width:calc(var(--u)*10px);height:calc(var(--u)*10px);border-right:calc(var(--u)*0.5px) solid var(--b-${tn});border-bottom:calc(var(--u)*0.5px) solid var(--b-${tn})"></div>`;
    return `${bg}${frameHTML}${floatImg}
    <div class="abs" style="inset:0;padding:calc(var(--u)*9px);display:flex;flex-direction:column;align-items:center;justify-content:${floatImg?'flex-end':'center'};text-align:center;gap:calc(var(--u)*2.4px)">
      <div data-anim="clip" style="display:flex;align-items:center;gap:.7em">
        <i style="display:block;width:calc(var(--u)*6px);height:calc(var(--u)*0.24px);background:var(--b-${tn})"></i>
        <span class="kicker" style="color:var(--b-${tn})">${esc(s.kicker)}</span>
        <i style="display:block;width:calc(var(--u)*6px);height:calc(var(--u)*0.24px);background:var(--b-${tn})"></i></div>
      <h1 class="fh" data-anim="letters" style="font-size:calc(var(--u)*${(7.2+r()*2.2).toFixed(1)}px);line-height:1.04;font-weight:800;letter-spacing:-.015em;max-width:11em">${letters(s.title)}</h1>
      <p data-anim="fade-up" style="--d:.9s;font-size:calc(var(--u)*2.6px);line-height:1.55;opacity:.85;max-width:26em">${nl(s.sub)}</p>
      <div data-anim="fade-up" style="--d:1.1s;margin-top:calc(var(--u)*3px);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.2px)">
        ${logoHTML()}
        <span class="handle">${esc(st().brand.handle)}</span></div>
    </div>${fxHTML()}${slideBadge()}`;
   }});

  /* ------------------------------------------------ CAPÍTULO */
  F.templates.register('capitulo',{n:'Capítulo',d:'Abertura de capítulo/seção: número monumental vazado (do rótulo), título e texto de apoio. Ideal para e-books e divisórias de apresentação.',
   mini:'<text x="8" y="34" font-size="30" font-weight="800" fill="none" stroke="#5ee6c7" stroke-width="1">01</text><rect x="46" y="14" width="46" height="6" rx="2" fill="#eceef2"/><rect x="46" y="24" width="34" height="3" rx="1.5" fill="#9aa0ad"/>',
   render(s,r){
    const tn = pick(r,['ac','ac','p1','p2']);
    const num = (s.kicker||'01').replace(/[^\dA-Za-z]/g,'').slice(0,3) || '01';
    const side = pick(r,['row','col','col']);
    const bg = s.img && s.mask==='cover' ? bgImage(s.img, veilFull)
      : `<div class="abs" style="inset:0;background:linear-gradient(${Math.floor(r()*360)}deg,color-mix(in srgb,var(--b-p1) 12%,var(--b-bg)),var(--b-bg) 60%)"></div>${r()<.5?F.bgOf(r):''}`;
    const floatImg = s.img && s.mask!=='cover'
      ? floatImage(s.img, s.mask, `right:${(6+r()*5).toFixed(0)}%;bottom:${(8+r()*6).toFixed(0)}%;width:${(20+r()*7).toFixed(0)}%;aspect-ratio:1`) : '';
    const numHTML = `<b class="fh" data-anim="blur" style="font-size:calc(var(--u)*${side==='row'?22:26}px);line-height:.85;font-weight:800;color:transparent;-webkit-text-stroke:calc(var(--u)*0.22px) var(--b-${tn});opacity:.9">${esc(num)}</b>`;
    return `${bg}${floatImg}
    <div class="abs" style="inset:0;padding:calc(var(--u)*8px);display:flex;flex-direction:${side==='row'?'row':'column'};align-items:${side==='row'?'center':'flex-start'};justify-content:${side==='row'?'flex-start':'center'};gap:calc(var(--u)*${side==='row'?5:2.4}px)">
      ${numHTML}
      <div style="display:flex;flex-direction:column;gap:calc(var(--u)*2.2px);max-width:${side==='row'?'60%':'80%'}">
        <span class="kicker" data-anim="clip" style="color:var(--b-${tn})">${esc(s.kicker)}</span>
        <h1 class="fh" data-anim="clip-up" style="--dur:1s;font-size:calc(var(--u)*${(5.6+r()*1.6).toFixed(1)}px);line-height:1.06;font-weight:800;letter-spacing:-.012em">${fancyTitle(s.title, r)}</h1>
        <div class="bar" data-anim="line" style="--d:.9s;width:calc(var(--u)*${(9+r()*8).toFixed(0)}px);background:var(--b-${tn})"></div>
        <p data-anim="fade-up" style="--d:1.05s;font-size:calc(var(--u)*2.6px);line-height:1.55;opacity:.86;max-width:30em">${nl(s.sub)}</p>
      </div>
      <div class="abs" style="left:calc(var(--u)*8px);right:calc(var(--u)*8px);bottom:calc(var(--u)*5px);display:flex;justify-content:space-between;align-items:center">
        ${logoHTML()}
        <span class="handle" data-anim="fade-up" style="--d:1.2s">${esc(st().brand.handle)}</span></div>
    </div>${fxHTML()}${slideBadge()}`;
   }});

  /* ------------------------------------------------ TÓPICOS */
  F.templates.register('topicos',{n:'Tópicos',d:'Slide de conteúdo: cada linha do texto vira um bullet com marcador da marca. O par perfeito da exportação PPTX/PDF.',
   mini:'<rect x="8" y="7" width="52" height="6" rx="2" fill="#eceef2"/><circle cx="12" cy="21" r="2.4" fill="#5ee6c7"/><rect x="18" y="19" width="56" height="4" rx="2" fill="#9aa0ad"/><circle cx="12" cy="30" r="2.4" fill="#5ee6c7"/><rect x="18" y="28" width="44" height="4" rx="2" fill="#9aa0ad"/><circle cx="12" cy="39" r="2.4" fill="#5ee6c7"/><rect x="18" y="37" width="50" height="4" rx="2" fill="#9aa0ad"/>',
   render(s,r){
    const tn = pick(r,['ac','ac','p2']);
    const mk = pick(r,['dot','num','check']);
    const its = bullets(s.sub);
    const list = its.length ? its : ['Adicione uma linha por tópico no campo de texto.','Cada linha vira um bullet como este.','A hierarquia sai pronta no PDF e no PPTX.'];
    const fs = list.length>6 ? 2.5 : list.length>4 ? 2.8 : 3.2;
    const marker = i => mk==='num'
      ? `<b class="fm" style="flex:0 0 auto;width:calc(var(--u)*3.6px);height:calc(var(--u)*3.6px);border-radius:50%;border:calc(var(--u)*0.22px) solid var(--b-${tn});color:var(--b-${tn});display:grid;place-items:center;font-size:calc(var(--u)*1.7px);font-weight:700">${i+1}</b>`
      : mk==='check'
      ? `<b style="flex:0 0 auto;width:calc(var(--u)*3.2px);height:calc(var(--u)*3.2px);border-radius:50%;background:var(--b-${tn});color:var(--b-bg);display:grid;place-items:center;font-size:calc(var(--u)*1.8px)">${icon('check')}</b>`
      : `<b style="flex:0 0 auto;width:calc(var(--u)*1.6px);height:calc(var(--u)*1.6px);border-radius:50%;background:var(--b-${tn});margin-top:calc(var(--u)*${(fs*.62).toFixed(2)}px)"></b>`;
    const floatImg = s.img
      ? floatImage(s.img, s.mask==='cover'?'soft':s.mask, `right:${(5+r()*3).toFixed(0)}%;top:50%;transform:translateY(-50%);width:${(24+r()*6).toFixed(0)}%;aspect-ratio:${pick(r,['1','3/4'])}`) : '';
    const bg = `<div class="abs" style="inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--b-p1) 10%,var(--b-bg)),var(--b-bg) 55%)"></div>${r()<.45?F.bgOf(r):''}`;
    return `${bg}${floatImg}
    <div class="abs" style="inset:0;padding:calc(var(--u)*7px) calc(var(--u)*8px);display:flex;flex-direction:column;gap:calc(var(--u)*3.4px)">
      <div style="display:flex;flex-direction:column;gap:calc(var(--u)*1.4px);max-width:${floatImg?'62%':'100%'}">
        <span class="kicker" data-anim="clip" style="color:var(--b-${tn})">${esc(s.kicker)}</span>
        <h1 class="fh" data-anim="clip-up" style="--dur:.9s;font-size:calc(var(--u)*${F.fitT((4.6+r()*1.2).toFixed(1), s)}px);line-height:1.08;font-weight:800;letter-spacing:-.012em">${fancyTitle(s.title, r)}</h1>
        <div class="bar" data-anim="line" style="--d:.8s;width:calc(var(--u)*9px);background:var(--b-${tn})"></div></div>
      <div style="display:flex;flex-direction:column;gap:calc(var(--u)*${list.length>5?1.8:2.4}px);max-width:${floatImg?'58%':'74%'};flex:1;justify-content:flex-start">
        ${list.map((t,i)=>`<div data-anim="slide-r" style="--d:${(.7+i*.14).toFixed(2)}s;display:flex;gap:calc(var(--u)*1.8px);align-items:${mk==='dot'?'flex-start':'center'}">
          ${marker(i)}<span style="font-size:calc(var(--u)*${fs}px);line-height:1.45;opacity:.92">${esc(t)}</span></div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        ${logoHTML()}
        <span class="handle" data-anim="fade-up" style="--d:1.3s">${esc(st().brand.handle)}</span></div>
    </div>${fxHTML()}${slideBadge()}`;
   }});
})(window.FORMA);

</script>
<script>
/* ===== js/motion/scenes.js ===== */
/* =====================================================
   FORJE·studio — motion/scenes.js
   Cenas: blocos compositáveis da timeline de motion.
   Contrato: FORMA.scenes.register(id, {
     n, d, dur (padrão ms), fields:[campos editáveis],
     render(scene, rng?) -> html  // rng opcional (fase 1.3):
     derivado de seedOf('layout') por cena; cenas que não o usam
     permanecem idênticas (retrocompatível)
   })
   Campos possíveis: kicker,title,sub,icon,img,value,suffix,items,cta
   Contadores: elementos com [data-count][data-to][data-suffix]
   são atualizados pelo player conforme o tempo da cena.
   ===================================================== */
(function(F){
  const {esc, nl, letters, logoHTML, imgHTML, bgImage, floatImage, icon, fxHTML, sceneBG, sceneFloat} = F;
  const st = () => F.state;
  const center = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*2.6px);padding:calc(var(--u)*8px)';

  /* -------------------------------------------- ABERTURA / LOGO */
  F.scenes.register('intro',{n:'Abertura de logo',d:'Logo revela com anel desenhado.',dur:2400,fields:['kicker'],
   render(s){ return `
    ${sceneBG(s,`radial-gradient(70% 70% at 50% 45%,color-mix(in srgb,var(--b-p1) 18%,var(--b-bg)),var(--b-bg))`)}
    <div style="${center}">
      <div class="abs" data-anim="draw" style="--dash:640;--dur:1.2s;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--u)*34px);aspect-ratio:1;color:var(--b-ac)">
        <svg class="ic" viewBox="0 0 200 200" style="width:100%;height:100%;stroke-width:2"><circle cx="100" cy="100" r="96"/></svg></div>
      <div data-anim="blur" style="--d:.5s;--dur:1s;transform:scale(1.6)">${st().brand.logo
        ? `<img class="logo" style="height:calc(var(--u)*10px)" src="${st().brand.logo}" alt="">`
        : `<div class="logotype" style="font-size:calc(var(--u)*6px)">${esc(st().brand.name)}</div>`}</div>
      ${s.kicker?`<div class="kicker" data-anim="fade-up" style="--d:1.1s;color:var(--b-ac);margin-top:calc(var(--u)*8px)">${esc(s.kicker)}</div>`:''}
    </div>${sceneFloat(s)}${fxHTML()}`; }});

<script>
/* ===== js/motion/player.js ===== */
/* =====================================================
   FORJE·studio — motion/player.js
   Compositor de timeline: reproduz as cenas em sequência
   com transições de saída, atualiza contadores e expõe
   utilidades de "time-stepping" determinístico usadas
   pelo export de vídeo (frames exatos, sem tempo real).
   ===================================================== */
(function(F){
  const art = () => document.getElementById('art');
  const EXIT_MS = 450;

  F.player = { playing:false, _tok:0 };

  /* monta o HTML de uma cena numa camada */
  F.mountScene = function(idx){
    const sc = F.state.timeline[idx]; if(!sc) return null;
    const def = F.scenes.get(sc.type); if(!def) return null;
    const layer = document.createElement('div');
    layer.className = 'scenelayer';
    if(sc.enter && sc.enter!=='none') layer.classList.add('enter-'+sc.enter);
    /* fase 1.3: rng de variação por cena, derivado do eixo de layout —
       cenas não migradas ignoram o parâmetro (retrocompatível) */
    layer.innerHTML = def.render(sc, F.sceneRng ? F.sceneRng(idx) : undefined);
    if(F.composeHTML && F.motionKey)
      layer.insertAdjacentHTML('beforeend', F.composeHTML(F.motionKey(idx)));
    if(F.applyEditsIn && F.motionKey) F.applyEditsIn(layer, F.motionKey(idx));
    return layer;
  };

  /* contadores: valor em função do tempo local da cena */
  F.updateCounters = function(layer, tLocal, durIn=1400, delay=200){
    layer.querySelectorAll('[data-count]').forEach(el=>{
      const to = +el.dataset.to || 0, suf = el.dataset.suffix || '';
      const p = Math.min(1, Math.max(0, (tLocal-delay) / durIn));
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(to*eased).toLocaleString('pt-BR') + (p>=1?suf:suf);
    });
  };

  F.totalDuration = () => F.state.timeline.reduce((a,s)=>a+(+s.dur||2000),0);

  /* ---------- reprodução em tempo real ---------- */
  F.playTimeline = async function(onTick){
    const s = F.state, el = art();
    if(!s.timeline.length) return;
    F.stopTimeline();
    const tok = ++F.player._tok;
    F.player.playing = true;
    el.classList.remove('settle'); el.classList.add('play');
    el.innerHTML = '';
    const total = F.totalDuration();
    let elapsed = 0;
    for(let i=0; i<s.timeline.length && F.player._tok===tok; i++){
      const sc = s.timeline[i], dur = +sc.dur || 2000;
      const layer = F.mountScene(i);
      el.appendChild(layer);
      /* a saída toca DENTRO da janela da cena (visível, igual ao export);
         a próxima cena só monta depois — entrada e saída ficam legíveis */
      const hasExit = i < s.timeline.length-1;
      const exitAt = Math.max(0, dur - EXIT_MS);
      let exited = false;
      const t0 = performance.now();
      await new Promise(res=>{
        const step = ()=>{ if(F.player._tok!==tok) return res();
          const t = performance.now()-t0;
          F.updateCounters(layer, t);
          if(hasExit && !exited && t >= exitAt){
            exited = true;
            layer.classList.add('exiting');                       // saídas de itens compostos
            const x = sc.exit || 'fade';
